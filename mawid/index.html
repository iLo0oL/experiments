<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1417">
<meta name="description" content="حجز مواعيد لمحلك: حلاق، صالون، تصوير، دروس… الزبون يحجز بنفسه وأنت يجيك تنبيه">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="موعد">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>موعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1417;--card:#162026;--card2:#1e2a31;--line:#26343c;--text:#eef4f6;--muted:#93a6ad;--acc:#1fb8a5;--acc2:#3a6ee0;--on:#fff;--ok:#2fcf7a;--warn:#f5a524;--bad:#ff5d62;--info:#4c9bff;--input:#121b20;--sh:0 14px 34px rgba(0,0,0,.42);--r:18px}
body.light{--bg:#f2f6f7;--card:#fff;--card2:#eaf0f2;--line:#dce5e8;--text:#14222a;--muted:#5f7279;--input:#fff;--sh:0 10px 28px rgba(20,50,60,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
svg{flex:none}
.hide{display:none!important}
.ltr{direction:ltr;text-align:left;unicode-bidi:plaintext}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;white-space:nowrap}
.brand img{width:32px;height:32px;border-radius:10px}
.sync{margin-inline-start:auto;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.sync.ok{color:var(--ok)}.sync.bad{color:var(--bad)}.sync.warn{color:var(--warn)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex:none;color:var(--text)}
.ib svg{width:20px;height:20px}
.ib.sm{width:34px;height:34px;border-radius:10px}.ib.sm svg{width:17px;height:17px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:2px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 1px;border-radius:14px;font-size:12px;color:var(--muted);font-weight:700;position:relative;white-space:nowrap}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
.tabs .dotn{position:absolute;top:3px;inset-inline-end:calc(50% - 20px);min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 svg{width:20px;height:20px;color:var(--acc)}
.card p{color:var(--muted);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;font-size:15.5px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 28%,transparent);text-align:center}
.btn.sec{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:none;box-shadow:none;color:var(--acc);padding:8px 10px;min-height:40px}
.btn.danger{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);box-shadow:none}
.btn.wa{background:#1fae5b;box-shadow:0 6px 18px rgba(31,174,91,.28);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 13px;font-size:14px;border-radius:12px}
.btn.xs{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:19px;height:19px}
.btn.xs svg{width:16px;height:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>.btn{flex:1 1 140px}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;min-width:0;color:var(--text)}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.inp.bad{border-color:var(--bad)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.6}
select.inp{appearance:none;-webkit-appearance:none;padding-inline-end:12px;padding-inline-start:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px 50%,11px 50%;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.err{font-size:13.5px;color:var(--bad);margin-top:5px;font-weight:700}
.sw{position:relative;width:50px;height:30px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{transform:translateX(-20px)}
.sw.red input:checked+i{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:700;color:var(--text)}
.chip.on{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:var(--acc);color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14.5px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button b{display:inline-block;min-width:20px;font-size:12px;background:var(--card2);border-radius:99px;padding:0 6px;margin-inline-start:4px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--text);font-size:14px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.info{background:color-mix(in srgb,var(--acc) 10%,transparent);border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
.banner svg{width:20px;height:20px;margin-top:1px}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0}
.linkbox{direction:ltr;text-align:left;font-size:13px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px 12px;word-break:break-all;color:var(--muted);margin-bottom:10px;user-select:all}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.swrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.swrow .grow b{display:block;font-size:15px}
.sep{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.pill.mute{background:var(--card2);color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
/* welcome + wizard */
.hero-w{text-align:center;padding:28px 6px 8px}
.hero-w img{width:92px;height:92px;border-radius:26px;margin:0 auto 14px;box-shadow:var(--sh)}
.hero-w h1{font-size:30px;font-weight:800}
.hero-w p{color:var(--muted);max-width:430px;margin:6px auto 0;font-size:15.5px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.feat svg{width:20px;height:20px;color:var(--acc)}
.wsteps{display:flex;gap:6px;margin:4px 0 16px}
.wsteps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.wsteps i.on{background:var(--acc)}
.wiz h1{font-size:23px;font-weight:800;margin-bottom:4px}
.wiz .sub{color:var(--muted);margin-bottom:16px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.kind{padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:center;font-weight:700;font-size:14px}
.kind span{display:block;font-size:26px;margin-bottom:3px}
.kind.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc)}
.wfoot{display:flex;gap:10px;margin-top:16px}
/* services rows */
.srow{display:grid;grid-template-columns:1fr 112px 84px 34px;gap:8px;align-items:center;margin-bottom:8px}
.srow .inp{padding:9px 10px;font-size:15px}
.svc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.svc:last-child{border-bottom:0}
.svc .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.svc .ic svg{width:21px;height:21px}
/* hours editor */
.day{border-bottom:1px solid var(--line);padding:10px 0}
.day:last-child{border-bottom:0}
.day-h{display:flex;align-items:center;gap:10px}
.day-h b{flex:1;font-size:15.5px}
.day-h .closed{color:var(--muted);font-size:13.5px;font-weight:500}
.rng{display:flex;align-items:center;gap:6px;margin-top:8px}
.rng select{flex:1;padding:8px 8px;padding-inline-start:26px;font-size:14.5px;min-width:0}
.rng .to{color:var(--muted);font-size:13px}
.offd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--card2);margin-bottom:6px}
/* bookings */
.today{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--card2);border-radius:14px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:21px;font-weight:800;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.next{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.next svg{width:20px;height:20px;color:var(--acc)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
.dayhead b{font-size:16px}
.dayhead span{font-size:12.5px;color:var(--muted)}
.bk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;border-inline-start:4px solid var(--info)}
.bk.confirmed{border-inline-start-color:var(--ok)}.bk.done{border-inline-start-color:var(--muted);opacity:.85}.bk.cancelled{border-inline-start-color:var(--bad);opacity:.7}.bk.noshow{border-inline-start-color:var(--warn);opacity:.85}
.bk.fresh{box-shadow:0 0 0 2px color-mix(in srgb,var(--info) 50%,transparent)}
.bk-top{display:flex;align-items:center;gap:8px}
.bk-time{font-weight:800;font-size:16px;direction:rtl}
.bk-name{font-weight:800;font-size:16.5px;margin-top:4px}
.bk-sub{font-size:13.5px;color:var(--muted)}
.bk-note{font-size:13.5px;background:var(--card2);border-radius:10px;padding:6px 10px;margin-top:6px;white-space:pre-line}
.bk-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk-acts .btn{flex:1 1 auto}
.bk.cancelled .bk-name{text-decoration:line-through}
/* sheet + modal + toast */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,10,12,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);color:var(--text);border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s;overscroll-behavior:contain}
.ov.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h3{flex:1;font-size:19px;font-weight:800;min-width:0}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.md{position:fixed;inset:0;z-index:60;background:rgba(5,10,12,.6);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .15s}
.md.open{opacity:1;pointer-events:auto}
.md .box{width:100%;max-width:400px;background:var(--card);color:var(--text);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.md h3{font-size:18px;font-weight:800;margin-bottom:8px}
.md p{color:var(--muted);font-size:15px;margin-bottom:16px;white-space:pre-line}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);z-index:80;background:#18242a;color:#fff;padding:11px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:14px;align-items:center;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);width:max-content}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:#7ee6d6;font-weight:800;white-space:nowrap}
body.cust #toast{bottom:calc(24px + env(safe-area-inset-bottom))}
body.sheet-open #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px)}
body.sheet-open #toast.show{transform:translateX(-50%)}
/* share card */
.qrcard{border:1.5px dashed #b9b9b9;border-radius:7mm;padding:9mm 7mm 7mm;text-align:center;color:#111;background:#fff;font-family:'Tajawal',system-ui,Tahoma,sans-serif;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative;overflow:hidden}
.qrcard .bar{position:absolute;top:0;left:0;right:0;height:4mm}
.qrcard .pl{width:20mm;height:20mm;border-radius:50%;object-fit:cover;margin:0 auto 3mm;border:1px solid #eee}
.qrcard .pn{font-size:21pt;font-weight:800;line-height:1.25}
.qrcard .pd{font-size:11pt;color:#666}
.qrcard .pq{width:62%;margin:5mm auto 4mm;image-rendering:pixelated}
.qrcard .pc{font-size:17pt;font-weight:800}
.qrcard .ps{font-size:10pt;color:#777;direction:ltr;margin-top:1mm}
.pgrid.n1 .qrcard{width:118mm;margin:12mm auto}
.pgrid.n4{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
.pgrid.n4 .qrcard{padding:7mm 5mm 5mm}.pgrid.n4 .qrcard .pn{font-size:15pt}.pgrid.n4 .qrcard .pc{font-size:13pt}.pgrid.n4 .qrcard .pl{width:15mm;height:15mm}
.cardprev .qrcard{width:100%;max-width:300px;margin:0 auto;border-radius:20px;padding:26px 18px 18px}
.cardprev .qrcard .pl{width:62px;height:62px}.cardprev .qrcard .pn{font-size:22px}.cardprev .qrcard .pc{font-size:17px}.cardprev .qrcard .pd,.cardprev .qrcard .ps{font-size:12px}.cardprev .qrcard .bar{height:10px}.cardprev .qrcard .pq{margin:14px auto 10px}
#printArea{display:none}
@media print{@page{size:A4;margin:10mm}html,body{background:#fff!important}body>*:not(#printArea){display:none!important}#printArea{display:block!important}}
/* ===== customer ===== */
.c{min-height:100vh;padding-bottom:40px}
.prevbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#111;color:#fff;font-size:13.5px;font-weight:700}
.prevbar .btn{min-height:34px;padding:5px 12px;font-size:13.5px}
.bh{position:relative;padding:28px 16px 22px;text-align:center;background:linear-gradient(160deg,var(--acc),var(--acc2));color:var(--on);border-radius:0 0 28px 28px;overflow:hidden}
.bh:before{content:"";position:absolute;inset:0;opacity:.14;background-image:radial-gradient(circle at 15% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 65% 70%,#fff 0 2px,transparent 3px);background-size:36px 36px,50px 50px}
.bh>*{position:relative}
.blogo{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;object-fit:cover;border:4px solid rgba(255,255,255,.85);background:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--acc);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.bh h1{font-size:25px;font-weight:800;line-height:1.3}
.bh .ds{opacity:.92;margin-top:4px;font-size:15px;white-space:pre-line}
.bacts{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.bact{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.18);color:inherit;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.25)}
.bact svg{width:17px;height:17px}
.cw{max-width:620px;margin:0 auto;padding:0 16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;scroll-margin-top:12px}
.step h2{font-size:17.5px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step h2 .n{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-size:14px;flex:none}
.step.dim{opacity:.5}

.sv .rd svg{width:13px;height:13px}

.dy{flex:none;width:68px;padding:9px 4px;border-radius:16px;border:1.5px solid var(--line);text-align:center;background:var(--card);color:var(--text);scroll-snap-align:start}
.dy small{display:block;font-size:12px;color:var(--muted);font-weight:700}

.dy.on{border-color:var(--acc);background:var(--acc);color:var(--on)}
.dy.on small,.dy.on i{color:var(--on);opacity:.9}
.dy.full{opacity:.42;background:var(--card2);cursor:not-allowed}
.dy.full i{color:var(--bad);font-weight:700}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sl{padding:11px 4px;border-radius:13px;border:1.5px solid var(--line);font-weight:800;font-size:15px;background:var(--card);color:var(--text);direction:rtl}
.sl.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.slg{font-size:13.5px;color:var(--muted);font-weight:700;margin:12px 2px 8px;display:flex;align-items:center;gap:6px}
.slg:first-child{margin-top:0}
.slg svg{width:17px;height:17px}
.sum{background:var(--card2);border-radius:14px;padding:12px 14px;margin:4px 0 14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14.5px}
.sum div span:first-child{color:var(--muted)}
.sum div span:last-child{font-weight:800;text-align:end}
.done{text-align:center;padding:22px 16px 8px}
.done .ok{width:74px;height:74px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 10px 26px color-mix(in srgb,var(--ok) 40%,transparent)}
.done .ok svg{width:40px;height:40px}
.done h2{font-size:23px;font-weight:800}
.code{font-size:34px;font-weight:800;letter-spacing:6px;direction:ltr;color:var(--acc);background:var(--card2);border-radius:16px;padding:8px 14px;display:inline-block;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.mybk{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mybk:last-child{border-bottom:0}
.cfoot{text-align:center;color:var(--muted);font-size:12.5px;padding:24px 20px 8px}
.cfoot a{color:var(--acc);font-weight:700}
.closedbox{text-align:center;padding:26px 16px}
.closedbox .big{font-size:46px}

function hoursEditor(h) {
  const opts = sel => TIMES.map(t => `<option value="${hhmm(t)}" ${hhmm(t) === sel ? 'selected' : ''}>${t === 1440 ? '12:00 ص (آخر اليوم)' : fmtMin(t)}</option>`).join('');
  return [0, 1, 2, 3, 4, 5, 6].map(d => {
    const r = h[d] || h[String(d)]; const open = Array.isArray(r) && r.length;
    return `<div class="day" data-day="${d}"><div class="day-h"><b>${WD[d]}</b>${open ? `<button class="btn ghost xs" type="button" data-hact="copy" title="انسخ لكل الأيام المفتوحة">انسخ للكل</button>` : '<span class="closed">مقفل</span>'}<label class="sw"><input type="checkbox" data-hact="toggle" ${open ? 'checked' : ''} aria-label="${WD[d]}"><i></i></label></div>
      ${open ? r.map((x, i) => `<div class="rng" data-r="${i}"><select class="inp" data-hf="0">${opts(x[0])}</select><span class="to">إلى</span><select class="inp" data-hf="1">${opts(x[1])}</select>${r.length > 1 ? `<button class="ib sm" type="button" data-hact="rm" aria-label="شيل الفترة">${ico('x')}</button>` : ''}</div>`).join('') + (r.length < 4 ? `<button class="btn ghost xs mt" type="button" data-hact="add">${ico('plus')} فترة ثانية</button>` : '') : ''}</div>`;
  }).join('');
}
function hoursError(h) {
  for (const [d, r] of Object.entries(h)) {
    const rs = r.map(x => [hm(x[0]), hm(x[1])]).sort((a, b) => a[0] - b[0]);
    for (let i = 0; i < rs.length; i++) { if (rs[i][1] <= rs[i][0]) return `${WD[d]}: وقت النهاية لازم يكون بعد البداية`; if (i && rs[i][0] < rs[i - 1][1]) return `${WD[d]}: الفترات متداخلة`; }
  }
  return '';
}
function hoursEvent(t, h) {
  const dayEl = t.closest('[data-day]'); if (!dayEl) return false; const d = dayEl.dataset.day; const act = t.dataset.hact;
  if (act === 'toggle') { if (t.checked) h[d] = [['09:00', '17:00']]; else delete h[d]; }
  else if (act === 'add') { const r = h[d]; const last = hm(r[r.length - 1][1]); const s = Math.min(last + 60, 1380); r.push([hhmm(s), hhmm(Math.min(s + 240, 1440))]); }
  else if (act === 'rm') { const i = +t.closest('[data-r]').dataset.r; h[d].splice(i, 1); }
  else if (act === 'copy') { for (const k of Object.keys(h)) if (k !== d) h[k] = h[d].map(x => [...x]); toast('انسخت أوقات ' + WD[d] + ' لكل الأيام المفتوحة'); }
  else if (t.dataset.hf != null) { const i = +t.closest('[data-r]').dataset.r; h[d][i][+t.dataset.hf] = t.value; }
  else return false;
  return true;
}

const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsDate = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
function icsFold(line) {
  const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line;
  const out = []; let cur = '', size = 0, lim = 75;
  for (const ch of line) { const n = enc.encode(ch).length; if (size + n > lim) { out.push(cur); cur = ''; size = 0; lim = 74; } cur += ch; size += n; }
  out.push(cur); return out.join('\r\n ');
}
function buildIcs(b) {
  const m = meta(), link = isPub() && S.join ? Tajarib.joinLink(baseUrl(), S.docId, S.join.key) : '';
  const desc = [`الخدمة: ${b.sname}`, `رمز الإلغاء: ${b.code}`, m.phone ? `جوال المحل: ${m.phone}` : '', link ? `صفحة الحجز: ${link}` : ''].filter(Boolean).join('\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tajarib//Mawid//AR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT', `UID:${b.id}@mawid.tajarib`, `DTSTAMP:${icsDate(Date.now())}`, `DTSTART:${icsDate(b.start)}`, `DTEND:${icsDate(b.end)}`,
    `SUMMARY:${icsEsc(`${b.sname} - ${m.name || 'موعد'}`)}`, `DESCRIPTION:${icsEsc(desc)}`];
  if (safeUrl(m.loc)) L.push(`LOCATION:${icsEsc(safeUrl(m.loc))}`);
  L.push('STATUS:CONFIRMED', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('تذكير بموعدك'), 'TRIGGER:-PT1H', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

  cShow: el => { const b = J.get(myKey(), []).find(x => x.id === el.dataset.id); if (b) { S.c.done = b; renderCustomer(); } },
  cAgain: () => { const me = J.get('mawid.me', {}) || {}; S.c = { ...me }; renderCustomer(); window.scrollTo(0, 0); refreshBusy(); },
  ics: () => { const b = S.c.done; window.__lastIcs = buildIcs(b); dl(new Blob([window.__lastIcs], { type: 'text/calendar;charset=utf-8' }), 'mawid.ics'); },
  cWa: () => { const b = S.c.done, m = meta(), at = fmtAt(b.start); openWa(m.wa, `السلام عليكم، حجزت موعد عندكم:\nالخدمة: ${b.sname}\nاليوم: ${at.day}\nالوقت: ${at.time}\nالاسم: ${b.name || ''}`); }
};
function scrollStep(sel) { const el = $(sel); if (!el) return; const r = el.getBoundingClientRect(); if (r.top > window.innerHeight * 0.55 || r.top < 0) window.scrollTo({ top: window.scrollY + r.top - 12, behavior: 'smooth' }); }
function addOff(d, silent) { const off = new Set(meta().off || []); off.add(d); putMeta({ off: [...off].filter(x => x >= addDays(todayStr(), -1)).sort() }); if (!silent) toast(`انضافت إجازة: ${fmtDay(d)}`); }
document.addEventListener('click', e => {
  if (e.target.closest('.sw')) return;
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-hact]'); if (!t || t.tagName === 'INPUT') return;
  hoursChanged(t);
});
document.addEventListener('click', e => { const t = e.target.closest('[data-rmsvc]'); if (!t) return; S.wiz.svcs = readSvcRows('#wSvcs'); S.wiz.svcs.splice(+t.dataset.rmsvc, 1); renderWizard(); });
function hoursChanged(t) {
  const h = S.mode === 'wizard' ? S.wiz.hours : JSON.parse(JSON.stringify(meta().hours || {}));
  if (!hoursEvent(t, h)) return;
  if (S.mode === 'wizard') { $('#hoursEd').innerHTML = hoursEditor(h); return; }
  const err = hoursError(h); if (err) { toast(err); $('#hoursEd').innerHTML = hoursEditor(meta().hours || {}); return; }
  putMeta({ hours: h });
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.m) onMetaInput(t);
  if (t.id === 'cName' || t.id === 'cNote') { S.c[t.id === 'cName' ? 'name' : 'note'] = t.value; t.classList.remove('bad'); }
  if (t.id === 'cPhone') { S.c.phone = t.value; t.classList.remove('bad'); const h = $('#phHint'); const p = normPhone(t.value); if (h) { h.textContent = !t.value ? 'رقم سعودي يبدأ بـ05 (10 أرقام)، أو رقم دولي يبدأ بـ+' : p ? `✓ ${showPhone(p)}` : 'اكتبه مثل 05xxxxxxxx'; h.style.color = p ? 'var(--ok)' : ''; } }
});
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.m) flushMeta(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && (t.dataset.hact === 'toggle' || t.dataset.hf != null)) return hoursChanged(t);
  if (t.dataset && t.dataset.rule) { putMeta({ [t.dataset.rule]: +t.value }); return toast('انحفظ ✓'); }
  const c = t.dataset && t.dataset.chg; if (!c) return;
  if (c === 'closed') { putMeta({ closed: t.checked }); toast(t.checked ? 'وقّفت الحجز مؤقتاً' : 'رجع الحجز شغّال ✓'); }
  if (c === 'logo') { const f = t.files[0]; t.value = ''; if (f) compress(f, LOGO).then(d => { S.store.set('logo', { type: 'img', d }); toast('انحفظ الشعار ✓'); }).catch(() => toast('ما قدرت أفتح الصورة، جرّب صورة ثانية')); }
  if (c === 'importFile') { const f = t.files[0]; t.value = ''; if (f) importBackup(f); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (S.mode === 'owner') loadBookings(); if (S.mode === 'customer') refreshBusy(); });
window.addEventListener('hashchange', () => { if (Tajarib.parseJoin(location.hash)) location.reload(); });
window.addEventListener('pagehide', flushMeta);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'push' && S.mode === 'owner') loadBookings(); });

function boot() {
  ownerTheme();
  const j = Tajarib.parseJoin(location.hash); if (j) return openJoin(j);
  const e = curEntry(); if (e) return openOwnerDoc(e);
  if (LS.get('mawid.draft')) return openDraft();
  const m = mine(); if (m.length) { LS.set('mawid.cur', m[0].id); return openOwnerDoc(m[0]); }
  S.mode = 'welcome'; render();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
