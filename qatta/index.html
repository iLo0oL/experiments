<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<meta name="description" content="قسّم مصاريف الطلعات والسفرات والسكن مع الشلة، واعرف مين له ومين عليه">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القطّة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>القطّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1217;--card:#181c24;--card2:#20252e;--card3:#272d38;--line:#2a303b;--input:#12161c;
  --text:#eef1f5;--muted:#9aa3b2;--faint:#6c7584;
  --acc:#ffb547;--acc2:#ff7f57;--ink:#2a1602;--acc-bg:rgba(255,181,71,.13);--acc-line:rgba(255,181,71,.45);
  --pos:#43d39c;--neg:#ff7f8e;--pos-bg:rgba(67,211,156,.12);--neg-bg:rgba(255,127,142,.12);
  --bar:#ffb547;--toast:#2b313b;--scrim:rgba(4,6,10,.62);--shadow:0 12px 34px rgba(0,0,0,.38);--r:18px;
}
body.light{
  --bg:#f6f3ee;--card:#ffffff;--card2:#f2eee7;--card3:#e9e4da;--line:#e4ded3;--input:#ffffff;
  --text:#1f1b16;--muted:#6b645a;--faint:#9b9388;
  --acc:#f29d22;--acc2:#f0703f;--ink:#2a1602;--acc-bg:rgba(242,157,34,.13);--acc-line:rgba(226,140,20,.5);
  --pos:#0c9460;--neg:#d23a57;--pos-bg:rgba(12,148,96,.1);--neg-bg:rgba(210,58,87,.09);
  --bar:#e48d16;--toast:#2b2620;--scrim:rgba(30,24,16,.45);--shadow:0 10px 28px rgba(70,50,20,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.5;transition:background .2s,color .2s}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none;font-size:16px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:64px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.i.xs{width:15px!important;height:15px!important}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.screen{max-width:620px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
/* الهيدر */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;margin:0 -16px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg)}
.top.sc{box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;flex:1;min-width:0;padding-inline-start:4px}
.brand img{width:34px;height:34px;border-radius:10px}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--text);flex:none}
.icon-btn:hover{background:var(--card2)}
.icon-btn:active{transform:scale(.94)}
/* عام */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:16px;font-weight:800;margin-bottom:2px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2);color:var(--text);white-space:nowrap;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn.dghost{background:var(--neg-bg);color:var(--neg)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px}
.btn.wide{flex:1;width:100%}
.btn svg.i{width:19px;height:19px}
.link{color:var(--acc);font-weight:700;font-size:14px;padding:4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid transparent;font-size:14px;font-weight:500;max-width:100%}
.chip.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--text);font-weight:700}
.chip .ck{width:18px;height:18px;border-radius:6px;border:2px solid var(--faint);display:grid;place-items:center;flex:none}
.chip.on .ck{background:var(--acc);border-color:var(--acc)}
.chip.on .ck:after{content:"";width:8px;height:4px;border:2.5px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 3px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
body.light .seg button.on{background:#fff}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:#1a1206;background:var(--c,#999)}
.av.s{width:24px;height:24px;font-size:11px}
.me-tag{font-size:11px;font-weight:800;background:var(--acc-bg);color:var(--acc);padding:1px 7px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.tag{font-size:11px;font-weight:700;background:var(--card2);color:var(--muted);padding:2px 8px;border-radius:999px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:52px;line-height:1.1;margin-bottom:10px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px;text-wrap:balance}
.empty p{text-wrap:pretty;max-width:420px;margin-inline:auto}
.view-note b{color:var(--acc)}
/* الرئيسية */
.gcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;transition:transform .1s}
.gcard:active{transform:scale(.985)}
.gemo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.gmain{flex:1;min-width:0}
.gmain b{display:block;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmain small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.gbal{text-align:end;font-size:13px;flex:none;max-width:42%}
.gbal b{display:block;font-size:15px}
.hello{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 20%,var(--card)),var(--card));}
.joinbox{display:flex;gap:8px;margin-top:6px}
.joinbox input{flex:1;min-width:0;font-size:14px}
details.arch summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
details.arch summary::-webkit-details-marker{display:none}
details.arch summary:after{content:"‹";transform:rotate(-90deg);display:inline-block;transition:transform .2s}
details.arch[open] summary:after{transform:rotate(90deg)}
/* القطّة */
.gtitle{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.gtitle .gemo{width:40px;height:40px;font-size:21px;border-radius:13px}
.gtitle b{display:block;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtitle small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--pos)}.dot.saving{background:var(--acc);animation:pulse 1s infinite}.dot.offline{background:var(--faint)}.dot.error{background:var(--neg)}.dot.idle{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero{display:flex;gap:12px;align-items:stretch;background:linear-gradient(135deg,color-mix(in srgb,var(--gc,var(--acc)) 24%,var(--card)) 0%,var(--card) 70%)}
.hero .tot{flex:1;min-width:0}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .val{font-size:28px;font-weight:800;line-height:1.2;margin-top:2px}
.hero .val small{font-size:14px;font-weight:700;color:var(--muted);margin-inline-start:4px}
.hero .mine{flex:none;text-align:end;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;max-width:48%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-weight:800;font-size:15px}
.pill.pos{background:var(--pos-bg)}.pill.neg{background:var(--neg-bg)}.pill.zero{background:var(--card2);color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:4px;margin-bottom:12px;position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:10}
.tabs button{flex:1;padding:10px 4px;border-radius:11px;font-weight:700;color:var(--muted);font-size:15px}
.tabs button.on{background:var(--acc);color:var(--ink)}
.search{position:relative;margin-bottom:10px}
.search input{padding-inline-start:40px;border-radius:14px;background:var(--card)}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--faint);width:19px;height:19px}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:start;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.ric{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none;position:relative}
.ric .clip{position:absolute;bottom:-3px;inset-inline-start:-3px;font-size:12px;background:var(--card);border-radius:6px;padding:0 2px}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmain small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ramt{text-align:end;flex:none}
.ramt b{display:block;font-weight:800}
.ramt small{display:block;font-size:12.5px;font-weight:700}
.row.settle .ric{background:var(--pos-bg)}
.row.bad .rmain small{color:var(--neg)}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:15;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;padding:14px 26px;border-radius:999px;box-shadow:0 10px 28px rgba(255,127,87,.35);display:flex;gap:8px;align-items:center;font-size:16px;white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab svg.i{stroke-width:2.6}
.banner{border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--neg-bg);border:1px solid color-mix(in srgb,var(--neg) 40%,transparent)}
.banner p{margin-bottom:10px;font-size:14px}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap}
.notice{border-radius:14px;padding:11px 13px;margin-bottom:12px;background:var(--acc-bg);font-size:14px;display:flex;gap:10px;align-items:center}
.notice .btn{margin-inline-start:auto}
/* الحساب */
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .nm{flex:1;min-width:0}
.brow .nm b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:6px;border-radius:4px;background:var(--card2);margin-top:5px;position:relative;overflow:hidden}
.btrack i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:4px}
.btrack i.pos{background:var(--pos)}.btrack i.neg{background:var(--neg)}
.brow .v{text-align:end;font-weight:800;flex:none;font-size:14.5px}
.brow .v small{display:block;font-size:11.5px;font-weight:700}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tr:last-child{border-bottom:0}
.tr .who{flex:1;min-width:150px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.tr .arw{color:var(--acc);font-weight:800}
.tr .ta{font-weight:800;font-size:16px}
.tr.mine{background:var(--acc-bg);margin:0 -10px;padding:12px 10px;border-radius:12px;border-bottom-color:transparent}
.tr .btn{margin-inline-start:auto}
.done{text-align:center;padding:16px 8px;color:var(--muted)}
.done b{display:block;font-size:17px;color:var(--text)}
/* الملخص */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-size:19px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:6px;border-bottom:1px solid var(--line);margin-top:6px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default}
.col .cv{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap}
.col .cb{width:100%;max-width:38px;background:var(--bar);border-radius:6px 6px 0 0;min-height:3px;transition:height .4s}
.col:hover .cb,.col.on .cb{filter:brightness(1.12)}
.clabs{display:flex;gap:6px;margin-top:6px}
.clabs span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clabs span i{display:block;font-style:normal;font-size:16px}
.tbl-wrap{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:700;color:var(--muted);font-size:12.5px;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td:first-child{min-width:70px;max-width:120px;overflow-wrap:anywhere}
.tbl td.n small{display:block;font-size:11px;font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumtext{white-space:pre-wrap;background:var(--card2);border-radius:12px;padding:12px;font-size:13.5px;max-height:220px;overflow:auto;margin:10px 0 12px;font-family:inherit;line-height:1.65}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:0}
/* الصفحات المنبثقة */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-wrap.in{opacity:1}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;max-height:94dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .24s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow);overflow:hidden}
.sheet-wrap.in .sheet{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sh-head h3{flex:1;font-size:18px;font-weight:800;min-width:0}
.sh-head h3 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.sh-body{overflow-y:auto;padding:4px 16px 18px;flex:1;overscroll-behavior:contain}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--card)}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:20px}.sheet{border-radius:24px;max-height:90vh}}
.fld{display:block;margin-bottom:16px}
.fld>span,.fld-h>span{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.fld-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fld-h>span{margin-bottom:7px}
.fld-h .link{margin-top:-6px}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.err{color:var(--neg);font-weight:700;font-size:14px;min-height:0}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.mrow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow input{width:120px;flex:none;padding:9px 11px}
.mrow .pv{width:84px;flex:none;text-align:end;font-size:12.5px;color:var(--muted)}
.rem{font-size:13.5px;font-weight:700;margin-top:6px}
.rem.ok{color:var(--pos)}.rem.bad{color:var(--neg)}
/* المبلغ ولوحة الأرقام */
.amtbox{background:var(--card2);border-radius:18px;padding:12px;margin-bottom:16px}
.amtline{display:flex;align-items:center;gap:8px;justify-content:center}
.amt-in{background:transparent;border:0;font-size:38px;font-weight:800;text-align:center;padding:2px 0;direction:ltr;width:100%;min-width:0;caret-color:var(--acc)}
.amt-in::placeholder{color:var(--faint)}
.amtline .cur{font-weight:700;color:var(--muted);flex:none;font-size:15px}
.amt-eval{text-align:center;color:var(--muted);font-weight:700;min-height:20px;font-size:14px;direction:ltr}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;direction:ltr;margin-top:8px}
.kp button{height:48px;border-radius:13px;background:var(--card);font-size:21px;font-weight:700;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.kp button:active{background:var(--card3)}
.kp .op{color:var(--acc)}
.kp .eq{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink)}
.kp.hide{display:none}
.receipt{display:flex;gap:10px;align-items:center}
.receipt img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.bigamt{font-size:32px;font-weight:800;text-align:center;margin:4px 0 14px}
.bigamt small{font-size:15px;color:var(--muted);font-weight:700}
.kv{background:var(--card2);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.kv h4{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.kv .l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.kv .l>span{display:flex;align-items:center;gap:8px;min-width:0}
.kv .l.me{font-weight:800}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}

/* ================= الحسابات (بالهللات/السنتات كأعداد صحيحة) ================= */
const Calc = (() => {
  const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
  function hash(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
  const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  /* ترتيب ثابت (نفسه بكل الأجهزة) عشان الهللات الزايدة تتوزع بعدل */
  function order(ids, seed) { return ids.slice().sort((a, b) => (hash(seed + '|' + a) - hash(seed + '|' + b)) || cmpStr(a, b)); }
  function splitEqual(total, ids, seed = '') {
    const out = {}; ids = ids.filter((x, i) => ids.indexOf(x) === i); const n = ids.length; if (!n || !(total >= 0)) return out;
    const base = Math.floor(total / n); let rem = total - base * n;
    for (const id of ids) out[id] = base;
    for (const id of order(ids, seed)) { if (rem <= 0) break; out[id]++; rem--; }
    return out;
  }
  const wInt = w => { const x = Math.round((+w || 0) * 10000); return x > 0 ? x : 0; };
  /* تقسيم بالنسب/الحصص: طريقة أكبر باقي، والمجموع يطابق المبلغ بالضبط */
  function splitWeighted(total, weights, seed = '') {
    const ids = Object.keys(weights || {}).filter(id => wInt(weights[id]) > 0); const out = {};
    const W = ids.reduce((s, id) => s + wInt(weights[id]), 0); if (!W || !(total >= 0)) return out;
    const bT = BigInt(total), bW = BigInt(W); let sum = 0n; const rems = [];
    for (const id of ids) { const num = bT * BigInt(wInt(weights[id])); const q = num / bW; out[id] = Number(q); sum += q; rems.push([id, num % bW]); }
    let left = Number(bT - sum);
    const rank = new Map(order(ids, seed).map((id, i) => [id, i]));
    rems.sort((a, b) => (a[1] === b[1] ? rank.get(a[0]) - rank.get(b[0]) : (a[1] > b[1] ? -1 : 1)));
    for (const [id] of rems) { if (left <= 0) break; out[id]++; left--; }
    return out;
  }
  const intMap = o => { const r = {}; for (const [id, v] of Object.entries(o || {})) { const n = Math.round(+v); if (n) r[id] = n; } return r; };
  function owed(e) {
    const sw = e.sw || {};
    if (e.sm === 'amt') return intMap(sw);
    if (e.sm === 'pct' || e.sm === 'shr') return splitWeighted(e.amt, sw, e.id || '');
    return splitEqual(e.amt, Object.keys(sw).filter(id => +sw[id]), e.id || '');
  }
  const paid = e => intMap(e.by);
  const sum = o => Object.values(o).reduce((s, v) => s + v, 0);
  function valid(e) {
    if (!Number.isSafeInteger(e.amt) || e.amt <= 0) return false;
    const p = paid(e), o = owed(e);
    if (Object.values(p).some(v => v < 0) || Object.values(o).some(v => v < 0)) return false;
    return sum(p) === e.amt && sum(o) === e.amt;
  }
  /* الصافي: موجب = له، سالب = عليه */
  function balances(expenses, settles) {
    const net = {}; const add = (id, v) => { net[id] = (net[id] || 0) + v; };
    for (const e of expenses) { for (const [id, v] of Object.entries(paid(e))) add(id, v); for (const [id, v] of Object.entries(owed(e))) add(id, -v); }
    for (const s of settles || []) { add(s.from, s.amt); add(s.to, -s.amt); }
    return net;
  }
  /* التسوية: كل مرة أكبر دائن مع أكبر مدين */
  function settle(net, ord = []) {
    const rk = new Map(ord.map((id, i) => [id, i]));
    const before = (a, b) => a[1] > b[1] || (a[1] === b[1] && (((rk.has(a[0]) ? rk.get(a[0]) : 1e9) - (rk.has(b[0]) ? rk.get(b[0]) : 1e9)) || cmpStr(a[0], b[0])) < 0);
    const cr = [], db = [];
    for (const [id, v] of Object.entries(net)) { if (v > 0) cr.push([id, v]); else if (v < 0) db.push([id, -v]); }
    const pick = arr => { let bi = 0; for (let i = 1; i < arr.length; i++) if (before(arr[i], arr[bi])) bi = i; return bi; };
    const out = [];
    while (cr.length && db.length) {
      const ci = pick(cr), di = pick(db), c = cr[ci], d = db[di], x = Math.min(c[1], d[1]);
      out.push({ from: d[0], to: c[0], amt: x }); c[1] -= x; d[1] -= x;
      if (!c[1]) cr.splice(ci, 1); if (!d[1]) db.splice(db.indexOf(d), 1);
    }
    return out;
  }
  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[٠-٩]/g, c => AR.indexOf(c)).replace(/[۰-۹]/g, c => FA.indexOf(c))
      .replace(/[٫]/g, '.').replace(/[٬\s]/g, '').replace(/[−–—]/g, '-').replace(/[×xX*]/g, '*').replace(/[÷]/g, '/');
  }
  /* "1,234.5" أو "12,5" (فاصلة عشرية) */
  function cleanNum(t) {
    if (t.includes(',')) { if (!t.includes('.') && /,\d{1,2}$/.test(t)) t = t.replace(',', '.'); t = t.replace(/,/g, ''); }
    return t;
  }

    t = cleanNum(t); if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
    let [i, f = ''] = t.split('.'); i = i || '0';
    let v = Number(i) * 10 ** dec + (dec ? Number(f.slice(0, dec).padEnd(dec, '0')) : 0);
    if (f.length > dec && +f[dec] >= 5) v += 1;
    return Number.isSafeInteger(v) ? v : NaN;
  }
  function toNum(t) { t = cleanNum(t); return /^(\d+\.?\d*|\.\d+)$/.test(t) ? Number(t) : NaN; }
  /* يقبل جمع وطرح وضرب: 25+18.5 أو 4×12.5 */
  function parseAmount(s, dec = 2) {
    s = norm(s); if (!s) return NaN;
    if (!/^[\d.,+\-*]+$/.test(s) || /^[+*]|[+\-*]$|[+\-*]{2}/.test(s)) return NaN;
    let total = 0;
    const terms = s.match(/[+-]?[^+-]+/g) || [];
    for (let term of terms) {
      let sign = 1; if (term[0] === '-') { sign = -1; term = term.slice(1); } else if (term[0] === '+') term = term.slice(1);
      const fs = term.split('*'); let v = toMinor(fs[0], dec); if (!Number.isFinite(v)) return NaN;
      for (const f of fs.slice(1)) { const m = toNum(f); if (!Number.isFinite(m)) return NaN; v = Math.round(v * m); }
      total += sign * v;
    }

  const url = k === 'view' ? T.joinLink(baseUrl(), r.id, r.view) : k === 'edit' ? T.joinLink(baseUrl(), r.id, r.edit) : '';
  const M = compute(r);
  const msg = k === 'view' ? `تابع حساب «${M.meta.name}» على القطّة 🐱\n${url}` : `انضم لقطّة «${M.meta.name}» وسجّل مصاريفك 🐱\n${url}`;
  if (act === 'doShare') {
    b.disabled = true; b.textContent = 'لحظة…';
    try { await makeShared(r); shRender && shRender(); toast('صارت القطّة مشتركة 🎉 أرسل الرابط للشلة'); }
    catch (err) { b.disabled = false; b.innerHTML = ic('link') + 'شارك مع الشلة'; toast(T.errorText(err)); }
  }
  else if (act === 'copyLink') copyText(url, 'انتسخ الرابط');
  else if (act === 'waLink') waOpen(msg);
  else if (act === 'sysShare') { try { await navigator.share({ title: 'القطّة', text: msg }); } catch (x) { } }
  else if (act === 'qr') {
    const box = $('#qr-' + k, el); if (!box.hidden) { box.hidden = true; return; }
    try { await loadQR(); box.innerHTML = qrSvg(url); box.hidden = false; } catch (x) { toast('ما قدرت أسوي الكود'); }
  }
  else if (act === 'rotate') {
    const w = b.dataset.w; const d = docOf(r);
    if (d.hasPending && d.hasPending()) { toast('استنى لين تنحفظ التعديلات وجرّب'); return; }
    if (!await ask(w === 'both' ? 'تجدّد كل الروابط؟' : 'تجدّد رابط العرض؟', { sub: w === 'both' ? 'الروابط القديمة بتوقف، واللي معهم الرابط القديم ما راح يقدرون يفتحون القطّة. بعدها أرسل الرابط الجديد للشلة.' : 'رابط العرض القديم بيوقف.', ok: 'جدّد' })) return;
    try {
      const nk = await T.rotateKeys(r.id, r.edit, w);
      if (nk.edit) { r.edit = nk.edit; r.key = nk.edit; } if (nk.view) r.view = nk.view; saveRefs();
      const nd = docOf(r); if (openGid === r.gid) nd.start(); shRender && shRender(); toast('تجدّدت الروابط');
    } catch (err) { toast(T.errorText(err)); }
  }
  else if (act === 'unshare') {
    if (!await ask('توقف المشاركة؟', { sub: 'بتنحذف القطّة من السيرفر والشلة ما راح يقدرون يفتحونها. نسختك بتبقى على جهازك.', ok: 'وقّفها', danger: true })) return;
    try { await T.remove(r.id, r.edit); } catch (err) { if (err.code !== 'not_found') { toast(T.errorText(err)); return; } }
    toLocal(r); await closeSheet(); toast('وقّفت المشاركة، والقطّة صارت على جهازك بس');
  }
}
async function makeShared(r) {
  if (!T || !T.available()) { const e = new Error('noserver'); e.code = 'noserver'; throw e; }
  const d = docOf(r); const body = { items: { ...d.body.items }, meta: d.body.meta };
  const res = await T.create('qatta', body);
  seedCache(res.id, body, 'edit');
  Object.assign(r, { type: 'shared', id: res.id, key: res.edit, edit: res.edit, view: res.view, role: 'edit' }); delete r.dead;
  saveRefs(); LS.del('qatta.g.' + r.gid); docs.delete(r.gid); models.delete(r.gid);
  const nd = docOf(r); if (openGid === r.gid) nd.start(); scheduleRender();
}
function toLocal(r) {
  const d = docOf(r); const body = snapshot(d); d.stop(); const id = r.id;
  Object.assign(r, { type: 'local' }); ['id', 'key', 'edit', 'view', 'role', 'dead', 'askedWho'].forEach(k => delete r[k]);
  LS.set('qatta.g.' + r.gid, JSON.stringify(body)); forgetDoc(id);
  saveRefs(); docs.delete(r.gid); models.delete(r.gid); if (openGid === r.gid) docOf(r); scheduleRender();
}

/* ================= الانضمام برابط ================= */
function handleJoin() {
  const j = T && T.parseJoin(location.hash); if (!j) return false;
  history.replaceState({}, '', location.pathname + location.search);
  joinGroup(j.id, j.key); return true;
}
function joinGroup(id, key) {
  if (!T || !T.available()) { showHome(); toast('المزامنة مو مفعّلة، ما أقدر أفتح الرابط'); return; }
  let r = refs.find(x => x.type === 'shared' && x.id === id);
  if (r) {
    /* عندك القطّة من قبل: لو صلاحيتك تعديل وشغّالة نخليها، غير كذا نجرّب المفتاح الجديد */
    if (key === r.edit && r.key !== r.edit) { r.key = r.edit; r.role = 'edit'; delete r.dead; }
    else if (r.key !== key && !(r.role === 'edit' && !r.dead)) { r.key = key; r.role = null; delete r.dead; delete r.askedWho; }
    if (r.archived) delete r.archived;
  } else { r = { gid: 'S' + id, type: 'shared', id, key, role: null, t: Date.now() }; refs.unshift(r); }
  saveRefs(); history.replaceState({}, ''); showHome(); go(r.gid);
}

/* ================= الإعدادات والنسخة الاحتياطية ================= */
function setTheme(light) {
  document.body.classList.toggle('light', light); LS.set('qatta.theme', light ? 'light' : 'dark');
  const m = $('meta[name="theme-color"]'); if (m) m.content = light ? '#f6f3ee' : '#0f1217';
  if (!openGid) renderHome();
}
function storageKB() { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('qatta.') || k.startsWith('tajarib.doc.')) n += (k.length + (localStorage.getItem(k) || '').length) * 2; } } catch (e) { } return Math.round(n / 1024); }
function openSettings() {
  const light = document.body.classList.contains('light');
  const el = openSheet(`<div class="sh-head"><h3>الإعدادات</h3><button class="icon-btn" data-close aria-label="سكّر">${ic('x')}</button></div>
  <div class="sh-body">
    <h4 class="sec">المظهر</h4><div class="seg" id="st-theme"><button data-th="dark" class="${light ? '' : 'on'}">${ic('moon')} داكن</button><button data-th="light" class="${light ? 'on' : ''}">${ic('sun')} فاتح</button></div>
    <h4 class="sec">اسمك</h4><input id="st-name" maxlength="30" placeholder="اسمك" value="${esc(prefs.myName || '')}" aria-label="اسمك"><p class="hint">نستخدمه لما تسوي قطّة جديدة أو تنضم لقطّة الشلة.</p>
    <h4 class="sec">النسخة الاحتياطية</h4>
    <button class="setrow" data-act="export">${ic('down')}<span class="grow">نزّل نسخة<small>ملف فيه كل قطّاتك ومصاريفها</small></span></button>
    <button class="setrow" data-act="import">${ic('up')}<span class="grow">رجّع من نسخة<small>يندمج مع اللي عندك، والأحدث يفوز</small></span></button>
    <p class="hint">المساحة المستخدمة: ${storageKB()} ك.ب · المزامنة: ${T && T.available() ? 'مفعّلة' : 'مو مفعّلة (كل شي على جهازك)'}</p>
    <h4 class="sec">عن القطّة</h4><p class="muted" style="font-size:14px">قسّم مصاريف الطلعات والسفرات والسكن مع الشلة، بدون تسجيل ولا حسابات. الحساب كله بالهللة، والتسوية تطلع لكم أقل عدد تحويلات.</p>
  </div>`);
  el.addEventListener('click', e => {
    const th = e.target.closest('[data-th]'); if (th) { setTheme(th.dataset.th === 'light'); $$('#st-theme button', el).forEach(b => b.classList.toggle('on', b === th)); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'export') exportBackup(); else if (b.dataset.act === 'import') $('#imp-file').click();
  });
  $('#st-name', el).addEventListener('change', e => { prefs.myName = e.target.value.trim(); savePrefs(); toast('انحفظ اسمك'); });
}
const REF_KEYS = ['gid', 'type', 'id', 'key', 'edit', 'view', 'role', 'me', 'archived', 'lastPayer', 't', 'askedWho'];
function exportBackup() {
  const groups = refs.map(r => { const ref = {}; for (const k of REF_KEYS) if (r[k] != null) ref[k] = r[k]; return { ref, body: snapshot(docOf(r)) }; });
  const data = { app: 'qatta', v: 1, at: Date.now(), groups };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `qatta-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`نزّلت نسخة فيها ${refs.length} قطّة`);
}
async function importBackup(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('الملف مو نسخة صحيحة'); return; }
  if (!isObj(j) || j.app !== 'qatta' || !Array.isArray(j.groups)) { toast('هذا الملف مو نسخة من القطّة'); return; }
  if (!await ask(`ترجّع ${j.groups.length} قطّة من النسخة؟`, { sub: 'اللي عندك ما راح ينحذف، ولو القطّة موجودة تندمج والأحدث يفوز.', ok: 'رجّعها' })) return;
  let added = 0, merged = 0;
  for (const g of j.groups) {
    if (!isObj(g) || !isObj(g.ref)) continue;
    const ref = {}; for (const k of REF_KEYS) if (g.ref[k] != null) ref[k] = g.ref[k];
    const body = { items: isObj(g.body && g.body.items) ? g.body.items : {}, meta: isObj(g.body && g.body.meta) ? g.body.meta : null };
    if (typeof ref.gid !== 'string' || !ref.gid) continue;
    if (ref.type === 'shared' && typeof ref.id === 'string' && typeof ref.key === 'string') {
      const ex = refs.find(x => x.type === 'shared' && x.id === ref.id);
      if (ex) { if (ref.edit && !ex.edit) { ex.edit = ref.edit; ex.key = ref.edit; ex.role = 'edit'; } if (ref.view && !ex.view) ex.view = ref.view; merged++; continue; }
      if (refOf(ref.gid)) ref.gid = 'S' + ref.id + Math.random().toString(36).slice(2, 5);
      delete ref.dead; seedCache(ref.id, body, ref.role); refs.push(ref); added++;
    } else {
      const ex = refOf(ref.gid);
      if (ex && ex.type === 'local') { const d = docOf(ex); try { d.merge(body); } catch (e) { continue; } models.delete(ex.gid); merged++; continue; }
      const nr = { ...ref, type: 'local' }; ['id', 'key', 'edit', 'view', 'role'].forEach(k => delete nr[k]);
      if (ex) nr.gid = 'L' + newId();
      if (!LS.set('qatta.g.' + nr.gid, JSON.stringify(body))) break;
      refs.push(nr); added++;
    }
  }
  saveRefs(); models.clear(); scheduleRender();
  const parts = []; if (added) parts.push(`رجّعت ${added} قطّة`); if (merged) parts.push(`حدّثت ${merged} قطّة موجودة`);
  toast(parts.length ? parts.join(' و') : 'ما فيه شي جديد بالنسخة');
}
$('#imp-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });

/* ================= الأحداث العامة ================= */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('.sheet') || b.closest('.dlg')) return;
  const act = b.dataset.act; const r = openGid ? refOf(openGid) : null;
  switch (act) {
    case 'theme': setTheme(!document.body.classList.contains('light')); break;
    case 'settings': openSettings(); break;
    case 'newGroup': openGroupForm(null); break;
    case 'open': go(b.dataset.gid); break;
    case 'joinPaste': { const v = $('#join-in').value.trim(); const j = T && T.parseJoin(v); if (!j) { toast('الرابط مو صحيح، لازم يكون فيه #j='); return; } joinGroup(j.id, j.key); break; }
    case 'back': goHome(); break;
    case 'share': if (r) openShare(r); break;
    case 'gsettings': if (r) openGroupSettings(r); break;
    case 'addExp': if (r) openExpenseForm(r); break;
    case 'openExp': if (r) openExpense(r, b.dataset.id); break;
    case 'openSettle': if (r) openSettle(r, b.dataset.id); break;
    case 'whoami': if (r) openWhoAmI(r); break;
    case 'markPaid': if (r) { const t = compute(r).transfers[+b.dataset.i]; if (t) recordSettle(r, t); } break;
    case 'manualSettle': if (r) openSettleForm(r); break;
    case 'copySum': if (r) copyText(summaryText(compute(r)), 'انتسخ الملخص'); break;
    case 'waSum': if (r) waOpen(summaryText(compute(r))); break;
    case 'shareSum': if (r) { try { await navigator.share({ title: compute(r).meta.name, text: summaryText(compute(r)) }); } catch (x) { } } break;
    case 'barTip': toast(b.dataset.tip); break;
    case 'keepLocal': if (r) { toLocal(r); toast('صارت القطّة على جهازك بس'); } break;
    case 'forget': if (r) removeGroup(r); break;
  }
});
$$('#group .tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; renderGroup(); const hb = $('#g-hero').getBoundingClientRect().bottom + window.scrollY - 62; if (window.scrollY > hb) window.scrollTo({ top: hb }); }));
$('#q').addEventListener('input', e => { query = e.target.value; const r = refOf(openGid); if (r) renderExpList(compute(r)); });
window.addEventListener('scroll', () => { const s = window.scrollY > 4; $$('.top').forEach(t => t.classList.toggle('sc', s)); }, { passive: true });
window.addEventListener('hashchange', handleJoin);
window.addEventListener('storage', e => { if (e.key === 'qatta.groups') { refs = LS.get('qatta.groups', []) || []; models.clear(); scheduleRender(); } });

/* ================= البداية ================= */
if (!handleJoin()) { const st = history.state || {}; history.replaceState(st.g ? { g: st.g } : {}, ''); route(history.state); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
window.QattaDebug = { refs: () => refs, model: gid => compute(refOf(gid)), doc: gid => docs.get(gid), open: () => openGid };
})();
</script>
