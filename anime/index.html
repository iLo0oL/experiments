<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<meta name="description" content="تابع الأنمي اللي تشوفه، واحفظ وين وقفت بكل حلقة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أنميتي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://graphql.anilist.co">
<title>أنميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bar:#8b5cf6;--bar2:#3b3363;--bg:#0b0c12;--bg2:#10121a;--panel:#161925;--panel2:#1f2332;--hover:#2a2f43;--line:#262b3c;--text:#eef0f7;--muted:#9399ae;--acc:#a78bfa;--acc2:#ec4899;--grad:linear-gradient(135deg,#8b5cf6,#ec4899);--shadow:rgba(0,0,0,.45);--nav:rgba(14,16,24,.94);--new:#22c55e}
body.light{--bar:#7c3aed;--bar2:#d9cdf7;--bg:#f5f6fb;--bg2:#fff;--panel:#fff;--panel2:#eceef5;--hover:#dfe2ec;--line:#e1e3ec;--text:#141724;--muted:#5c6277;--acc:#7c3aed;--shadow:rgba(30,30,70,.12);--nav:rgba(255,255,255,.95);--new:#16a34a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.dopen{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.35;cursor:default}
a{color:inherit;text-decoration:none}
img{display:block}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;white-space:nowrap;flex-shrink:0}
.logo svg{width:32px;height:32px;border-radius:10px;flex-shrink:0}
.sbox{flex:1;min-width:0;max-width:560px;margin-inline:auto;position:relative}
.sbox input{width:100%;background:var(--panel2);border:1.5px solid transparent;border-radius:12px;padding:9px 14px;padding-inline-start:38px;font-size:15px;outline:none;transition:border-color .15s}
.sbox input:focus{border-color:var(--acc);background:var(--bg2)}
.sbox svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.55;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--panel2)}
@media(max-width:380px){.logo span{display:none}}
main{max-width:1180px;margin:0 auto;padding:6px 16px 24px}
/* sections */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:18px;font-weight:800}
.sec-h a,.sec-h button{color:var(--acc);font-size:14px;font-weight:700;white-space:nowrap}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row>.pc{width:124px;flex-shrink:0;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}.row>.pc{width:150px}}
/* poster card */
.pc{display:block;position:relative;min-width:0;cursor:pointer}
.pimg{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--panel2)}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.pc:hover .pimg img{transform:scale(1.04)}
.psc{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:7px;direction:ltr}
.padd,.pst{position:absolute;bottom:6px;inset-inline-end:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.padd{background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:21px;line-height:1}
.prel{position:absolute;top:6px;inset-inline-end:6px;background:var(--grad);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:7px}
.pt{font-size:13.5px;font-weight:700;margin-top:7px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--panel2) 20%,var(--hover) 50%,var(--panel2) 80%);background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:12px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.skp{aspect-ratio:2/3}
/* continue watching */
.cw{display:flex;gap:10px;align-items:center;width:272px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;scroll-snap-align:start}
.cw img{width:58px;height:82px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--panel2)}
.cwb{flex:1;min-width:0}
.cwt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwm{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:5px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.plus{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;flex-shrink:0;direction:ltr;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.plus:active{transform:scale(.94)}
.new{display:inline-block;background:rgba(34,197,94,.15);color:var(--new);font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:7px;margin-top:3px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{background:var(--panel2);padding:7px 13px;border-radius:10px;font-size:14px;white-space:nowrap;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--text);color:var(--bg)}
.chip small{opacity:.65;font-weight:700}
/* list */
.toolbar{display:flex;gap:8px;margin:12px 0}
.toolbar input{flex:1;min-width:0;background:var(--panel2);border:1.5px solid transparent;border-radius:12px;padding:9px 12px;outline:none;font-size:14.5px}
.toolbar input:focus{border-color:var(--acc)}
select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;max-width:100%}
.litems{display:grid;gap:10px}
@media(min-width:800px){.litems{grid-template-columns:1fr 1fr}}
.li{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px;cursor:pointer;min-width:0}
.li img{width:60px;height:86px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--panel2)}
.lb{flex:1;min-width:0}
.lt{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lm{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lm .new{margin:0}
.lnext{font-size:12px;color:var(--acc);font-weight:700;margin-top:5px}
.stars{color:#f59e0b;font-weight:700;direction:ltr;display:inline-block}
/* empty / buttons */
.empty{text-align:center;color:var(--muted);padding:44px 16px;line-height:1.9;font-size:15.5px}
.empty .big{font-size:46px;line-height:1.2;margin-bottom:6px}
.empty .btn{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--grad);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.sm{padding:8px 13px;font-size:14px}
.btn.danger{color:#ef4444}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:16px;text-align:center;margin:14px 0;font-size:14.5px}
.err .btn{margin-top:10px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
/* bottom nav */
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:40;display:flex;justify-content:space-around;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0;position:relative;max-width:120px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--text)}
nav.tabs a.on svg{stroke:var(--acc)}
.nb{position:absolute;top:0;inset-inline-end:calc(50% - 24px);background:var(--acc2);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:none;place-items:center;padding:0 5px;direction:ltr}
.nb.show{display:grid}
@media(min-width:900px){nav.tabs{bottom:14px;inset-inline:calc(50% - 230px);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px var(--shadow);padding:6px 4px}}
/* toast */
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,16px);background:#23273a;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14.5px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35);width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#c4b5fd;font-weight:800;white-space:nowrap}
body.dopen .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
/* detail */
.detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.detail[hidden]{display:none}
.detail.anim{animation:up .2s ease-out}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.dbar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none}
.dbar button{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:20px;display:grid;place-items:center}
.bwrap{height:210px;margin-top:-62px;position:relative;overflow:hidden;background:var(--panel2)}
.bwrap .bimg{position:absolute;inset:0;background-size:cover;background-position:center}
.bwrap .bimg.blur{filter:blur(18px);transform:scale(1.2);opacity:.75}
.bwrap:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 45%,var(--bg))}
@media(min-width:700px){.bwrap{height:300px}}
.dwrap{max-width:920px;margin:0 auto;padding:0 16px 48px;position:relative}
.dhead{display:flex;gap:14px;margin-top:-96px;position:relative;z-index:2;align-items:flex-end}
.dcover{width:116px;aspect-ratio:2/3;border-radius:14px;object-fit:cover;box-shadow:0 10px 30px var(--shadow);flex-shrink:0;background:var(--panel2)}
@media(min-width:700px){.dcover{width:160px}.dhead{margin-top:-130px}}
.dhead h1{font-size:21px;font-weight:800;line-height:1.3}
.alt{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{background:var(--panel2);font-size:12.5px;padding:4px 9px;border-radius:8px;font-weight:700}
.tag.live{background:rgba(34,197,94,.15);color:var(--new)}
.tag.sc{color:#f59e0b}
.nexta{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.nexta b{color:var(--acc)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.box h3,.ph{font-size:16px;font-weight:800;margin-bottom:10px}
.ph2{font-size:14px;font-weight:800;margin:18px 0 8px}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{flex:1;min-width:max-content;padding:11px 12px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:14.5px;border:1.5px solid transparent}
.sbtn:hover{border-color:var(--c)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{padding:8px 2px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid transparent;color:var(--muted)}
.seg button i{font-style:normal;font-size:15px}
.seg button.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.prog{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px 0 6px}
.prog button{width:54px;height:54px;border-radius:16px;background:var(--panel2);font-size:28px;font-weight:700;line-height:1}
.prog button.inc{background:var(--grad);color:#fff}
.pnum{text-align:center;min-width:92px}
.pnum b{font-size:36px;font-weight:800;display:block;line-height:1.05}
.pnum span{color:var(--muted);font-size:13px}
.pinfo{text-align:center;font-size:13.5px;color:var(--muted);line-height:1.8}
.pinfo .new{font-size:12.5px}
.ranges{margin-top:14px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.ep{height:40px;border-radius:10px;background:var(--panel2);font-weight:700;font-size:14px;border:1.5px solid transparent}
.ep.w{background:var(--grad);color:#fff}
.ep.nx{border-color:var(--acc)}
.ep.up{opacity:.4;border:1.5px dashed var(--muted)}
.moviebtn{width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--panel2);font-weight:800;font-size:16px}
.moviebtn.w{background:var(--grad);color:#fff}
.scores{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scores button{height:36px;border-radius:9px;background:var(--panel2);font-weight:700;font-size:13.5px}
.scores button.on{background:#f59e0b;color:#1a1200}
textarea{width:100%;min-height:72px;background:var(--panel2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;resize:vertical;outline:none;font-size:14.5px;line-height:1.6}
textarea:focus{border-color:var(--acc)}
.pfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:16px}
.dates{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.8}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:14px}
.lnk i{width:10px;height:10px;border-radius:50%;background:var(--c,#888);flex-shrink:0}
.desc{white-space:pre-line;font-size:14.5px;line-height:1.75;max-height:9.2em;overflow:hidden;text-align:left;direction:ltr;opacity:.9}
.desc.open{max-height:none}
.dmore{display:flex;gap:16px;margin-top:8px;font-size:14px;font-weight:700;color:var(--acc)}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
dl.info dt{color:var(--muted)}
dl.info dd{font-weight:600;min-width:0;overflow-wrap:anywhere}
.gtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gtags a{font-size:12.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);font-weight:700;color:var(--muted)}
/* schedule */
.segc{display:inline-flex;background:var(--panel2);border-radius:12px;padding:4px;margin-top:14px}
.segc button{padding:7px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.segc button.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px var(--shadow)}
.day h3{font-size:16px;font-weight:800;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
.day h3 small{color:var(--muted);font-weight:600;font-size:13px}
.si{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.si:hover{background:var(--panel)}
.si time{width:58px;font-weight:700;font-size:13px;color:var(--muted);flex-shrink:0;text-align:center}
.si img{width:44px;height:62px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--panel2)}
.si .sb{flex:1;min-width:0}
.si b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si span{font-size:13px;color:var(--muted)}
.si.mine{background:var(--panel);border-color:var(--line)}
.si.past{opacity:.7}
.si .cd{font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap;flex-shrink:0}
/* me */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-size:26px;font-weight:800;display:block;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.stat small{display:block;color:var(--muted);font-size:12px}
.srow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.srow a{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 2px;text-align:center;min-width:0}
.srow b{display:block;font-size:20px;font-weight:800;line-height:1.3}
.srow span{font-size:11.5px;color:var(--muted);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar{display:flex;align-items:center;gap:10px;font-size:14px;margin:7px 0}
.gbar span{width:110px;flex-shrink:0;font-weight:600}
.gbar div{flex:1;height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}
.gbar div i{display:block;height:100%;background:var(--grad)}
.gbar b{width:28px;text-align:center;font-size:13px}
.act{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;font-size:14px}
.act img{width:34px;height:48px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--panel2)}
.act .ab{flex:1;min-width:0}
.act .ab div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act time{font-size:12px;color:var(--muted)}
.dayl{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 2px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.field:last-child{border-bottom:none}
.field label{font-weight:700}
.bbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow input{flex:1;min-width:0;background:var(--panel2);border:1.5px solid transparent;border-radius:12px;padding:9px 12px;outline:none;direction:ltr;text-align:right}
.inrow input:focus{border-color:var(--acc)}
.small{font-size:13px;line-height:1.8}
.ex{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px;line-height:1.7}
textarea.big{min-height:200px;margin-top:4px}

let undoState=null;

function undo(){if(!undoState)return;const{id,entry,log}=undoState;if(entry)DB.list[id]=entry;else delete DB.list[id];DB.log=log;undoState=null;save();changed(id);toast('رجّعتها مثل ما كانت')}
function addEntry(m,status){const t=Date.now();const e=DB.list[m.id]={id:m.id,status,progress:0,score:0,notes:'',repeat:0,addedAt:t,updatedAt:t,startedAt:status==='CURRENT'?t:null,finishedAt:null,media:snap(m)};e.seenAired=aired(e.media);if(status==='COMPLETED'){e.progress=e.media.episodes||aired(e.media)||0;e.finishedAt=t;e.startedAt=t;DB.log.push({id:m.id,s:'COMPLETED',t})}return e}
function setStatus(id,st){const e=DB.list[id];if(!e||e.status===st)return;const t=Date.now();e.status=st;e.updatedAt=t;e.seenAired=aired(e.media);if(st==='CURRENT'&&!e.startedAt)e.startedAt=t;if(st==='COMPLETED'){const tot=e.media.episodes||aired(e.media);if(tot&&e.progress<tot)e.progress=tot;e.finishedAt=t;if(!e.startedAt)e.startedAt=t;DB.log.push({id,s:'COMPLETED',t})}}
function trimLog(id,p){for(let i=DB.log.length-1;i>=0;i--){const x=DB.log[i];if(x.id!==id)continue;if(x.s){DB.log.splice(i,1);continue}if(x.b<=p)break;if(x.a>=p)DB.log.splice(i,1);else x.b=p}}
function setProgress(id,p){const e=DB.list[id];if(!e)return null;const tot=e.media.episodes;p=Math.max(0,Math.floor(p));if(tot)p=Math.min(p,tot);if(p===e.progress)return null;const t=Date.now();if(p>e.progress)DB.log.push({id,a:e.progress,b:p,t});else trimLog(id,p);e.progress=p;e.updatedAt=t;e.seenAired=aired(e.media);let done=false;if(p>0&&e.status!=='CURRENT'&&e.status!=='COMPLETED')e.status='CURRENT';if(p>0&&!e.startedAt)e.startedAt=t;if(tot&&p>=tot&&e.status!=='COMPLETED'){e.status='COMPLETED';e.finishedAt=t;done=true;DB.log.push({id,s:'COMPLETED',t})}else if(e.status==='COMPLETED'&&tot&&p<tot){e.status='CURRENT';e.finishedAt=null}return{done,p}}

const API='https://graphql.anilist.co';
const QMEM=new Map();
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h.toString(36)}
async function gql(query,variables={},ttl=600){
  const key=hashStr(query)+':'+JSON.stringify(variables);
  const hit=QMEM.get(key);if(hit&&Date.now()-hit.t<ttl*1000)return hit.d;
  try{const s=sessionStorage.getItem('q:'+key);if(s){const o=JSON.parse(s);if(Date.now()-o.t<ttl*1000){QMEM.set(key,o);return o.d}}}catch(e){}
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})})}catch(e){throw new Error('net')}
  if(r.status===429)throw new Error('rate');
  let j=null;try{j=await r.json()}catch(e){}
  const has=j&&j.data&&Object.values(j.data).some(v=>v!=null);
  if(!has){const m=j&&j.errors&&j.errors[0];const err=new Error((m&&m.status===404)||r.status===404?'notfound':r.status>=500?'down':'api');err.detail=m&&m.message;throw err}
  const o={t:Date.now(),d:j.data};QMEM.set(key,o);try{sessionStorage.setItem('q:'+key,JSON.stringify(o))}catch(e){try{sessionStorage.clear()}catch(_){}}
  return j.data}

const Q_UPCOMING='query($ids:[Int],$page:Int,$to:Int){Page(page:$page,perPage:50){pageInfo{hasNextPage}airingSchedules(mediaId_in:$ids,notYetAired:true,airingAt_lesser:$to,sort:TIME){id airingAt episode media{id duration episodes isAdult title{romaji english native}}}}}';
let CAL=null;
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsDate=sec=>new Date(sec*1000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function icsFold(line){const enc=new TextEncoder();if(enc.encode(line).length<=74)return line;const out=[];let cur='',len=0;for(const ch of line){const b=enc.encode(ch).length;if(len+b>(out.length?73:74)){out.push(cur);cur='';len=0}cur+=ch;len+=b}out.push(cur);return out.join('\r\n ')}
function buildICS(items){const base=location.origin+location.pathname,stamp=icsDate(nowS());const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//animeti//anime tracker//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:أنميتي - مواعيد الحلقات'];
  for(const x of items){const m=x.media,t=title(m),dur=Math.max(5,Math.min(m.duration||24,180));
    L.push('BEGIN:VEVENT',`UID:animeti-${m.id}-${x.episode}@animeti`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(x.airingAt)}`,`DTEND:${icsDate(x.airingAt+dur*60)}`,`SUMMARY:${icsEsc(`📺 ${t} - الحلقة ${x.episode}`)}`,`DESCRIPTION:${icsEsc(`نزلت الحلقة ${x.episode}${m.episodes?' من '+m.episodes:''}. علّمها بأنميتي إذا شفتها.`)}`,`URL:${base}#/anime/${m.id}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(`نزلت الحلقة ${x.episode} من ${t}`)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n'}
async function calExport(ids){const list=ids||schedIds();CAL={ids:list};if(!list.length){toast('ما عندك أنمي يُعرض الحين بقائمتك');return}

  let out=[],page=1;try{while(page<=8){const d=await gql(Q_UPCOMING,{ids:list,page,to:nowS()+90*86400},600);out=out.concat(d.Page.airingSchedules||[]);if(!d.Page.pageInfo.hasNextPage)break;page++}}
  catch(e){if(!sheetEl.hidden)openSheet(`<h3>🔔 مواعيد الحلقات</h3>${errBox(e,'calretry')}`);return}
  if(sheetEl.hidden)return;out=out.filter(x=>x.media&&!x.media.isAdult);
  if(!out.length){openSheet('<h3>🔔 مواعيد الحلقات</h3><p class="muted">ما فيه مواعيد معروفة للحلقات الجاية حالياً. جرّب بعدين.</p>');return}
  const shows=new Set(out.map(x=>x.media.id)).size;CAL={ids:list,ics:buildICS(out)};
  openSheet(`<h3>🔔 مواعيد الحلقات</h3><p>جهّزت مواعيد <b>${pl(out.length,W_EP)}</b> ${shows>1?`لـ ${shows} أنميات`:`من «${esc(title(out[0].media))}»`} للثلاث شهور الجاية، وكل حلقة معها تنبيه وقت نزولها.</p>
  <div class="bbtns"><button class="btn" data-act="caldl">📅 ضيفها للتقويم</button>${canShareFiles()?'<button class="btn ghost" data-act="calshare">📤 شارك الملف</button>':''}</div>
  <div class="note small"><b>آيفون:</b> اضغط «ضيفها للتقويم» وبعدين «إضافة الكل».<br><b>أندرويد:</b> افتح الملف اللي نزل بتطبيق التقويم (مثل تقويم سامسونج)، أو من Google Calendar بالكمبيوتر: الإعدادات ← استيراد.</div>
  <p class="muted small">المواعيد ممكن تتغيّر أو تتأخر. إذا ضفت أنمي جديد أو تغيّر شي، نزّل الملف مرة ثانية.</p>`)}
function calDownload(){if(!CAL||!CAL.ics)return;if(isIOS()){const u='data:text/calendar;charset=utf-8,'+encodeURIComponent(CAL.ics);if(!window.open(u,'_blank'))location.href=u;return}download(new Blob([CAL.ics],{type:'text/calendar;charset=utf-8'}),'animeti-episodes.ics');toast('نزل الملف ✓ افتحه بتطبيق التقويم')}

/* ============ انقل قائمتك لجهاز ثاني (رابط / QR) ============ */
const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},dec:str=>{const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}};
async function zpipe(u8,S){const cs=new S('deflate');const w=cs.writable.getWriter();w.write(u8).catch(()=>{});w.close().catch(()=>{});return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function packList(lite){const e=Object.values(DB.list).map(x=>{const r=[x.id,SORDER.indexOf(x.status),x.progress||0,x.score||0,x.repeat||0,Math.floor((x.updatedAt||0)/1000)];if(!lite&&(x.notes||x.eps)){r.push(x.notes||'');if(x.eps)r.push(x.eps)}return r});
  const raw=new TextEncoder().encode(JSON.stringify({v:1,e}));if(window.CompressionStream){try{return'z'+b64u.enc(await zpipe(raw,CompressionStream))}catch(_){}}return'j'+b64u.enc(raw)}
async function unpackList(d){if(!/^[zj][\w-]{4,}$/.test(d||''))throw new Error('bad');const u8=b64u.dec(d.slice(1));const raw=d[0]==='z'?await zpipe(u8,DecompressionStream):u8;const o=JSON.parse(new TextDecoder().decode(raw));if(!o||!Array.isArray(o.e))throw new Error('bad');
  const out=[];for(const r of o.e.slice(0,5000)){if(!Array.isArray(r))continue;const id=num(r[0]),st=SORDER[r[1]];if(!id||!st)continue;out.push({id,status:st,progress:num(r[2])||0,score:Math.min(10,num(r[3])||0),repeat:num(r[4])||0,updatedAt:(num(r[5])||0)*1000,notes:typeof r[6]==='string'?r[6].slice(0,3000):null,eps:r.length>7?cleanEps(r[7])||null:undefined})}return out}
let QRP=null;
function loadQR(){return QRP||(QRP=new Promise((res,rej)=>{if(window.qrcode)return res();const s=document.createElement('script');s.src='vendor/qrcode.js';s.onload=()=>res();s.onerror=()=>{QRP=null;rej(new Error('qr'))};document.head.appendChild(s)}))}
let TRANSFER_URL='';
async function shareTransfer(){const n=Object.keys(DB.list).length;if(!n){toast('قائمتك فاضية');return}const d=await packList();const url=location.origin+location.pathname+'#/sync?d='+d;TRANSFER_URL=url;
  let qr='';try{await loadQR();const q=qrcode(0,'L');q.addData(url);q.make();qr=q.createSvgTag({cellSize:4,margin:4,scalable:true,alt:'QR'})}catch(e){qr=''}

  ${qr?`<div class="qrbox">${qr}</div>`:'<p class="note small">قائمتك كبيرة على الـQR، استخدم الرابط.</p>'}
  <div class="bbtns"><button class="btn" data-act="copylink">📋 انسخ الرابط</button>${navigator.share?'<button class="btn ghost" data-act="sharelink">📤 أرسله لنفسك</button>':''}</div>
  <p class="muted small" style="margin-top:10px">الرابط فيه قائمتك، فلا ترسله لأحد ما تبيه يشوفها. سجل «آخر اللي شفته» يبقى بكل جهاز لحاله.<br>إذا مثبّت أنميتي على الشاشة الرئيسية بالآيفون، افتح التطبيق والصق الرابط في «إحصائياتي ← عندك رابط نقل؟».</p>`)}
function openTransferLink(v){const m=String(v||'').match(/[?&]d=([zj][\w-]+)/);if(!m){toast('هذا مو رابط نقل من أنميتي');return}location.hash='#/sync?d='+m[1]}

const Q_MEDIA='query($ids:[Int],$page:Int){Page(page:$page,perPage:50){media(id_in:$ids){...card}}}'+CARD;
async function syncApply(){if(!SYNC.items||SYNC.busy)return;const todo=SYNC.items.filter(x=>!DB.list[x.id]||x.updatedAt>(DB.list[x.id].updatedAt||0));const need=todo.filter(x=>!DB.list[x.id]).map(x=>x.id);SYNC.busy=true;renderSync(TABQ);
  const got=new Map();try{for(let i=0;i<need.length;i+=50){const d=await gql(Q_MEDIA,{ids:need.slice(i,i+50),page:1},1800);for(const m of d.Page.media||[])got.set(m.id,m)}}catch(e){SYNC.busy=false;toast(errMsg(e));renderSync(TABQ);return}
  let n=0;for(const x of todo){const ex=DB.list[x.id];const media=ex?ex.media:got.has(x.id)?snap(got.get(x.id)):null;if(!media)continue;
    DB.list[x.id]={id:x.id,status:x.status,progress:x.progress,score:x.score,repeat:x.repeat,notes:x.notes??(ex?ex.notes:''),eps:x.eps!==undefined?(x.eps||undefined):(ex?ex.eps:undefined),updatedAt:x.updatedAt||Date.now(),addedAt:ex?ex.addedAt:(x.updatedAt||Date.now()),startedAt:ex?ex.startedAt:null,finishedAt:ex?ex.finishedAt:null,seenAired:aired(media),media};n++}
  save();SYNC={d:'',items:null,err:false,busy:false};replaceHash('#/list');setTimeout(()=>toast(`اندمجت قائمتك ✓ (${n} أنمي)`),60)}

let CARD_BLOB=null;

function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}

  x.lineWidth=26;x.stroke(new Path2D('M196 132l60 58 60-58'));x.lineWidth=28;rr(x,118,190,276,200,44);x.stroke();x.lineWidth=14;const p=new Path2D('M230 246l76 44-76 44z');x.fill(p);x.stroke(p);x.restore()}
function glow(x,cx,cy,r,c){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}

  const S=calcStats(),W=1080,H=1350,P=80,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');

  x.direction='rtl';x.textBaseline='alphabetic';
  drawLogo(x,W-P-76,56,76);x.textAlign='right';x.fillStyle='#fff';x.font='800 46px Tajawal,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';x.fillText('أنميتي',W-P-96,110);

/* ============ تحديث الحلقات الجديدة ============ */
let refreshing=false;
async function refreshAiring(){if(refreshing||!navigator.onLine)return;const ids=Object.values(DB.list).filter(e=>typeOf(e.media)==='ANIME'&&e.status!=='DROPPED'&&(e.media.next||['RELEASING','NOT_YET_RELEASED','HIATUS'].includes(e.media.status)||!e.media.status)).map(e=>e.id);if(!ids.length)return;refreshing=true;
  try{for(let i=0;i<ids.length;i+=50){const d=await gql(Q_REFRESH,{ids:ids.slice(i,i+50)},300);for(const m of d.Page.media||[]){const e=DB.list[m.id];if(!e)continue;e.media.episodes=m.episodes??e.media.episodes;e.media.status=m.status||e.media.status;e.media.duration=m.duration??e.media.duration;e.media.next=m.nextAiringEpisode?{episode:m.nextAiringEpisode.episode,airingAt:m.nextAiringEpisode.airingAt}:null;if(e.seenAired==null)e.seenAired=aired(e.media)}}
    DB.settings.lastRefresh=Date.now();save();if(TAB==='home'||TAB==='list')rerender();if(DET.id&&DB.list[DET.id])renderPanel()}catch(e){}
  refreshing=false}
function updateBadges(){const n=Object.values(DB.list).reduce((s,e)=>s+fresh(e),0);const b=$('#nb');b.textContent=n>99?'99+':n;b.classList.toggle('show',n>0);try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
function applyTheme(){const t=DB.settings.theme;const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('light',!dark);$('#themeBtn').textContent=dark?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=dark?'#0b0c12':'#f5f6fb'}
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
let toastT;
function toast(msg,label,fn){if(!msg)return;const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>${label?`<button>${esc(label)}</button>`:''}`;if(label)el.querySelector('button').onclick=ev=>{ev.stopPropagation();el.classList.remove('show');fn()};el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),label?5000:2600)}
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=countdown(+el.dataset.cd-nowS())});updateBadges()},30e3);
setInterval(refreshAiring,30*60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(DB.settings.lastRefresh||0)>20*60e3)refreshAiring()});
window.addEventListener('online',()=>{const H=HOMES[MODE()];if(TAB==='home'&&!H.d){H.err=null;renderTab(true)}});

/* ============ تشغيل ============ */
applyTheme();applyMode();updateBadges();route();
if(Date.now()-(DB.settings.lastRefresh||0)>10*60e3)setTimeout(refreshAiring,1200);
setTimeout(()=>checkSequels(),5000);
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
