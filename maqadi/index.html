<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="description" content="قوائم مقاضي البيت المشتركة: ضيف الأغراض، رتّبها حسب أقسام السوبرماركت، وشاركها مع أهلك أول بأول">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مقاضي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مقاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--bg2:#1b1714;--card:#221d19;--card2:#2b2520;--line:#3a322b;--text:#f6efe8;--muted:#b3a497;--acc:#ff8a3d;--acc2:#e46b1c;--ok:#4cc38a;--danger:#f0645f;--warn:#f0b44a;--onacc:#1d0e03;--shadow:0 10px 28px rgba(0,0,0,.45);--hl:rgba(255,138,61,.15)}
body.light{--bg:#fbf7f2;--bg2:#f3ece4;--card:#ffffff;--card2:#f6f0ea;--line:#e6dacd;--text:#2a1d12;--muted:#7d6a5a;--acc:#e8711f;--acc2:#c95c10;--ok:#22975f;--danger:#d64541;--warn:#bb7a12;--onacc:#ffffff;--shadow:0 8px 22px rgba(60,35,10,.13);--hl:rgba(232,113,31,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 12px;padding-top:max(9px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line);z-index:10;min-height:58px}
.ttl{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#ffa25a,#d9531a);display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:20px}
.ttl .em{font-size:26px;line-height:1;flex-shrink:0}
.ttl div{min-width:0}
.ttl h1{font-size:18px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex-shrink:0;cursor:pointer}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--ok)}.pill.saving i{background:var(--warn);animation:blink 1s infinite}.pill.offline i{background:var(--warn)}.pill.error i{background:var(--danger)}
.pill.ro{color:var(--warn)}
@keyframes blink{50%{opacity:.3}}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text);flex-shrink:0}
.ib:hover{background:var(--card)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none}
.view.on{display:block}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;color:var(--text)}
.btn:hover{filter:brightness(1.06)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--text)}
.chip.on{background:var(--hl);border-color:color-mix(in srgb,var(--acc) 50%,var(--line));color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:10px}
.card p.d{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.rowb{display:flex;flex-wrap:wrap;gap:8px}
/* home */
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.lc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:118px;cursor:pointer}
.lc:hover{border-color:var(--acc)}
.lc .em{font-size:32px;line-height:1}
.lc b{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc small{color:var(--muted);font-size:13px}
.lc .tag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:4px}
.lc .tag i{width:7px;height:7px;border-radius:50%;background:currentColor}
.lc .tag.offline,.lc .tag.saving{color:var(--warn)}.lc .tag.error{color:var(--danger)}
.lc.new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.lc .bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:auto}
.lc .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.hello{display:flex;gap:8px;align-items:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .l{flex:1;min-width:0}
.set .l small{display:block;color:var(--muted);font-size:12.5px}
.set .rowb{flex-wrap:nowrap}
.sw{width:48px;height:28px;border-radius:15px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on:after{right:23px}
/* list */
.addbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 14px 8px;margin:-14px -14px 4px}
.addrow{display:flex;gap:8px;position:relative}
.addrow input{height:48px;font-size:16.5px;border-radius:15px;padding-inline:14px}
.addrow .go{width:48px;height:48px;border-radius:15px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex-shrink:0}
.addrow .go svg{width:24px;height:24px}
.sugg{position:absolute;top:calc(100% + 6px);right:0;left:56px;background:var(--bg2);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;z-index:8}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 13px;text-align:right;border-top:1px solid var(--line)}
.sugg button:first-child{border-top:0}
.sugg button.act,.sugg button:hover{background:var(--hl)}
.sugg b{font-weight:700}
.sugg small{color:var(--muted);font-size:12.5px;margin-right:auto;white-space:nowrap}
.sugg .ex{color:var(--ok);font-size:12px}
.quick{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.quick .lbl{font-size:12.5px;color:var(--muted);align-self:center;white-space:nowrap}
.cat{margin-top:12px}
.cath{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--muted);padding:4px 4px 7px}
.cath .n{font-weight:700;font-size:12px;background:var(--card2);border-radius:9px;padding:1px 7px}
.it{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:7px;padding:4px 4px 4px 6px;min-height:56px;position:relative;transition:box-shadow .15s,opacity .2s}
.it .ck{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center}
.it .ck span{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent;transition:.15s}
.it .ck span svg{width:16px;height:16px;stroke-width:3}
.it.done .ck span{background:var(--ok);border-color:var(--ok);color:#fff}
.it .tx{flex:1;min-width:0;cursor:pointer;padding:6px 0}
.it .tx b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.it .q{display:inline-block;font-size:12.5px;font-weight:800;color:var(--acc);background:var(--hl);border-radius:8px;padding:1px 7px;margin-inline-start:6px;white-space:nowrap;vertical-align:1px}
.it .tx small{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.it.done{opacity:.62}
.it.done .tx b{text-decoration:line-through;text-decoration-thickness:2px}
.it .ed,.it .hd{width:38px;height:44px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.it .hd{cursor:grab;touch-action:none}
.it.drag{z-index:20;box-shadow:var(--shadow);opacity:.95;transition:none;border-color:var(--acc)}
.it.insb{box-shadow:0 -3px 0 var(--acc)}
.it.insa{box-shadow:0 3px 0 var(--acc)}
.cat.insc .cath{color:var(--acc)}
.it.flash{animation:flash 1.2s ease}
@keyframes flash{30%{background:var(--hl);border-color:var(--acc)}}
.doneh{display:flex;align-items:center;gap:8px;margin:22px 0 8px;padding:0 4px}
.doneh b{font-size:14px;color:var(--muted);flex:1;cursor:pointer;display:flex;align-items:center;gap:6px}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:8px}
.empty h2{color:var(--text);font-size:19px;margin-bottom:6px}
.empty .btn{margin:12px 4px 0}
.banner{margin:10px 0;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--danger) 14%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));font-size:14px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.banner.info{background:var(--hl);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;overflow-x:hidden;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .2s;box-shadow:var(--shadow)}
.ov.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-right:auto}
.ov.dlg{align-items:center;padding:20px}
.ov.dlg .sheet{border-radius:20px;max-width:400px;padding:20px}
.dlg p{color:var(--muted);margin-bottom:16px;white-space:pre-line}
.dacts{display:flex;flex-direction:column;gap:8px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qty{display:flex;align-items:center;gap:6px}
.qty input{text-align:center;min-width:0}
.qty .ib{background:var(--card);border:1px solid var(--line);width:44px;height:44px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.cats button{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:700;text-align:right}
.cats button.on{background:var(--hl);border-color:var(--acc);color:var(--acc)}
.acts{display:flex;gap:10px;margin-top:10px}
.acts .btn{flex:1}
.meta{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;border-top:1px solid var(--line);text-align:right;font-weight:700;font-size:15.5px}
.mrow:first-of-type{border-top:0}
.mrow .e{font-size:20px;width:28px;text-align:center}
.mrow.danger{color:var(--danger)}
.ords{display:flex;flex-direction:column;gap:6px}
.ord{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:6px 10px}
.ord b{flex:1}
.ord .ib{width:36px;height:36px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
.emojis button{font-size:24px;padding:6px 0;border-radius:11px;border:1px solid transparent}
.emojis button.on{background:var(--hl);border-color:var(--acc)}
.tlist{max-height:46dvh;overflow-y:auto;margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tlist label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.tlist label:first-child{border-top:0}
.tlist input{width:20px;height:20px;accent-color:var(--acc)}
.tlist small{color:var(--muted);margin-right:auto;font-size:12px}
.tlist label.has{opacity:.55}
.linkbox{display:flex;gap:6px;align-items:center}
.linkbox input{direction:ltr;text-align:left;font-size:13px;padding:9px;min-width:0}
pre.wa{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;font-size:14px;max-height:42dvh;overflow:auto;margin-bottom:10px}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);background:#2a211b;color:#fff;border-radius:14px;padding:11px 16px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:calc(100vw - 28px);box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{color:#ffb27a;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="backBtn" aria-label="رجوع" hidden><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="ttl" id="ttl"></div>
    <span class="pill" id="pill" hidden><i></i><span></span></span>
    <button class="ib" id="themeBtn" aria-label="الوضع الفاتح أو الداكن"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ib" id="menuBtn" aria-label="خيارات القائمة" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
  </header>
  <main>
    <section class="view" id="vHome"><div class="wrap" id="home"></div></section>
    <section class="view" id="vList">
      <div class="wrap">
        <div class="addbar" id="addbar">
          <div class="addrow">
            <input id="addIn" type="text" placeholder="ضيف غرض… مثل: 2 كيلو طماط" autocomplete="off" enterkeyhint="done" maxlength="80" aria-label="ضيف غرض">
            <button class="go" id="addGo" aria-label="ضيف"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="sugg" id="sugg" hidden></div>
          </div>
          <div class="quick" id="quick"></div>
        </div>
        <div id="lostBanner"></div>
        <div id="items"></div>
      </div>
    </section>
  </main>
</div>
<div id="toast"><span></span><button hidden></button></div>
<input type="file" id="fileIn" hidden>
<script src="../shared/sync.js"></script>
<script>
(function () {
'use strict';
const T = window.Tajarib || null;
/* ---------- أدوات ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  raw(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const latin = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.');
const norm = s => latin(s).toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/[^\p{L}\p{N}\s.]/gu, ' ').replace(/\s+/g, ' ').trim();
const newId = p => T ? T.newId(p) : p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const strip = o => { const x = { ...o }; delete x.id; delete x.u; return x; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* تخمين بسيط إذا الاسم لحرمة عشان الفعل: ضافه/ضافته */
const FEM = new Set('هند ريم مها نوف أمل منى هيا دلال عبير رنا لمى جود غلا شهد رهف وعد بشرى سلمى ليلى هدى نجلاء أسماء هيفاء وفاء علياء حنان إيمان مريم زينب عهود أريج شوق جواهر وجدان سعاد نجود سحر أثير'.split(' '));
const MASC_TA = new Set('حمزة أسامة اسامة طلحة عبيدة معاوية عروة حذيفة قتيبة خليفة عطية'.split(' '));
const isFem = n => {
  const f = String(n || '').trim().split(/\s+/)[0];
  if (/^(أم|ام|خالتي|عمتي|جدتي|أختي|اختي|بنتي|زوجتي|ماما|الوالدة)$/.test(f)) return true;
  if (/^(أبو|ابو|خالي|عمي|جدي|أخوي|اخوي|ولدي|بابا|الوالد)$/.test(f)) return false;
  return f.endsWith('ة') ? !MASC_TA.has(f) : FEM.has(f);
};
const by = (verbM, verbF, n) => (isFem(n) ? verbF : verbM) + ' ' + n;
const ICON = {
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  grip: '<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></svg>',

async function createShare(rec) {

async function stopSharing(rec) {
  if (!await ask('وقّف المشاركة؟', 'القائمة بتنحذف من السيرفر، واللي معهم الرابط ما بيقدرون يفتحونها. نسختك تبقى على جهازك.')) return;
  const d = docOf(rec), items = {}; for (const it of d.items()) items[it.id] = strip(it); const meta = { ...strip(d.meta() || {}) }; delete meta.vk;
  try { await T.remove(rec.id, rec.key); } catch (e) { if (e.code !== 'not_found') return toast(T.errorText(e)); }
  dropDoc(rec); T.forget(rec.id); delete rec.id; delete rec.key; delete rec.edit; delete rec.view; saveLists();
  LS.set('maqadi.local.' + rec.k, { items: Object.fromEntries(Object.entries(items).map(([k, v]) => [k, { ...v, u: Date.now() }])), meta: { ...meta, u: Date.now() } });
  render(); toast('وقفت المشاركة، القائمة صارت على جهازك بس');
}
function handleJoin() {
  const j = T && T.parseJoin(location.hash); if (!j) return null;
  history.replaceState(null, '', location.pathname + location.search);
  if (!T.available()) { toast('المزامنة مو مفعّلة، ما أقدر أفتح الرابط'); return null; }
  let rec = lists.find(l => l.id === j.id);
  if (rec) { if (rec.key !== j.key && rec.key !== rec.edit) { dropDoc(rec); rec.key = j.key; T.forget(j.id); } }
  else { rec = { k: j.id, id: j.id, key: j.key, name: 'قائمة مشتركة', emoji: '🛒' }; lists.push(rec); }
  saveLists(); toast('انضميت للقائمة ✓'); return rec;
}
window.addEventListener('hashchange', () => { const r = handleJoin(); if (r) openList(r); });

/* ---------- النسخة الاحتياطية ---------- */
function exportAll() {
  const out = { app: 'maqadi', v: 1, exported: new Date().toISOString(), me: S.me, hist: HIST, tpl: LS.get('maqadi.tpl', []), cats: LS.get('maqadi.cats', null), lists: [] };
  for (const l of lists) { const d = docOf(l), items = {}; for (const it of d.items()) items[it.id] = strip(it); const meta = strip(d.meta() || {}); delete meta.vk; out.lists.push({ name: l.name, emoji: l.emoji, meta, items, link: l.id ? { id: l.id, key: l.key } : null }); }
  download(`مقاضي-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out, null, 1), 'application/json'); toast('نزّلت النسخة الاحتياطية ✓');
}
function importAll() {
  const f = $('#fileIn'); f.value = ''; f.accept = '.json,application/json';
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return; let j;
    try { j = JSON.parse(await file.text()); if (j.app !== 'maqadi' || !Array.isArray(j.lists)) throw 0; } catch (e) { return toast('الملف مو نسخة من مقاضي'); }
    let n = 0, joined = 0; const t = Date.now();
    for (const l of j.lists) {
      if (l.link && l.link.id && T && T.available()) { if (!lists.some(x => x.id === l.link.id)) { lists.push({ k: l.link.id, id: l.link.id, key: l.link.key, name: l.name || 'قائمة', emoji: l.emoji || '🛒' }); joined++; } continue; }
      const rec = { k: 'L' + newId(''), name: String(l.name || 'قائمة').slice(0, 30), emoji: l.emoji || '🛒' }; const items = {};
      for (const [id, it] of Object.entries(l.items || {})) if (it && it.n && !it.del) items[id] = { ...strip(it), u: t };
      LS.set('maqadi.local.' + rec.k, { items, meta: { ...(l.meta || {}), name: rec.name, emoji: rec.emoji, u: t } }); lists.push(rec); n++;
    }
    if (j.hist && typeof j.hist === 'object') { for (const [k, h] of Object.entries(j.hist)) if (!HIST[k]) HIST[k] = h; saveHist(); }
    if (Array.isArray(j.tpl)) { const own = LS.get('maqadi.tpl', []); for (const x of j.tpl) if (!own.some(y => y.n === x.n)) own.push(x); LS.set('maqadi.tpl', own); }
    if (!S.me && j.me) { S.me = j.me; LS.set('maqadi.me', S.me); }
    saveLists(); render(); const nn = n + joined; toast(nn === 1 ? 'رجّعت قائمة وحدة ✓' : nn === 2 ? 'رجّعت قائمتين ✓' : nn <= 10 ? `رجّعت ${nn} قوائم ✓` : `رجّعت ${nn} قائمة ✓`);
  };
  f.click();
}

/* ---------- البداية ---------- */
let start = handleJoin();
if (!lists.length) newLocalList('مقاضي البيت', '🏠');
for (const l of lists) docOf(l);
if (start) openList(start);
else { const last = lists.find(l => l.k === LS.get('maqadi.cur', '')); if (last) openList(last, true); else { $('#vHome').classList.add('on'); render(); } }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
window.__maqadi = { S, parseEntry, guessCat, fmtQty, isFem, docOf, lists: () => lists, canEdit, waText: () => waText(S.cur), hist: () => HIST };
})();
