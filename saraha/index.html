<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صراحة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{var t=localStorage.getItem('saraha.theme')||'dark';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(t==='light')document.querySelector('meta[name=theme-color]').content='#f6f3ff'}catch(e){}</script>
<meta name="referrer" content="no-referrer">
<meta name="description" content="ألعاب وسوالف للشلة: صراحة، تصويت سري، الكرسي الساخن، الصديق الخفي وغيرها">
<title>صراحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0c1a;--card:#1a1628;--card2:#241f36;--line:#332c4d;--text:#f4f1ff;--muted:#a59fc0;--accent:#a78bfa;--pink:#f472b6;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(135deg,#8b5cf6,#ec4899)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Tajawal',system-ui,-apple-system,Tahoma,sans-serif;color:var(--text);min-height:100vh;line-height:1.7;background:radial-gradient(900px 500px at 100% -10%,#2a1b4a 0,transparent 60%),radial-gradient(800px 500px at -10% 110%,#3b1530 0,transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px calc(48px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
h2,h3{line-height:1.4}
.hero{text-align:center;padding:30px 0 22px}
.hero.small{padding:6px 0 10px}
.logo{font-size:52px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.tag{color:var(--muted);font-size:17px}
.ttl{font-size:24px;font-weight:800;margin:6px 0 4px}
.sec{font-size:17px;margin:26px 0 10px;color:var(--muted)}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;padding:4px 0;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.big-ic{font-size:46px;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
.card h3{font-size:18px;margin-bottom:10px}
label{display:block;font-weight:700;margin:14px 0 8px}
label:first-child{margin-top:0}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:140px;resize:vertical;margin-top:14px;line-height:1.8}
::placeholder{color:#7d7799}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--text);background:var(--card2);text-decoration:none;transition:transform .1s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wa{background:#1f8f4e;color:#fff}
.btn.danger{background:#3b1626;color:#fecdd3;border:1px solid #702a42}
.btn.big{width:100%;padding:16px;font-size:18px;margin:10px 0}
.btn[disabled]{opacity:.45;pointer-events:none}
.grow{flex:1}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row.between{justify-content:space-between}
.row.multi{flex-wrap:wrap}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--text)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chip .x{opacity:.55;margin-inline-start:4px;font-size:13px}
.list .item{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.list .item a{flex:1;padding:14px 16px;text-decoration:none;color:var(--text);min-width:0}
.list .item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item small{color:var(--muted)}
.list .x{background:none;border:0;color:var(--muted);font-size:16px;padding:14px 16px;cursor:pointer}
.how ol{padding-inline-start:20px}
.how li{margin-bottom:8px}
.fine{color:var(--muted);font-size:14px;text-align:center;margin-top:14px}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;margin-bottom:6px}
.live b{color:var(--text)}
.role{display:inline-block;background:rgba(236,72,153,.12);color:#fbcfe8;border:1px solid rgba(236,72,153,.35);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.linkbox{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all;color:var(--muted);text-align:left;font-family:ui-monospace,Menlo,monospace}
details summary{cursor:pointer;font-weight:700;list-style-position:inside}
.admin{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.admin p{margin:8px 0}
.card>.admin:first-child{margin-top:0;border-top:0;padding-top:0}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:0;margin-top:8px}
.err:empty{display:none}
.preview{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.pv-to{font-weight:700;margin-top:8px;color:var(--pink)}
.msg{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.wait{text-align:center;color:var(--muted)}
.faq ul{padding-inline-start:18px;margin-top:10px}
.faq li{margin-bottom:6px;color:var(--muted)}
.faq li b{color:var(--text)}
.grp h3{font-size:19px;margin:22px 0 4px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,160px);background:#fff;color:#141020;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s,opacity .3s,visibility .3s;opacity:0;visibility:hidden;z-index:99;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.bad{background:#fecdd3;color:#4c0519}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.modal{position:fixed;inset:0;background:rgba(5,3,12,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;margin-bottom:6px}
.review{margin:12px 0}
.rv{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;font-weight:400;cursor:pointer}
.rv input{width:20px;height:20px;flex-shrink:0;margin-top:4px;accent-color:#ec4899}
.rv span{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.rv small{display:block;color:var(--pink);font-weight:700}
.rv em{font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
.rv:has(input:checked){opacity:.5}
.rv:has(input:checked) span{text-decoration:line-through}
.present{position:fixed;inset:0;z-index:60;background:radial-gradient(700px 500px at 50% 0,#2a1b4a 0,transparent 70%),var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.ptop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;max-width:640px;width:100%;margin:0 auto}
.pcard{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:640px;width:100%;margin:0 auto;cursor:pointer;user-select:none;animation:pop .35s ease}
.pcard small{color:var(--pink);font-size:20px;font-weight:800;margin-bottom:16px}
.present .row{max-width:640px;width:100%;margin:0 auto}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
[hidden]{display:none!important}
/* الرئيسية: بطاقات الألعاب */
.modes{display:grid;gap:10px}
.mcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--text);transition:transform .1s,border-color .2s}
.mcard:active{transform:scale(.98)}
.mcard:hover{border-color:#4b3f72}
.mcard .mi{font-size:28px;width:52px;height:52px;display:grid;place-items:center;background:var(--card2);border-radius:14px;flex-shrink:0}
.mcard .mt{flex:1;min-width:0}
.mcard b{display:block;font-size:17px}
.mcard small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.mcard .go{color:var(--muted);font-size:18px}
.mhead{text-align:center;padding:6px 0 0}
.mchip{color:var(--muted);font-size:14px;font-weight:700}
.how p{margin-bottom:8px}
.how ol{margin:8px 0}
.note{color:var(--text);font-weight:500}
.prompt{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:700;font-size:17px;border-inline-start:4px solid var(--pink)}
/* صدق ولا كذب */
.tline{display:flex;gap:8px;align-items:center;margin-top:10px}
.tline .ti{flex:1;min-width:0}
label.lie{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer}
label.lie input{width:18px;height:18px;accent-color:#ec4899}
ol.tl{padding-inline-start:24px;margin:6px 0}
ol.tl li{margin:6px 0}
ol.tl li.isLie{color:var(--bad)}
ol.tl li.isTrue{color:var(--ok)}
ol.tl em{font-style:normal;font-size:14px}
details.ans{margin-top:8px;font-size:15px}
details.ans summary{color:var(--pink)}
/* التصويت */
.vq{margin:6px 0 20px}
.vqt{font-weight:800;font-size:17px}
.chips.pair{align-items:center}
.chips.pair .chip{flex:1;min-width:120px;border-radius:14px;padding:12px}
.chips .or{color:var(--muted);font-weight:700}
.qrow{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:0;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow input{width:20px;height:20px;flex-shrink:0;margin-top:4px;accent-color:#8b5cf6}
.qrow em{font-style:normal;color:var(--pink);font-weight:700}
#qlist{max-height:330px;overflow:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;padding:0 10px}
.bar{position:relative;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;overflow:hidden;text-align:right}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(139,92,246,.32);border-radius:12px}
.bar.top i{background:linear-gradient(90deg,rgba(236,72,153,.5),rgba(139,92,246,.5))}
.bar span,.bar b{position:relative}
.bar b{white-space:nowrap;color:var(--muted);font-weight:700}
.bar.top b{color:var(--text)}
/* العرض */
.pbody{width:100%}
.pbody p{font-size:clamp(22px,5.5vw,34px);font-weight:700;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.pbody ol.tl{text-align:right;font-size:clamp(19px,4.8vw,26px);font-weight:700;padding-inline-start:34px}
.pbody .bar{font-size:18px}
.pans{margin-top:22px;font-size:28px;font-weight:800;color:var(--pink);animation:pop .35s ease}
.pans p{color:var(--pink)}
/* الصديق الخفي */
.hello{font-size:20px;font-weight:700;margin:8px 0}
.gift{text-align:center;cursor:pointer;padding:30px 18px;border-style:dashed}
.gift.open{cursor:default;border-style:solid;animation:pop .4s ease}
.gift .gname{font-size:42px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4}
.gift small{color:var(--muted);font-weight:700}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* صراحة ولا جرأة */
.turn{font-size:30px;font-weight:800;min-height:52px;margin-bottom:10px}
.todbtns{display:flex;gap:10px}
.todbtns .btn{flex:1}
.btn.truth{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.dare{background:linear-gradient(135deg,#f97316,#ec4899);color:#fff}
.qcard{text-align:center}
.qcard small{color:var(--pink);font-weight:800;font-size:16px}
.qcard p{font-size:23px;font-weight:700;margin:12px 0 16px;line-height:1.7}
.qcard.flip{animation:pop .35s ease}
/* الألعاب الجديدة */
.sel{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;outline:none}
.addrow .sel{width:auto;flex:1}
.pink{color:var(--pink)}
.winner{font-size:clamp(28px,7vw,42px)!important;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent!important;margin-bottom:14px}
.story p{margin:0 0 10px;font-size:18px;line-height:1.9}
.story p.first{color:var(--pink);font-weight:700}
.msg .by{margin-top:8px;color:var(--pink);font-weight:700;font-size:15px}
.names{color:var(--muted);font-size:14px;margin:-4px 6px 10px}
.pick{text-align:center}
.pick small{color:var(--muted);font-weight:700}
.pick .gname{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.5}
.pass{padding:28px 18px}
.pass .gname{font-size:40px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4;margin:6px 0}
.wrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;text-align:right;cursor:pointer;justify-content:space-between}
.wrow.out b{opacity:.45;text-decoration:line-through}
/* سباق الأسئلة */
.qhead{color:var(--muted);font-weight:700;font-size:14px}
.qq{font-size:21px;margin:6px 0 12px}
.qopt{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:14px 16px;margin:8px 0;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--c);text-align:right;cursor:pointer}
.qopt span{opacity:.8}
.qopt b{margin-inline-start:auto}
.qopt.dim{opacity:.35}
.qopt.ok{outline:3px solid #fff;outline-offset:-3px}
.qopt.picked{outline:3px solid #fff}
.qopt[disabled]{cursor:default}
.qbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.qbar i{display:block;height:100%;width:100%;background:var(--grad);transition:width .1s linear}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.brow{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.me{background:rgba(236,72,153,.12);border-radius:10px}
.result h3{font-size:26px;margin:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:14px 0}
.pod{flex:1;max-width:150px;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 8px 8px;text-align:center;padding:12px 6px}
.pod b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{color:var(--muted);font-weight:700}
.pod.p0{padding-top:28px;border-color:#a16207;background:linear-gradient(180deg,rgba(234,179,8,.18),var(--card))}
.pod.p1{padding-top:18px}
/* كبسولة الزمن */
.capsule .cd{display:flex;justify-content:center;gap:10px;margin:6px 0 10px}
.cd div{background:var(--card2);border-radius:14px;padding:10px 12px;min-width:66px}
.cd b{display:block;font-size:26px}
.cd small{color:var(--muted)}
/* ارسم وخمّن */
.dword{font-size:18px;font-weight:700;min-height:48px;margin-bottom:6px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;font-size:14px;padding:0;background:#fff}
.sw.on{outline:3px solid var(--pink);outline-offset:2px}
.sw.er{display:grid;place-items:center}
#pad{width:100%;display:block;border-radius:14px;touch-action:none;background:#fff}
.timer{font-size:26px;font-weight:800;min-width:44px}
/* الإيموجي */
.ecard small{color:var(--pink);font-weight:800}
.emo{font-size:clamp(46px,14vw,72px);line-height:1.4;margin:10px 0}
.ecard .ans{font-size:24px;font-weight:800;margin-bottom:6px}
/* الفرق والدولاب */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.team{margin:0}
.team div{padding:4px 0;border-bottom:1px solid var(--line)}
.team div:last-child{border-bottom:0}
.wheelbox{position:relative;display:flex;justify-content:center;margin:16px 0 6px}
.wheelbox canvas{border-radius:50%;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:30px;color:#fff;z-index:2;text-shadow:0 2px 6px rgba(0,0,0,.6)}
/* الدفعة الثالثة */
.gfilter{margin:18px 0 0}
.bigl{font-size:64px;font-weight:800;line-height:1.3;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
label.abcin{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}
label.abcin input{flex:1}
.arow{display:flex;justify-content:space-between;margin-top:12px;font-size:17px}
.arow span{color:var(--ok);font-weight:800}
.acells{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.cell{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:14px}
.cell small{font-weight:800}
.cell.s0{opacity:.55;text-decoration:line-through}
.cell.s5{border-color:#a16207}
.cell.s10{border-color:#15803d}
.cell.s20{border-color:var(--pink);background:rgba(236,72,153,.12)}
.cell[data-c]{cursor:pointer}
.blank{color:var(--pink);border-bottom:2px dashed var(--pink);padding:0 6px}
.qopt.fun{color:var(--text);border:1px solid var(--line);font-weight:500;line-height:1.7}
.chips.rank .chip i{font-style:normal;font-weight:800;margin-inline-end:4px}
.chips.rank .chip i:empty{display:none}
.titem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.titem:last-child{border-bottom:0}
.titem.done .tmain b{text-decoration:line-through;opacity:.6}
.tchk{background:none;border:0;font-size:22px;cursor:pointer;padding:0}
.tmain{flex:1;min-width:0}
.tmain b{display:block}
.tmain small{color:var(--muted)}
.titem .x,.place .x{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:6px}
.place .avg{margin:2px 0 6px}
.stars{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.stars button{background:none;border:0;font-size:30px;color:#4b4466;cursor:pointer;padding:0 2px;line-height:1}
.stars button.on{color:#fbbf24}
.stars small{margin-inline-start:8px}
.baloot{display:flex;gap:10px;margin:14px 0}
.bcol{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.bcol input{text-align:center;font-weight:800;background:transparent;border-color:transparent}
.bcol b{display:block;font-size:56px;line-height:1.2}
.srow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px;margin:10px 0}
.srow b{flex:1}
.sval{font-size:30px;font-weight:800;min-width:60px;text-align:center}
.sbtns{display:flex;gap:6px;width:100%;justify-content:flex-end}
.scoreboard{display:flex;gap:10px;margin:12px 0}
.sbt{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:10px}
.sbt.on{border-color:var(--pink);background:rgba(236,72,153,.1)}
.sbt b{display:block;font-size:34px}
.sbt small{color:var(--muted);font-weight:700}
.timer.big{font-size:44px}
.tcard{margin:10px 0 16px}
.tcard .gname{font-size:38px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4}
.ban{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.ban small{width:100%;color:var(--bad);font-weight:700}
.ban span{background:rgba(251,113,133,.15);color:#fecdd3;border-radius:10px;padding:4px 10px;font-weight:700}
.rq{font-size:24px;font-weight:700;line-height:1.7;margin:10px 0}
.tlog{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}
.tlog span{background:var(--card2);border-radius:8px;padding:2px 6px;font-size:13px}
/* الدفعة الرابعة */
.auc{font-size:26px;font-weight:800;margin:10px 0;line-height:1.5}
.match{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match.bye{color:var(--muted)}
.match .vs{color:var(--muted);font-size:13px}
.pl{flex:1;min-width:110px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-weight:700;color:var(--text);cursor:pointer;text-align:center}
.pl.win{background:var(--grad);border-color:transparent;color:#fff}
.pl.pend{color:var(--muted);font-weight:500;cursor:default}
.scin{width:100%;margin-top:4px;padding:8px 12px;font-size:14px}
details.month summary{font-weight:500}
details.month.now{border-color:var(--pink)}
.sug p{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.sug.done{opacity:.55}
.sug.done p{text-decoration:line-through}
.mem p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.past{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.past p{margin:4px 0}
#grid{display:grid;gap:6px;margin:10px auto 0;max-width:420px}
#grid .cell{aspect-ratio:1;border-radius:12px;font-size:34px;padding:0;display:grid;place-items:center;cursor:pointer;background:var(--card2);border:1px solid var(--line);color:var(--text)}
#grid.c4{gap:4px;background:#1e3a8a;padding:8px;border-radius:16px}
#grid.c4 .cell{border-radius:50%;font-size:26px;background:#0f0c1a;border:0}
#grid .cell.hit{outline:3px solid var(--pink)}
.dice{font-size:64px;line-height:1.2;margin:14px 0 4px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.coin{font-size:44px;font-weight:800;margin:10px 0;min-height:70px}
.coin.spin3d{animation:flip3d .6s ease}
@keyframes flip3d{50%{transform:rotateY(90deg) scale(.8)}}
/* الإضافات: الشريط العلوي، البحث، المفضلة، المواسم، QR */
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:-18px;position:relative;z-index:2}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:19px;text-decoration:none;cursor:pointer;color:var(--text)}
.search{margin-top:22px}
.search input{border-radius:16px;padding:13px 16px}
.mwrap{position:relative}
.mwrap .mcard{padding-inline-end:56px}
.fav{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--muted);font-size:23px;cursor:pointer;border-radius:12px}
.fav.on{color:#fbbf24}
.season{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--text);background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(236,72,153,.14));border-color:rgba(236,72,153,.35)}
.season b{display:block;font-size:18px}
.season small{display:block;color:var(--muted);font-size:14px;line-height:1.6}
.qrbig{background:#fff;border-radius:18px;padding:10px;margin:14px auto;max-width:280px;aspect-ratio:1}
.qrbig svg{display:block;width:100%;height:100%}
.qrbig svg path{fill:#000}
/* شاشة العرض */
body.tv .wrap{max-width:1400px;padding:24px 32px}
body.tv .wrap:not(:has(.tvgrid)){max-width:900px;zoom:1.35}
.tvgrid{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.tvmain{min-width:0}
.tvtitle{font-size:clamp(28px,3.4vw,44px);font-weight:800;line-height:1.3}
.tvside{position:sticky;top:24px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center}
.tvside b{display:block;font-size:22px}
.tvside .live{justify-content:center;margin:10px 0 0}
.tvside #tvcount{font-size:20px}
.tvside #tvcount b{color:var(--text)}
.tvbig{font-size:clamp(80px,12vw,150px);font-weight:800;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
body.tv .tvmain{font-size:22px}
body.tv .tvmain .card h3{font-size:30px}
body.tv .tvmain .qq{font-size:clamp(28px,3.2vw,46px)}
body.tv .tvmain .qopt{font-size:clamp(22px,2.4vw,32px);padding:20px 24px}
body.tv .tvmain .bigl{font-size:clamp(90px,12vw,170px)}
body.tv .tvmain .brow{font-size:24px}
body.tv .tvmain .msg{font-size:26px}
body.tv .tvmain .auc{font-size:clamp(30px,3.6vw,48px)}
body.tv .tvmain .prompt{font-size:30px}
body.tv .tvmain .qbar{height:14px}
body.tv .tvmain .big-ic{font-size:72px}
@media (max-width:820px){.tvgrid{grid-template-columns:1fr}.tvside{position:static}}
/* الوضع الفاتح */
html[data-theme=light]{--bg:#f6f3ff;--card:#ffffff;--card2:#f1ecfb;--line:#e1d9f2;--text:#1d1530;--muted:#6b6386;--accent:#7c3aed;--pink:#db2777;--ok:#059669;--bad:#e11d48;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=light] body{background:radial-gradient(900px 500px at 100% -10%,#e9ddff 0,transparent 60%),radial-gradient(800px 500px at -10% 110%,#fde4f1 0,transparent 60%),var(--bg);background-attachment:fixed}
html[data-theme=light] ::placeholder{color:#9b93b6}
html[data-theme=light] .role{color:#9d174d}
html[data-theme=light] .btn.danger{background:#ffe4ea;color:#9f1239;border-color:#fda4af}
html[data-theme=light] .toast{background:#1d1530;color:#fff}
html[data-theme=light] .toast.bad{background:#9f1239;color:#fff}
html[data-theme=light] .present{background:radial-gradient(700px 500px at 50% 0,#e9ddff 0,transparent 70%),var(--bg)}
html[data-theme=light] .mcard:hover{border-color:#c4b5fd}
html[data-theme=light] .stars button{color:#d6cfe8}
html[data-theme=light] .ban span{color:#9f1239}
html[data-theme=light] .modal{background:rgba(29,21,48,.45)}
html[data-theme=light] .card,html[data-theme=light] .mcard,html[data-theme=light] .list .item{box-shadow:0 2px 10px rgba(76,29,149,.05)}
html[data-theme=light] .pod.p0{border-color:#eab308}
html[data-theme=light] .qopt.ok,html[data-theme=light] .qopt.picked{outline-color:#1d1530}
/* الدفعة الثانية من الإضافات */
.present.follow .pcard{cursor:default}
.present.follow .ptop span:last-child{font-size:22px}
.qrow.auto{border:0;margin-top:6px}
.packbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.packbox summary{font-weight:700}
.pkrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.pkrow .chip{flex:1;text-align:start;margin:0}
.pkrow .x{background:none;border:0;color:var(--muted);font-size:16px;padding:6px 8px;cursor:pointer}
.bimg{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin:10px 0 6px;background:var(--card2)}
.pimg{display:block;max-width:100%;max-height:52vh;border-radius:18px;margin:0 auto 16px;object-fit:contain}
.imgwait{display:block;margin:6px 0}
.wipe h3{color:var(--bad)}
.prow .btn.sm{padding:6px 10px}
</style>
