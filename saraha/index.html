<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c1a">
<meta name="referrer" content="no-referrer">
<meta name="description" content="ألعاب وسوالف للشلة: صراحة، تصويت سري، الكرسي الساخن، الصديق الخفي وغيرها">
<title>صراحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0c1a;--card:#1a1628;--card2:#241f36;--line:#332c4d;--text:#f4f1ff;--muted:#a59fc0;--accent:#a78bfa;--pink:#f472b6;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(135deg,#8b5cf6,#ec4899)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Tajawal',system-ui,-apple-system,Tahoma,sans-serif;color:var(--text);min-height:100vh;line-height:1.7;background:radial-gradient(900px 500px at 100% -10%,#2a1b4a 0,transparent 60%),radial-gradient(800px 500px at -10% 110%,#3b1530 0,transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px calc(48px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
h2,h3{line-height:1.4}
.hero{text-align:center;padding:30px 0 22px}
.hero.small{padding:6px 0 10px}
.logo{font-size:52px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.tag{color:var(--muted);font-size:17px}
.ttl{font-size:24px;font-weight:800;margin:6px 0 4px}
.sec{font-size:17px;margin:26px 0 10px;color:var(--muted)}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;padding:4px 0;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.big-ic{font-size:46px;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
.card h3{font-size:18px;margin-bottom:10px}
label{display:block;font-weight:700;margin:14px 0 8px}
label:first-child{margin-top:0}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:140px;resize:vertical;margin-top:14px;line-height:1.8}
::placeholder{color:#7d7799}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--text);background:var(--card2);text-decoration:none;transition:transform .1s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wa{background:#1f8f4e;color:#fff}
.btn.danger{background:#3b1626;color:#fecdd3;border:1px solid #702a42}
.btn.big{width:100%;padding:16px;font-size:18px;margin:10px 0}
.btn[disabled]{opacity:.45;pointer-events:none}
.grow{flex:1}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row.between{justify-content:space-between}
.row.multi{flex-wrap:wrap}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--text)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chip .x{opacity:.55;margin-inline-start:4px;font-size:13px}
.list .item{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.list .item a{flex:1;padding:14px 16px;text-decoration:none;color:var(--text);min-width:0}
.list .item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item small{color:var(--muted)}
.list .x{background:none;border:0;color:var(--muted);font-size:16px;padding:14px 16px;cursor:pointer}
.how ol{padding-inline-start:20px}
.how li{margin-bottom:8px}
.fine{color:var(--muted);font-size:14px;text-align:center;margin-top:14px}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;margin-bottom:6px}
.live b{color:var(--text)}
.role{display:inline-block;background:rgba(236,72,153,.12);color:#fbcfe8;border:1px solid rgba(236,72,153,.35);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.linkbox{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all;color:var(--muted);text-align:left;font-family:ui-monospace,Menlo,monospace}
details summary{cursor:pointer;font-weight:700;list-style-position:inside}
.admin{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.admin p{margin:8px 0}
.card>.admin:first-child{margin-top:0;border-top:0;padding-top:0}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:0;margin-top:8px}
.err:empty{display:none}
.preview{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.pv-to{font-weight:700;margin-top:8px;color:var(--pink)}
.msg{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.wait{text-align:center;color:var(--muted)}
.faq ul{padding-inline-start:18px;margin-top:10px}
.faq li{margin-bottom:6px;color:var(--muted)}
.faq li b{color:var(--text)}
.grp h3{font-size:19px;margin:22px 0 4px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,160px);background:#fff;color:#141020;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s,opacity .3s,visibility .3s;opacity:0;visibility:hidden;z-index:99;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.bad{background:#fecdd3;color:#4c0519}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.modal{position:fixed;inset:0;background:rgba(5,3,12,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;margin-bottom:6px}
.review{margin:12px 0}
.rv{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;font-weight:400;cursor:pointer}
.rv input{width:20px;height:20px;flex-shrink:0;margin-top:4px;accent-color:#ec4899}
.rv span{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.rv small{display:block;color:var(--pink);font-weight:700}
.rv em{font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
.rv:has(input:checked){opacity:.5}
.rv:has(input:checked) span{text-decoration:line-through}
.present{position:fixed;inset:0;z-index:60;background:radial-gradient(700px 500px at 50% 0,#2a1b4a 0,transparent 70%),var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.ptop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;max-width:640px;width:100%;margin:0 auto}
.pcard{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:640px;width:100%;margin:0 auto;cursor:pointer;user-select:none;animation:pop .35s ease}
.pcard small{color:var(--pink);font-size:20px;font-weight:800;margin-bottom:16px}
.present .row{max-width:640px;width:100%;margin:0 auto}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
[hidden]{display:none!important}
/* الرئيسية: بطاقات الألعاب */
.modes{display:grid;gap:10px}
.mcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--text);transition:transform .1s,border-color .2s}
.mcard:active{transform:scale(.98)}
.mcard:hover{border-color:#4b3f72}
.mcard .mi{font-size:28px;width:52px;height:52px;display:grid;place-items:center;background:var(--card2);border-radius:14px;flex-shrink:0}
.mcard .mt{flex:1;min-width:0}
.mcard b{display:block;font-size:17px}
.mcard small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.mcard .go{color:var(--muted);font-size:18px}
.mhead{text-align:center;padding:6px 0 0}
.mchip{color:var(--muted);font-size:14px;font-weight:700}
.how p{margin-bottom:8px}
.how ol{margin:8px 0}
.note{color:var(--text);font-weight:500}
.prompt{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:700;font-size:17px;border-inline-start:4px solid var(--pink)}
/* صدق ولا كذب */
.tline{display:flex;gap:8px;align-items:center;margin-top:10px}
.tline .ti{flex:1;min-width:0}
label.lie{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer}
label.lie input{width:18px;height:18px;accent-color:#ec4899}
ol.tl{padding-inline-start:24px;margin:6px 0}
ol.tl li{margin:6px 0}
ol.tl li.isLie{color:var(--bad)}
ol.tl li.isTrue{color:var(--ok)}
ol.tl em{font-style:normal;font-size:14px}
details.ans{margin-top:8px;font-size:15px}
details.ans summary{color:var(--pink)}
/* التصويت */
.vq{margin:6px 0 20px}
.vqt{font-weight:800;font-size:17px}
.chips.pair{align-items:center}
.chips.pair .chip{flex:1;min-width:120px;border-radius:14px;padding:12px}
.chips .or{color:var(--muted);font-weight:700}
.qrow{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:0;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow input{width:20px;height:20px;flex-shrink:0;margin-top:4px;accent-color:#8b5cf6}
.qrow em{font-style:normal;color:var(--pink);font-weight:700}
#qlist{max-height:330px;overflow:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;padding:0 10px}
.bar{position:relative;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;overflow:hidden;text-align:right}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(139,92,246,.32);border-radius:12px}
.bar.top i{background:linear-gradient(90deg,rgba(236,72,153,.5),rgba(139,92,246,.5))}
.bar span,.bar b{position:relative}
.bar b{white-space:nowrap;color:var(--muted);font-weight:700}
.bar.top b{color:var(--text)}
/* العرض */
.pbody{width:100%}
.pbody p{font-size:clamp(22px,5.5vw,34px);font-weight:700;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.pbody ol.tl{text-align:right;font-size:clamp(19px,4.8vw,26px);font-weight:700;padding-inline-start:34px}
.pbody .bar{font-size:18px}
.pans{margin-top:22px;font-size:28px;font-weight:800;color:var(--pink);animation:pop .35s ease}
.pans p{color:var(--pink)}
/* الصديق الخفي */
.hello{font-size:20px;font-weight:700;margin:8px 0}
.gift{text-align:center;cursor:pointer;padding:30px 18px;border-style:dashed}
.gift.open{cursor:default;border-style:solid;animation:pop .4s ease}
.gift .gname{font-size:42px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4}
.gift small{color:var(--muted);font-weight:700}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* صراحة ولا جرأة */
.turn{font-size:30px;font-weight:800;min-height:52px;margin-bottom:10px}
.todbtns{display:flex;gap:10px}
.todbtns .btn{flex:1}
.btn.truth{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.dare{background:linear-gradient(135deg,#f97316,#ec4899);color:#fff}
.qcard{text-align:center}
.qcard small{color:var(--pink);font-weight:800;font-size:16px}
.qcard p{font-size:23px;font-weight:700;margin:12px 0 16px;line-height:1.7}
.qcard.flip{animation:pop .35s ease}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="polish.js?v=2"></script>
<script src="modes.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
