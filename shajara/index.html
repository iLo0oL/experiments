<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1411">
<meta name="description" content="شجرة العائلة: سجّل أهلك، شوف الشجرة، واعرف صلة القرابة، وشاركها مع العائلة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شجرتنا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>شجرتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1411;--bg2:#121b17;--card:#18231e;--card2:#203029;--line:#2a3b33;--text:#ecf2ee;--muted:#93a89d;--acc:#46c08a;--acc2:#2f9b6c;--gold:#e2b866;--m:#5aa2ef;--f:#e886b6;--danger:#f0645f;--warn:#f0a94a;--shadow:0 8px 28px rgba(0,0,0,.45);--grid:rgba(255,255,255,.04);--lines:#4f7464;--onacc:#05130c;--hl:rgba(70,192,138,.18)}
body.light{--bg:#f3f5ef;--bg2:#e8eee5;--card:#ffffff;--card2:#eef3ea;--line:#d6e0d3;--text:#14211a;--muted:#5b6e63;--acc:#23945d;--acc2:#1c7a4c;--gold:#a8791f;--m:#2f7fd6;--f:#cc4a88;--danger:#d64541;--warn:#c27a12;--shadow:0 8px 22px rgba(20,40,30,.14);--grid:rgba(0,0,0,.05);--lines:#93b2a2;--onacc:#ffffff;--hl:rgba(35,148,93,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:9px 12px;padding-top:max(9px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;cursor:pointer}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#3fbf86,#1b5d45);display:grid;place-items:center;flex-shrink:0;color:#fff}
.logo svg{width:22px;height:22px}
.brand div{min-width:0}
.brand h1{font-size:18px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex-shrink:0}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--acc)}.pill.saving i{background:var(--gold);animation:blink 1s infinite}.pill.offline i{background:var(--warn)}.pill.error i{background:var(--danger)}
.pill.ro{color:var(--gold)}
@keyframes blink{50%{opacity:.3}}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text);flex-shrink:0}
.ib:hover{background:var(--card)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none}
.view.on{display:block}
nav.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:700}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg.i{width:23px;height:23px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;color:var(--text);text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--text)}
.chip.m{border-color:color-mix(in srgb,var(--m) 45%,var(--line))}
.chip.f{border-color:color-mix(in srgb,var(--f) 45%,var(--line))}
.chip.act{background:var(--hl);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));color:var(--acc)}
.chip.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* tree */
#vTree{overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:22px 22px}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nd.dragging>.pb{opacity:.3}
.pb.ghost{position:fixed!important;left:0;top:0;z-index:60;pointer-events:none;opacity:.95;box-shadow:var(--shadow);transition:none}
.ghost .gl{position:absolute;top:66px;right:50%;transform:translateX(50%);white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:800;color:var(--text)}
.ghost .gl.bad{color:var(--danger)}.ghost .gl.ok{color:var(--acc)}
.dropt{outline:2.5px dashed var(--acc)!important;outline-offset:3px}
.slot{position:absolute;width:4px;border-radius:2px;background:var(--acc);pointer-events:none;z-index:3}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#world path{fill:none;stroke:var(--lines);stroke-width:2;stroke-linejoin:round}
.nd{position:absolute;display:flex;gap:6px;height:60px}
.pb{width:124px;height:60px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--m);border-radius:14px;display:flex;align-items:center;gap:7px;padding:0 7px;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;position:relative}
.nd.f>.pb{border-top-color:var(--f)}
.nd.me>.pb{outline:2.5px solid var(--gold);outline-offset:2px}
.nd.hl>.pb{animation:pulse 1.4s ease 2}
@keyframes pulse{40%{box-shadow:0 0 0 8px var(--hl),0 2px 8px rgba(0,0,0,.2);transform:scale(1.06)}}
.tx{min-width:0;flex:1;line-height:1.25}
.tx b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--m);overflow:hidden}
.av.f{background:var(--f)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.dd{filter:grayscale(.7);opacity:.8}
.sc{width:96px;height:50px;margin-top:5px;flex-shrink:0;background:var(--card2);border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:6px;padding:0 7px;cursor:pointer}
.sc .av{width:24px;height:24px;font-size:11px}
.sc .tx b{font-size:13px;font-weight:700}
.sc .tx small{font-size:10.5px}
.sc{position:relative}.sc .ring{position:absolute;top:-8px;left:-6px;font-size:11px;line-height:1;background:var(--bg);border-radius:50%;padding:2px}
.sc.dv{opacity:.72}.sc.dv .ring{filter:grayscale(1)}
.wd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;vertical-align:0;flex-shrink:0}
.ksec{font-size:13px;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.milk{background:color-mix(in srgb,var(--gold) 9%,transparent);border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));border-radius:16px;padding:4px 12px 12px;margin-top:12px}
.tg{position:absolute;top:49px;right:62px;transform:translateX(50%);min-width:24px;height:22px;padding:0 6px;border-radius:12px;background:var(--acc);color:var(--onacc);font-size:12.5px;font-weight:800;line-height:22px;z-index:2;border:2px solid var(--bg)}
.tg.c{background:var(--gold)}
.tbar{position:absolute;top:10px;right:10px;left:10px;display:flex;gap:8px;z-index:5;pointer-events:none;align-items:center}
.tbar>*{pointer-events:auto}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--text)}
.fbtn.rt{flex:1;min-width:0;justify-content:flex-start}
.fbtn.rt span{overflow:hidden;text-overflow:ellipsis}
.fbtn.sq{width:40px;padding:0;justify-content:center}
.qbar{position:absolute;top:58px;right:10px;left:10px;display:flex;gap:6px;z-index:5;overflow-x:auto;scrollbar-width:none;pointer-events:none;padding-bottom:2px}
.qbar::-webkit-scrollbar{display:none}
.qbar>*{pointer-events:auto}
.qc2{flex-shrink:0;height:32px;padding:0 11px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.qc2.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,var(--line));background:var(--hl)}
.nd.ln>.pb{box-shadow:0 0 0 2.5px var(--gold),0 2px 8px rgba(0,0,0,.18)}
.zbar{position:absolute;left:10px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.empty{max-width:420px;margin:0 auto;padding:46px 22px;text-align:center}
.empty .big{width:86px;height:86px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;background:var(--hl);color:var(--acc)}
.empty .big svg{width:48px;height:48px}
.empty h2{font-size:21px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px}
.empty .btn{margin:5px}
/* list */
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 100px}
.sbox{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 14px 8px;margin:-12px -14px 6px}
.srch{position:relative}
.srch svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch input{padding-right:40px}
.frow{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none;align-items:center}
.frow::-webkit-scrollbar{display:none}
.frow .cnt{margin-right:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.msel{height:36px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:0 12px;font:inherit;font-size:14px;max-width:100%}
.msel.on{border-color:var(--acc);color:var(--acc);background:var(--hl)}
.prow{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:8px;cursor:pointer;width:100%;text-align:right}
.prow:hover{border-color:var(--acc)}
.prow .av{width:42px;height:42px;font-size:17px}
.prow .tx b{font-size:15px;white-space:normal}
.prow .tx small{font-size:12.5px;white-space:normal}
.prow .gen{font-size:11.5px;color:var(--muted);background:var(--card2);border-radius:8px;padding:2px 7px;white-space:nowrap}
.fab{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;height:52px;padding:0 18px;border-radius:18px;background:var(--acc);color:var(--onacc);font-weight:800;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
/* more */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card p.d{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.rowb{display:flex;flex-wrap:wrap;gap:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .l{min-width:0}
.set .l small{display:block;color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:26px;text-align:center}
.sw{width:48px;height:28px;border-radius:15px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on:after{right:23px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.trow.on{background:var(--hl);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.trow .tx b{font-size:14.5px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.sh{color:var(--acc)}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;overflow-x:hidden;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .2s;box-shadow:var(--shadow)}
.ov.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-right:auto}
.ov.dlg{align-items:center;padding:20px}
.ov.dlg .sheet{border-radius:20px;max-width:400px;padding:20px}
.ov.dlg .sheet p{white-space:pre-line}
.dlg p{color:var(--muted);margin-bottom:16px;white-space:pre-line}
.dacts{display:flex;flex-direction:column;gap:8px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.fld>span i{font-style:normal;font-weight:500}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qa{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:14px;font-weight:700}
.qa .ok{color:var(--acc)}.qa .nw{color:var(--gold)}.qa i{font-style:normal;color:var(--muted)}
.pedw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.ped{position:relative;margin:8px}.ped svg{position:absolute;inset:0;pointer-events:none}.ped path{fill:none;stroke:var(--lines);stroke-width:2}
.pg{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--m);border-radius:11px;padding:0 9px;text-align:right;overflow:hidden}
.pg.f{border-top-color:var(--f)}.pg b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.pg small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pg.em{border-style:dashed;border-top-width:1px;color:var(--muted);font-size:12px;align-items:center;background:transparent}
.iss{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.iss b{display:block;font-size:14.5px}.iss small{color:var(--muted);font-size:13px}.iss .rowb{flex-shrink:0}
.city{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;text-align:right}
.city .cb{position:absolute;inset-block:0;right:0;background:var(--hl)}.city b,.city i{position:relative;font-style:normal}.city i{color:var(--muted);font-size:13px}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:20px}
#lock .lk{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;text-align:center}#lock .big{font-size:54px}#lock p{color:var(--muted);margin:0}#lock input{text-align:center;font-size:24px;letter-spacing:8px}#lock small{color:var(--danger);min-height:18px}
.dua{background:var(--hl);border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.8;text-align:center}
.dm{display:flex;gap:6px}.dm select{flex:1;min-width:0;padding-inline:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.pick{width:100%;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:right;min-height:44px}
.pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .ph{color:var(--muted)}
.qc{margin-top:7px}
.chk{display:flex;align-items:center;gap:9px;margin-bottom:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.phrow{display:flex;align-items:center;gap:10px}
.av.big{width:56px;height:56px;font-size:22px}
.acts{display:flex;gap:10px;margin-top:8px}
.acts .btn{flex:1}
.plist{max-height:56dvh;overflow-y:auto;margin-top:8px}
.plist .prow{padding:8px 10px}
.plist .prow .av{width:34px;height:34px;font-size:14px}
/* person */
.phead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.phead .av{width:68px;height:68px;font-size:28px}
.phead h3{font-size:22px;line-height:1.25}
.phead .fn{color:var(--muted);font-size:14px;margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.facts b{color:var(--text);font-weight:700}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;white-space:pre-wrap;font-size:14px}
.sec{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:800}
.krow{display:flex;align-items:center;gap:6px}
.krow .chip{flex:1;justify-content:flex-start;min-width:0}
.krow .chip span{overflow:hidden;text-overflow:ellipsis}
.mv{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--card)}
.kids{display:flex;flex-direction:column;gap:6px}
.rel{background:linear-gradient(135deg,var(--hl),transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:16px;padding:14px;margin-top:10px}
.rel .big{font-size:20px;font-weight:800}
.rel .big em{font-style:normal;color:var(--acc)}
.rel small{display:block;color:var(--muted);margin-top:4px;font-size:13.5px}

<script>
(function () {
'use strict';
const T = window.Tajarib || null;
/* ---------- أدوات عامة ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  raw(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const latin = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const norm = s => latin(s).toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/\s+/g, ' ').trim();
const newId = p => T ? T.newId(p) : p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const push = (m, k, v) => { const a = m.get(k); if (a) a.push(v); else m.set(k, [v]); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* العدد مع المعدود: شخص واحد، شخصين، 3 أشخاص، 11 شخص */
const ppl = n => n === 1 ? 'شخص واحد' : n === 2 ? 'شخصين' : (n % 100 >= 3 && n % 100 <= 10) ? n + ' أشخاص' : n + ' شخص';
const cnt = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n % 100 >= 3 && n % 100 <= 10) ? n + ' ' + few : n + ' ' + many;
const ICON = {
  edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  target: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  link: '<svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  user: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-6.5 8-6.5s7 2 8 6.5"/></svg>',
  q: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6M12 17h.01"/></svg>'
};

/* ---------- المظهر ---------- */
function applyTheme() { const l = LS.get('shajara.theme', 'dark') === 'light'; document.body.classList.toggle('light', l); $('meta[name=theme-color]').content = l ? '#e8eee5' : '#0d1411'; }
applyTheme();
$('#themeBtn').onclick = () => { LS.set('shajara.theme', document.body.classList.contains('light') ? 'dark' : 'light'); applyTheme(); if (S.view === 'more') renderMore(); };

/* ---------- التنبيه السفلي ---------- */
let toastT;
function toast(msg, action) {
  const t = $('#toast'), b = $('#toast button'); $('#toast span').textContent = msg;
  if (action) { b.hidden = false; b.textContent = action.text; b.onclick = () => { t.classList.remove('on'); action.fn(); }; } else b.hidden = true;
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), action ? 6500 : 2600);
}

/* ---------- النوافذ ---------- */
const sheets = [];
let lastTouchUp = 0; document.addEventListener('pointerup', e => { if (e.pointerType === 'touch') lastTouchUp = Date.now(); }, true);
function openSheet(html, o = {}) {
  const ov = document.createElement('div'); ov.className = 'ov' + (o.dlg ? ' dlg' : '');
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${o.dlg ? '' : '<div class="grab"></div>'}${html}</div>`;
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('on'));
  const rec = { ov, el: ov.firstChild, onClose: o.onClose, kind: o.kind || '', data: o.data };
  sheets.push(rec);
  /* «النقرة الشبح»: بعد اللمس المتصفح يرسل نقرة ثانية، فنتجاهل أي نقرة بأول لحظة بعد ما تنفتح النافذة */
  rec.t0 = Date.now(); const ghost = rec.t0 - lastTouchUp < 150;
  ov.addEventListener('click', e => { if (ghost && Date.now() - rec.t0 < 350) { e.stopPropagation(); e.preventDefault(); } }, true);
  ov.addEventListener('click', e => { if (e.target === ov && !o.modal) closeSheet(rec); else if (e.target.closest('[data-close]')) closeSheet(rec); });
  return rec;
}
function closeSheet(rec, val) {
  rec = rec || sheets[sheets.length - 1]; if (!rec) return; const i = sheets.indexOf(rec); if (i < 0) return; sheets.splice(i, 1);
  rec.ov.classList.remove('on'); setTimeout(() => rec.ov.remove(), 180); if (rec.onClose) rec.onClose(val);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(); });
function ask(title, text, buttons) {
  return new Promise(res => {
    let done = false;
    const btns = buttons || [{ v: true, t: 'أكيد', cls: 'danger' }, { v: false, t: 'إلغاء', cls: 'ghost' }];
    const sh = openSheet(`<h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}<div class="dacts">${btns.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div>`,
      { dlg: true, onClose: v => { if (!done) { done = true; res(v === undefined ? (btns.find(b => b.cancel) || { v: false }).v : v); } } });
    sh.el.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) closeSheet(sh, btns[+b.dataset.i].v); });
  });
}
function promptText(title, value, ph) {
  return new Promise(res => {
    let ok = false;
    const sh = openSheet(`<h2>${esc(title)}</h2><input id="ptx" maxlength="60" placeholder="${esc(ph || '')}"><div class="acts"><button class="btn pri" id="pok">تمام</button><button class="btn ghost" data-close>إلغاء</button></div>`, { dlg: true, onClose: () => res(ok ? $('#ptx', sh.el).value.trim() : null) });
    const inp = $('#ptx', sh.el); inp.value = value || ''; setTimeout(() => inp.focus(), 60);
    const go = () => { ok = true; closeSheet(sh); };
    $('#pok', sh.el).onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  });
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (x) { } ta.remove(); return ok;
  }
}
let dlHook = null;
function download(name, data, type) {
  if (dlHook) return dlHook(name, data);
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function pickFile(accept) {
  return new Promise(res => {
    const inp = $('#fileIn'); inp.value = ''; inp.accept = accept || '';
    inp.onchange = () => res(inp.files[0] || null); inp.click();
  });
}

/* ---------- مستند محلي بنفس واجهة مكتبة المزامنة ---------- */
class LocalDoc {
  constructor(key, o) { this.key = key; this.onChange = o.onChange || (() => { }); const c = LS.get(key, null) || {}; this.data = { items: c.items || {}, meta: c.meta || null }; this.status = 'local'; this.local = true; }
  start() { return this; } stop() { }
  items() { return Object.entries(this.data.items).map(([id, it]) => ({ ...it, id })); }
  item(id) { const it = this.data.items[id]; return it ? { ...it, id } : null; }
  meta() { return this.data.meta ? { ...this.data.meta } : null; }
  canEdit() { return true; } hasPending() { return false; }
  _save() { if (!LS.set(this.key, this.data)) toast('مساحة التخزين بالجهاز امتلأت، صغّر الصور أو احذف بيانات قديمة'); this.onChange({ local: true }); }
  set(id, obj) { const it = { ...obj, u: Date.now() }; delete it.id; this.data.items[id] = it; this._save(); return it; }
  del(id) { delete this.data.items[id]; this._save(); }
  setMeta(obj) { this.data.meta = { ...obj, u: Date.now() }; delete this.data.meta.id; this._save(); }
  bulk(map) { const t = Date.now(); for (const [id, o] of Object.entries(map)) { if (o) { const it = { ...o, u: t }; delete it.id; this.data.items[id] = it; } else delete this.data.items[id]; } this._save(); }
}

/* ---------- الحالة ---------- */
let trees = LS.get('shajara.trees', []);
const saveTrees = () => LS.set('shajara.trees', trees);
const S = {
  cur: null, doc: null, P: new Map(), M: [], kidsF: new Map(), kidsM: new Map(), sp: new Map(), meta: {}, dev: {}, col: new Set(),
  view: LS.get('shajara.view', 'tree'), gens: LS.get('shajara.gens', 5), dkids: LS.get('shajara.dkids', true), subMom: LS.get('shajara.subMom', false), hlLine: LS.get('shajara.hlLine', false), depthLim: 0, status: 'local', statusMsg: '', lost: null,
  filter: 'all', sort: 'name', lay: null, renderMs: 0
};
function newLocalTree(name) { const rec = { k: 'L' + newId(''), name: name || 'شجرة العائلة' }; trees.push(rec); saveTrees(); return rec; }
function saveDev() { S.dev.col = [...S.col]; LS.set('shajara.dev.' + S.cur.k, S.dev); }
function canEdit() {
  if (!S.doc || S.lost) return false; if (S.doc.local) return true;
  return S.doc.role ? S.doc.role === 'edit' : !!S.cur.edit;
}
function guardEdit() { if (canEdit()) return true; toast(S.doc && !S.doc.local && !S.doc.role ? 'لحظة، أتأكد من صلاحيتك…' : 'عندك رابط عرض بس، ما تقدر تعدّل'); return false; }

function openTree(rec) {
  if (S.doc) S.doc.stop();
  S.cur = rec; LS.set('shajara.cur', rec.k); S.dev = LS.get('shajara.dev.' + rec.k, {}) || {}; S.col = new Set(S.dev.col || []); S.lost = null; S.zInit = false;
  if (rec.id) {
    if (!T) { S.doc = new LocalDoc('shajara.void', {}); S.lost = 'nolib'; }
    else {
      S.status = 'idle'; S.statusMsg = ''; S.doc = T.open({ id: rec.id, key: rec.key, kind: 'shajara', onChange: onDocChange, onStatus: onDocStatus }).start();
      /* سجل التعديلات: كل تعديل بالشجرة المشتركة يحمل اسم اللي عدّله */
      const raw = S.doc.set.bind(S.doc); S.doc.set = (id, obj) => { const nm = editorName(); return raw(id, nm ? { ...obj, ed: nm } : obj); };
    }
    S.sugg = []; setTimeout(loadSugg, 1500);
  } else { S.status = 'local'; S.doc = new LocalDoc('shajara.local.' + rec.k, { onChange: onDocChange }); }
  rebuild(); renderAll();
}
let rq = 0;
function onDocChange() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; rebuild(); renderAll(); }); }
function onDocStatus(s, msg) {
  const before = canEdit(); S.status = s; S.statusMsg = msg || '';
  const code = S.doc && S.doc.error && S.doc.error.code; if (code === 'bad_key' || code === 'not_found') S.lost = code;
  renderStatus(); if (before !== canEdit() || S.lost) renderAll();
}

/* ---------- الفهارس ---------- */
const ord = p => (p.o != null ? +p.o : +(p.c || 0));
function rebuild() {
  const P = new Map(), M = [], R = [], RS = [];
  for (const it of S.doc.items()) { if (it.t === 'p' && it.f) P.set(it.id, it); else if (it.t === 'm') M.push(it); else if (it.t === 'r') R.push(it); else if (it.t === 'rs') RS.push(it); }
  const kidsF = new Map(), kidsM = new Map(), sp = new Map();
  for (const p of P.values()) { if (p.fa && P.has(p.fa) && p.fa !== p.id) push(kidsF, p.fa, p); if (p.mo && P.has(p.mo) && p.mo !== p.id) push(kidsM, p.mo, p); }
  const byO = (a, b) => ord(a) - ord(b) || (a.id < b.id ? -1 : 1);
  for (const a of kidsF.values()) a.sort(byO); for (const a of kidsM.values()) a.sort(byO);
  M.sort((a, b) => (+a.o || 0) - (+b.o || 0));
  const seenPair = new Set();
  for (const m of M) { if (!P.has(m.a) || !P.has(m.b) || m.a === m.b) continue; const k = m.a + '|' + m.b; if (seenPair.has(k)) continue; seenPair.add(k); push(sp, m.a, m.b); push(sp, m.b, m.a); }
  /* الزواج (ومنه نعرف الطلاق) والرضاعة */

/* ممكن مكررين: نفس الاسم والجنس، وما فيه تعارض بالأب أو الأم */
function dupsOf(p) {
  if (!S._dn) { S._dn = new Map(); for (const x of S.P.values()) push(S._dn, (x.g === 'f' ? 'f' : 'm') + '|' + norm(x.f), x); }
  const out = [];
  for (const x of S._dn.get((p.g === 'f' ? 'f' : 'm') + '|' + norm(p.f)) || []) {
    if (x.id === p.id) continue;
    if (x.fa === p.id || x.mo === p.id || p.fa === x.id || p.mo === x.id || (S.sp.get(p.id) || []).includes(x.id)) continue;
    const fa1 = S.P.has(p.fa) ? p.fa : '', fa2 = S.P.has(x.fa) ? x.fa : '', mo1 = S.P.has(p.mo) ? p.mo : '', mo2 = S.P.has(x.mo) ? x.mo : '';
    if (fa1 && fa2 && fa1 !== fa2 && norm(S.P.get(fa1).f) !== norm(S.P.get(fa2).f)) continue;
    if (mo1 && mo2 && mo1 !== mo2 && norm(S.P.get(mo1).f) !== norm(S.P.get(mo2).f)) continue;
    if (p.by && x.by && (p.cal || 'h') === (x.cal || 'h') && Math.abs(p.by - x.by) > 2) continue;
    const f1 = famOf(p), f2 = famOf(x); if (f1 && f2 && norm(f1) !== norm(f2)) continue;
    out.push(x);
  }
  return out;
}

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = 88, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d'); const m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url;
  });
}

/* ---------- الحذف مع التراجع ---------- */
async function deletePerson(id) {
  const p = S.P.get(id); if (!p) return; const kids = kidsOf(id);
  let mode = 'one';
  if (kids.length) {
    const desc = descendants(id);
    mode = await ask(`حذف ${p.f}`, `${p.f} ${p.g === 'f' ? 'عندها' : 'عنده'} ${kids.length} من العيال بالشجرة. وش تبي تسوي؟`, [
      { v: 'one', t: `احذف ${p.f} بس وخلّ العيال`, cls: '' }, { v: 'all', t: `احذف ${p.f} وكل ذريت${p.g === 'f' ? 'ها' : 'ه'} (${ppl(desc.size + 1)})`, cls: 'danger' }, { v: null, t: 'إلغاء', cls: 'ghost', cancel: true }]);
    if (!mode) return;
  } else if (!await ask(`حذف ${p.f}؟`, `متأكد تبي تحذف ${fullName(p, 3)} من الشجرة؟ تقدر تتراجع بعدها على طول.`)) return;
  const ids = new Set(mode === 'all' ? [id, ...descendants(id)] : [id]);
  const snap = new Map();
  for (const x of ids) snap.set(x, strip(S.P.get(x)));
  for (const m of S.M) if (ids.has(m.a) || ids.has(m.b)) snap.set(m.id, strip(m));
  const milkDel = [...S.R.filter(r => ids.has(r.c) || ids.has(r.m) || ids.has(r.f)), ...S.RS.filter(r => ids.has(r.a) || ids.has(r.b))];
  for (const r of milkDel) snap.set(r.id, strip(r));
  const fix = [];
  for (const q of S.P.values()) if (!ids.has(q.id) && (ids.has(q.fa) || ids.has(q.mo))) { snap.set(q.id, strip(q)); const o = strip(q); if (ids.has(o.fa)) { if (!o.fam) { const fm = famOf(q); if (fm) o.fam = fm; } delete o.fa; } if (ids.has(o.mo)) delete o.mo; fix.push([q.id, o]); }
  try {
    for (const m of S.M) if (ids.has(m.a) || ids.has(m.b)) S.doc.del(m.id);
    for (const r of milkDel) S.doc.del(r.id);
    for (const x of ids) S.doc.del(x);
    for (const [i, o] of fix) S.doc.set(i, o);
  } catch (x) { toast(T ? T.errorText(x) : 'ما انحذف'); return; }
  if (S.dev.root && ids.has(S.dev.root)) { delete S.dev.root; saveDev(); }
  if (personSheet && ids.has(personSheet.data.id)) closeSheet(personSheet);
  toast(ids.size > 1 ? `انحذف ${ppl(ids.size)}` : `انحذف ${p.f}`, { text: 'تراجع', fn: () => { for (const [i, o] of snap) S.doc.set(i, o); toast('رجّعتهم ✓'); } });
}

function drawTreeCanvas(maxScale) {
  const root = getRoot(); if (!root) return null;
  const L = (S.lay && S.layRoot === root.id) ? S.lay : computeLayout(root); if (!L) return null;
  const head = 80, oy = PAD + 46, w = L.W, h = L.H - oy + head + 10;
  /* حد آمن لحجم اللوحة (سفاري الآيفون يرفض أكبر من ~16 مليون بكسل) */
  let s = Math.min(maxScale || 2, 16000 / w, 16000 / h, Math.sqrt(16e6 / (w * h))); s = Math.max(s, 0.05);
  const c = document.createElement('canvas'); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s);
  const x = c.getContext('2d'); x.scale(s, s);
  const ff = getComputedStyle(document.body).fontFamily;
  const col = { bg: '#fbfcf8', card: '#ffffff', line: '#d3ddd0', lines: '#8fae9e', text: '#14211a', muted: '#5b6e63', m: '#2f7fd6', f: '#cc4a88', sp: '#f1f5ee' };
  x.fillStyle = col.bg; x.fillRect(0, 0, w, h);
  x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = col.text; x.font = `800 26px ${ff}`; x.fillText(S.cur.name || 'شجرتنا', w / 2, 34);
  x.fillStyle = col.muted; x.font = `500 13px ${ff}`; x.fillText(`شجرتنا · ${ppl(L.list.length)} · ${stamp()}`, w / 2, 58);
  x.translate(0, head + 10 - oy);
  const rr = (X, Y, W, H, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); };
  const fit = (t, mw) => { if (x.measureText(t).width <= mw) return t; while (t.length > 1 && x.measureText(t + '…').width > mw) t = t.slice(0, -1); return t + '…'; };
  x.lineWidth = 2;
  for (const pth of linkPaths(L)) { if (!pth.d) continue; x.strokeStyle = pth.c || col.lines; x.stroke(new Path2D(pth.d)); }
  for (const n of L.list) {
    const p = n.p, bx = n.right - PW, by = n.y;
    x.fillStyle = col.card; x.strokeStyle = col.line; x.lineWidth = 1; rr(bx, by, PW, NH, 12); x.fill(); x.stroke();
    x.save(); rr(bx, by, PW, NH, 12); x.clip(); x.fillStyle = p.g === 'f' ? col.f : col.m; x.fillRect(bx, by, PW, 4); x.restore();
    x.fillStyle = col.text; x.font = `800 15px ${ff}`; x.fillText(fit(p.f, PW - 14), bx + PW / 2, by + 25);
    const ns = nodeSub(n); if (ns.t) { x.fillStyle = ns.c || col.muted; x.font = `${ns.c ? 700 : 500} 11px ${ff}`; x.fillText(fit(ns.t, PW - 12), bx + PW / 2, by + 44); }
    if (n.col) { x.fillStyle = '#c99a3a'; rr(bx + PW / 2 - 16, by + NH - 6, 32, 16, 8); x.fill(); x.fillStyle = '#fff'; x.font = `800 11px ${ff}`; x.fillText('+' + n.hidden, bx + PW / 2, by + NH + 2); }
    n.sps.forEach((s2, i) => {
      const sx = bx - (i + 1) * (SW + SG), sy = by + 5;
      x.fillStyle = col.sp; x.strokeStyle = n.multi ? wcol(i) : col.line; x.lineWidth = n.multi ? 2 : 1; rr(sx, sy, SW, 50, 10); x.fill(); x.stroke(); x.lineWidth = 1;
      const sub = spouseSub(p, s2);
      x.fillStyle = s2.g === 'f' ? col.f : col.m; x.font = `700 13px ${ff}`; x.fillText(fit(s2.f, SW - 12), sx + SW / 2, sy + (sub ? 20 : 26));
      if (sub) { x.fillStyle = col.muted; x.font = `500 10.5px ${ff}`; x.fillText(fit(sub, SW - 10), sx + SW / 2, sy + 37); }
    });
  }

}
