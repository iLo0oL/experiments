<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1411">
<meta name="description" content="شجرة العائلة: سجّل أهلك، شوف الشجرة، واعرف صلة القرابة، وشاركها مع العائلة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شجرتنا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>شجرتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1411;--bg2:#121b17;--card:#18231e;--card2:#203029;--line:#2a3b33;--text:#ecf2ee;--muted:#93a89d;--acc:#46c08a;--acc2:#2f9b6c;--gold:#e2b866;--m:#5aa2ef;--f:#e886b6;--danger:#f0645f;--warn:#f0a94a;--shadow:0 8px 28px rgba(0,0,0,.45);--grid:rgba(255,255,255,.04);--lines:#4f7464;--onacc:#05130c;--hl:rgba(70,192,138,.18)}
body.light{--bg:#f3f5ef;--bg2:#e8eee5;--card:#ffffff;--card2:#eef3ea;--line:#d6e0d3;--text:#14211a;--muted:#5b6e63;--acc:#23945d;--acc2:#1c7a4c;--gold:#a8791f;--m:#2f7fd6;--f:#cc4a88;--danger:#d64541;--warn:#c27a12;--shadow:0 8px 22px rgba(20,40,30,.14);--grid:rgba(0,0,0,.05);--lines:#93b2a2;--onacc:#ffffff;--hl:rgba(35,148,93,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:9px 12px;padding-top:max(9px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;cursor:pointer}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,#3fbf86,#1b5d45);display:grid;place-items:center;flex-shrink:0;color:#fff}
.logo svg{width:22px;height:22px}
.brand div{min-width:0}
.brand h1{font-size:18px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex-shrink:0}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--acc)}.pill.saving i{background:var(--gold);animation:blink 1s infinite}.pill.offline i{background:var(--warn)}.pill.error i{background:var(--danger)}
.pill.ro{color:var(--gold)}
@keyframes blink{50%{opacity:.3}}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text);flex-shrink:0}
.ib:hover{background:var(--card)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none}
.view.on{display:block}
nav.tabs{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:700}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg.i{width:23px;height:23px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;color:var(--text);text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--text)}
.chip.m{border-color:color-mix(in srgb,var(--m) 45%,var(--line))}
.chip.f{border-color:color-mix(in srgb,var(--f) 45%,var(--line))}
.chip.act{background:var(--hl);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));color:var(--acc)}
.chip.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* tree */
#vTree{overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:22px 22px}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nd.dragging>.pb{opacity:.3}
.nd.mir>.pb{border-style:dashed;opacity:.92}
.pb.ghost{position:fixed!important;left:0;top:0;z-index:60;pointer-events:none;opacity:.95;box-shadow:var(--shadow);transition:none}
.ghost .gl{position:absolute;top:66px;right:50%;transform:translateX(50%);white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:800;color:var(--text)}
.ghost .gl.bad{color:var(--danger)}.ghost .gl.ok{color:var(--acc)}
.dropt{outline:2.5px dashed var(--acc)!important;outline-offset:3px}
.slot{position:absolute;width:4px;border-radius:2px;background:var(--acc);pointer-events:none;z-index:3}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#world path{fill:none;stroke:var(--lines);stroke-width:2;stroke-linejoin:round}
.nd{position:absolute;display:flex;gap:6px;height:60px}
.pb{width:124px;height:60px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--m);border-radius:14px;display:flex;align-items:center;gap:7px;padding:0 7px;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;position:relative}
.nd.f>.pb{border-top-color:var(--f)}
.nd.me>.pb{outline:2.5px solid var(--gold);outline-offset:2px}
.nd.hl>.pb{animation:pulse 1.4s ease 2}
@keyframes pulse{40%{box-shadow:0 0 0 8px var(--hl),0 2px 8px rgba(0,0,0,.2);transform:scale(1.06)}}
.tx{min-width:0;flex:1;line-height:1.25}
.tx b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--m);overflow:hidden}
.av.f{background:var(--f)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.dd{filter:grayscale(.7);opacity:.8}
.sc{width:96px;height:50px;margin-top:5px;flex-shrink:0;background:var(--card2);border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:6px;padding:0 7px;cursor:pointer}
.sc .av{width:24px;height:24px;font-size:11px}
.sc .tx b{font-size:13px;font-weight:700}
.sc .tx small{font-size:10.5px}
.sc{position:relative}.sc .ring{position:absolute;top:-8px;left:-6px;font-size:11px;line-height:1;background:var(--bg);border-radius:50%;padding:2px}
.sc.dv{opacity:.72}.sc.dv .ring{filter:grayscale(1)}
.wd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;vertical-align:0;flex-shrink:0}
.ksec{font-size:13px;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.milk{background:color-mix(in srgb,var(--gold) 9%,transparent);border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));border-radius:16px;padding:4px 12px 12px;margin-top:12px}
.tg{position:absolute;top:49px;right:62px;transform:translateX(50%);min-width:24px;height:22px;padding:0 6px;border-radius:12px;background:var(--acc);color:var(--onacc);font-size:12.5px;font-weight:800;line-height:22px;z-index:2;border:2px solid var(--bg)}
.tg.c{background:var(--gold)}
.tbar{position:absolute;top:10px;right:10px;left:10px;display:flex;gap:8px;z-index:5;pointer-events:none;align-items:center}
.tbar>*{pointer-events:auto}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--text)}
.fbtn.rt{flex:1;min-width:0;justify-content:flex-start}
.fbtn.rt span{overflow:hidden;text-overflow:ellipsis}
.fbtn.sq{width:40px;padding:0;justify-content:center}
.qbar{position:absolute;top:58px;right:10px;left:10px;display:flex;gap:6px;z-index:5;overflow-x:auto;scrollbar-width:none;pointer-events:none;padding-bottom:2px}
.qbar::-webkit-scrollbar{display:none}
.qbar>*{pointer-events:auto}
.qc2{flex-shrink:0;height:32px;padding:0 11px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.qc2.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,var(--line));background:var(--hl)}
.nd.brc>.pb{border-top:5px solid var(--br);background:color-mix(in srgb,var(--br) 13%,var(--card))}
.nd.ln>.pb{box-shadow:0 0 0 2.5px #2fb877,0 2px 8px rgba(0,0,0,.18)}
.zbar{position:absolute;left:10px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.empty{max-width:420px;margin:0 auto;padding:46px 22px;text-align:center}
.empty .big{width:86px;height:86px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;background:var(--hl);color:var(--acc)}
.empty .big svg{width:48px;height:48px}
.empty h2{font-size:21px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px}
.empty .btn{margin:5px}
/* list */
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 100px}
.sbox{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 14px 8px;margin:-12px -14px 6px}
.srch{position:relative}
.srch svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch input{padding-right:40px}
.frow{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none;align-items:center}
.frow::-webkit-scrollbar{display:none}
.frow .cnt{margin-right:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.msel{height:36px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:0 12px;font:inherit;font-size:14px;max-width:100%}
.msel.on{border-color:var(--acc);color:var(--acc);background:var(--hl)}
.prow{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:8px;cursor:pointer;width:100%;text-align:right}
.prow:hover{border-color:var(--acc)}
.prow .av{width:42px;height:42px;font-size:17px}
.prow .tx b{font-size:15px;white-space:normal}
.prow .tx small{font-size:12.5px;white-space:normal}
.prow .gen{font-size:11.5px;color:var(--muted);background:var(--card2);border-radius:8px;padding:2px 7px;white-space:nowrap}
.fab{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;height:52px;padding:0 18px;border-radius:18px;background:var(--acc);color:var(--onacc);font-weight:800;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
/* more */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card p.d{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.rowb{display:flex;flex-wrap:wrap;gap:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .l{min-width:0}
.set .l small{display:block;color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:26px;text-align:center}
.sw{width:48px;height:28px;border-radius:15px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on:after{right:23px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.trow.on{background:var(--hl);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.trow .tx b{font-size:14.5px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.sh{color:var(--acc)}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;overflow-x:hidden;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .2s;box-shadow:var(--shadow)}
.ov.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-right:auto}
.ov.dlg{align-items:center;padding:20px}
.ov.dlg .sheet{border-radius:20px;max-width:400px;padding:20px}
.ov.dlg .sheet p{white-space:pre-line}
.dlg p{color:var(--muted);margin-bottom:16px;white-space:pre-line}
.dacts{display:flex;flex-direction:column;gap:8px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.fld>span i{font-style:normal;font-weight:500}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qa{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:14px;font-weight:700}
.qa .ok{color:var(--acc)}.qa .nw{color:var(--gold)}.qa i{font-style:normal;color:var(--muted)}
.pedw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.ped{position:relative;margin:8px}.ped svg{position:absolute;inset:0;pointer-events:none}.ped path{fill:none;stroke:var(--lines);stroke-width:2}
.pg{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--m);border-radius:11px;padding:0 9px;text-align:right;overflow:hidden}
.pg.f{border-top-color:var(--f)}.pg b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.pg small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pg.em{border-style:dashed;border-top-width:1px;color:var(--muted);font-size:12px;align-items:center;background:transparent}
.iss{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.iss b{display:block;font-size:14.5px}.iss small{color:var(--muted);font-size:13px}.iss .rowb{flex-shrink:0}
.city{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;text-align:right}
.city .cb{position:absolute;inset-block:0;right:0;background:var(--hl)}.city b,.city i{position:relative;font-style:normal}.city i{color:var(--muted);font-size:13px}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:20px}
#lock .lk{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;text-align:center}#lock .big{font-size:54px}#lock p{color:var(--muted);margin:0}#lock input{text-align:center;font-size:24px;letter-spacing:8px}#lock small{color:var(--danger);min-height:18px}
.mems,.alb{margin-top:12px}.mem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative}
.mem .mt{white-space:pre-line;line-height:1.8}.mem small{color:var(--muted);font-size:12.5px}.mem .btn{position:absolute;top:6px;left:6px}.mem:has(.btn){padding-left:76px}
.albg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.albt{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);padding:0;display:grid;place-items:center}
.albt img{width:100%;height:100%;object-fit:cover}.albt.add{color:var(--acc);font-weight:700;font-size:13px;gap:2px}
.pvw{background:#000;border-radius:14px;overflow:hidden;display:grid;place-items:center;max-height:62vh}.pvw img{max-width:100%;max-height:62vh;object-fit:contain}
.auds{margin-top:12px}.aud{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative}
.aud .at{display:flex;flex-direction:column;margin-bottom:6px}.aud .at small{color:var(--muted);font-size:12.5px}.aud audio{width:100%;height:40px}.aud .btn{position:absolute;top:6px;left:6px}
.recw{display:flex;align-items:center;gap:10px;justify-content:center;font-size:30px;margin:10px 0 14px}.recw small{font-size:13px;color:var(--muted)}
.recdot{width:16px;height:16px;border-radius:50%;background:var(--danger);animation:rcd 1s infinite}@keyframes rcd{50%{opacity:.25}}
.tly{position:sticky;top:-1px;background:var(--bg2);padding:6px 10px;border-radius:10px;font-weight:800;color:var(--acc);margin:12px 0 6px;z-index:1}
.tle{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;color:var(--text);font:inherit}
.tle small{color:var(--muted);font-size:12.5px;margin-top:2px}
.tgl{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-weight:600}.tgl input{width:20px;height:20px;accent-color:var(--acc)}
#quiz{position:fixed;inset:0;z-index:400;background:var(--bg);color:var(--text);display:flex;flex-direction:column;padding:14px 16px 24px;overflow:auto}
#quiz .qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px}#quiz .qz-top span{color:var(--gold);font-weight:800}

  for (const r of milkDel) snap.set(r.id, strip(r));

/* ========== الذرية بشكل دائري ========== */
function sunSvg(id, depth, forImg) {
  const me = S.P.get(id), seen = new Set([id]);
  const build = (p, d) => { const n = { p, d, kids: [] }; if (d < depth) for (const k of kidsOf(p.id)) if (!seen.has(k.id)) { seen.add(k.id); n.kids.push(build(k, d + 1)); } n.w = n.kids.length ? n.kids.reduce((s, k) => s + k.w, 0) : 1; return n; };
  const root = build(me, 0), maxD = (function md(n) { return n.kids.length ? Math.max(...n.kids.map(md)) : n.d; })(root);
  const r0 = 70, rw = maxD > 3 ? 64 : 78, R = r0 + maxD * rw, W = 2 * R + 40, cx = W / 2, cy = W / 2;
  const light = forImg || S.bw || document.body.classList.contains('light'), bg = light ? '#fbfcf8' : '#0d1411', tc = light ? '#14211a' : '#ecf2ee', st = light ? '#ffffff' : '#0d1411';
  const ff = (getComputedStyle(document.body).fontFamily || 'sans-serif').replace(/"/g, "'");
  const pt = (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];

  const total = descendants(id).size;
  out += `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="${me.g === 'f' ? (light ? '#f7dce9' : '#3a2230') : (light ? '#d9e8f8' : '#1d3349')}" stroke="${st}" stroke-width="2"/><text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="17" font-weight="800" fill="${tc}">${esc(me.f)}</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="11.5" fill="${tc}" opacity=".75">${esc('ذريت' + (me.g === 'f' ? 'ها ' : 'ه ') + ppl(total))}</text>`;
  const arc = (n, a1, a2, br) => {
    if (n.d > 0) {
      const ri = r0 + (n.d - 1) * rw, ro = ri + rw - 2, big = a2 - a1 > Math.PI ? 1 : 0, full = a2 - a1 >= Math.PI * 2 - 1e-6;
      const colr = S.bw || forImg && S.bw ? ['#d9d9d9', '#bdbdbd', '#a6a6a6', '#8c8c8c', '#737373'][n.d % 5] : BRC[br % BRC.length];
      const op = S.bw ? 1 : Math.max(.35, 1 - (n.d - 1) * .16);
      let d;
      if (full) d = `M${cx} ${cy - ro}A${ro} ${ro} 0 1 1 ${cx - .01} ${cy - ro}L${cx - .01} ${cy - ri}A${ri} ${ri} 0 1 0 ${cx} ${cy - ri}Z`;
      else { const [x1, y1] = pt(ri, a1), [x2, y2] = pt(ro, a1), [x3, y3] = pt(ro, a2), [x4, y4] = pt(ri, a2); d = `M${x1} ${y1}L${x2} ${y2}A${ro} ${ro} 0 ${big} 1 ${x3} ${y3}L${x4} ${y4}A${ri} ${ri} 0 ${big} 0 ${x1} ${y1}Z`; }
      out += `<path d="${d}" fill="${colr}" fill-opacity="${op}" stroke="${st}" stroke-width="1.5"${!forImg ? ` data-go="${n.p.id}" style="cursor:pointer"` : ''}/>`;
      const am = (a1 + a2) / 2, rm = (ri + ro) / 2, len = (a2 - a1) * rm, fs = Math.min(14, Math.max(7.5, len / 4.2));
      if (len >= 9) {
        const [tx, ty] = pt(rm, am), tang = n.d === 1 && len > 60; let deg = am * 180 / Math.PI - 90;
        if (tang) deg = 0; else if (am > Math.PI) deg -= 180;
        const maxC = Math.max(3, Math.floor((tang ? len : rw - 6) / (fs * .62))), nm = n.p.f.length > maxC ? n.p.f.slice(0, maxC - 1) + '…' : n.p.f;
        out += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(1)}" font-weight="700" fill="${S.bw ? '#000' : '#111'}" transform="rotate(${deg.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" pointer-events="none">${esc(nm)}</text>`;
      }
    }
    let a = a1; n.kids.forEach((k, i) => { const span = (a2 - a1) * k.w / n.w; arc(k, a, a + span, n.d === 0 ? i : br); a += span; });
  };

}

/* ========== تقويم العائلة (ملف ics لتقويم الجوال) ========== */
function hijriMap(years) {
  const f = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }), m = new Map(), t0 = new Date(); t0.setHours(12, 0, 0, 0);
  for (let i = -2; i < 366 * years; i++) { const d = new Date(t0.getTime() + i * 864e5), pr = f.formatToParts(d), g = k => +(pr.find(x => x.type === k) || {}).value; m.set(`${g('year')}-${g('month')}-${g('day')}`, d); }
  return m;
}
function icsText() {
  const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const escI = t => String(t).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const fold = line => { const enc = new TextEncoder(); let out = '', cur = '', n = 0; for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 72) { out += cur + '\r\n '; cur = ''; n = 1; } cur += ch; n += b; } return out + cur; };
  const now = new Date(), stampI = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''), ev = [], hm = hijriMap(10), hy = today('h').y;
  const add = (uid, d, title, rule) => { const e = new Date(d.getTime() + 864e5); ev.push(['BEGIN:VEVENT', `UID:${uid}@shajara`, `DTSTAMP:${stampI}`, `DTSTART;VALUE=DATE:${ymd(d)}`, `DTEND;VALUE=DATE:${ymd(e)}`, `SUMMARY:${escI(title)}`, ...(rule ? ['RRULE:FREQ=YEARLY'] : []), 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escI(title)}`, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT']); };
  for (const p of S.P.values()) {
    if (hid(p)) continue; const dead = p.dead || p.dy, he = p.g === 'f' ? 'ها' : 'ه';
    const [m, d, kind] = dead ? [p.dmo, p.dda, 'd'] : [p.bmo, p.bda, 'b']; if (!m || !d) continue;
    const title = kind === 'b' ? `🎂 عيد ميلاد ${fullName(p, 2)}` : `🤲 ذكرى وفاة ${fullName(p, 2)}، الله يرحم${he}`;
    if (p.cal === 'g') { const y = now.getFullYear(); let dt = new Date(y, m - 1, d); if (dt < new Date(now.getFullYear(), now.getMonth(), now.getDate())) dt = new Date(y + 1, m - 1, d); add(`${p.id}-${kind}`, dt, title, true); }
    else for (let y = hy; y <= hy + 10; y++) { const dt = hm.get(`${y}-${m}-${d}`) || (d === 30 ? hm.get(`${y}-${m}-29`) : null); if (dt && dt >= new Date(now.getTime() - 864e5)) add(`${p.id}-${kind}-${y}`, dt, title, false); }
  }
  for (const c of S.CAP) { if (capOpen(c)) continue; const to = S.P.get(c.to); add(`${c.id}-cap`, new Date(c.open + 'T12:00:00'), `💌 تنفتح رسالة ${to ? 'لـ' + to.f : 'للعائلة'}`, false); }
  return { n: ev.length, text: ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//shajara//AR', 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${escI('عائلة ' + (S.cur.name || ''))}`, ...ev.flat(), 'END:VCALENDAR'].map(fold).join('\r\n') + '\r\n' };
}
function exportIcs() {
  const r = icsText(); if (!r.n) return toast('ما فيه مناسبات بتاريخ كامل (يوم وشهر). ضيفها من «عدّل»');
  download(`تقويم ${S.cur.name || 'العائلة'}.ics`, r.text, 'text/calendar;charset=utf-8'); toast(`نزّلت ${cnt(r.n, 'مناسبة وحدة', 'مناسبتين', 'مناسبات', 'مناسبة')}، افتح الملف وأضفها للتقويم`);
}

  for (const p of ps) { const n = kidsOf(p.id).length; if (n >= 1) { const c = mix([...new Set([n, n + 1, Math.max(0, n - 1), n + 2, n + 3])].filter(x => x !== n)).slice(0, 3); add('kc', `كم عدد عيال ${nm(p)} بالشجرة؟`, mix([n, ...c]).map(x => ({ t: String(x), ok: x === n })), null, p.id); } }
  if (me) for (const p of ps) { if (p.id === me.id) continue; const r = (relCore(me.id, p.id, true).rels[0] || {}).txt; if (!r || r.length > 22) continue; const d = mix(REL_POOL[p.g === 'f' ? 'f' : 'm'].filter(x => x !== r)).slice(0, 3); add('rl', `${nm(p)} وش ${p.g === 'f' ? 'تقرب' : 'يقرب'} لك؟`, mix([r, ...d]).map(x => ({ t: x, ok: x === r })), photo(p), p.id); }

function familyStory() {

    const p = n.p, f = p.g === 'f', sps = spousesOf(p.id), ks = kidsOf(p.id), yt = yearsText(p);

  }

}

    for (const [par, w, mn, mx] of [[fa, 'أبو' + he, 12, 85], [mo, 'أم' + he, 12, 58]]) {

    }
