<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1416">
<meta name="description" content="ديوني: سجّل الفلوس اللي أخذتها من الناس أو أعطيتها لهم، وكل دفعة بتاريخها ووقتها، واعرف كم باقي ومتى تخلص">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ديوني">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ديوني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1416;--card:#151d20;--card2:#1c2629;--card3:#243035;--line:#25333a;--input:#10181a;
  --text:#e9f2f0;--muted:#94a8a5;--faint:#66797a;
  --acc:#34d3a6;--acc2:#1fb5c2;--ink:#03211a;--acc-bg:rgba(52,211,166,.13);--acc-line:rgba(52,211,166,.45);
  --pos:#34d3a6;--neg:#ff7d8c;--warn:#ffb648;--pos-bg:rgba(52,211,166,.12);--neg-bg:rgba(255,125,140,.12);--warn-bg:rgba(255,182,72,.13);
  --blue:#7cb2ff;--blue-bg:rgba(124,178,255,.13);--chart:#22a883;
  --toast:#26323a;--scrim:rgba(3,8,10,.62);--shadow:0 12px 34px rgba(0,0,0,.38);--r:18px;
}
body.light{
  --bg:#f2f6f5;--card:#ffffff;--card2:#edf3f1;--card3:#e1eae7;--line:#dbe5e2;--input:#ffffff;
  --text:#14201e;--muted:#5a6c69;--faint:#8a9a97;
  --acc:#0e9f7b;--acc2:#0b8ea0;--ink:#ffffff;--acc-bg:rgba(14,159,123,.1);--acc-line:rgba(14,159,123,.45);
  --pos:#0b9572;--neg:#d23a57;--warn:#b26a00;--pos-bg:rgba(11,149,114,.1);--neg-bg:rgba(210,58,87,.09);--warn-bg:rgba(178,106,0,.1);
  --blue:#2f6fd6;--blue-bg:rgba(47,111,214,.1);--chart:#0e9f7b;
  --toast:#1f2a28;--scrim:rgba(15,30,26,.45);--shadow:0 10px 28px rgba(20,60,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.5;transition:background .2s,color .2s}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none;font-size:16px;transition:border-color .15s;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=date],input[type=datetime-local]{-webkit-appearance:none;appearance:none;text-align:right}
input::-webkit-date-and-time-value{text-align:right}
textarea{resize:vertical;min-height:64px;line-height:1.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:17px;height:17px}
[hidden]{display:none!important}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;transition:filter .2s}
.amt small{font-size:.72em;font-weight:700;opacity:.75}
body.hide .amt{filter:blur(8px)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.screen{max-width:620px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
/* الهيدر */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;margin:0 -16px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;flex:1;min-width:0;padding-inline-start:4px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2fd6a5,#139aa8);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 14px rgba(31,181,160,.35)}
.logo svg{width:21px;height:21px}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:-5px}
.ttl{flex:1;min-width:0;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--text);flex:none}
.ibtn:hover{background:var(--card2)}
.ibtn:active{transform:scale(.94)}
/* عام */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--muted);margin:20px 4px 8px}
.sec span{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2);color:var(--text);white-space:nowrap;transition:transform .1s,background .15s;min-height:46px;text-align:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn.dghost{background:var(--neg-bg);color:var(--neg)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px;min-height:38px}
.btn.block{width:100%}
.btn svg.i{width:19px;height:19px}
.link{color:var(--acc);font-weight:700;font-size:14px;padding:4px 2px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.qc{padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid transparent;font-size:14px;font-weight:600;min-height:38px;white-space:nowrap}
.qc.on{background:var(--acc-bg);border-color:var(--acc-line);font-weight:800}
.qc .amt{font-weight:800}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip svg.i{width:14px;height:14px}
.chip.bad{background:var(--neg-bg);color:var(--neg)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.good{background:var(--pos-bg);color:var(--pos)}.chip.blue{background:var(--blue-bg);color:var(--blue)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:11px;font-size:14.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.seg button small{font-weight:600;opacity:.8;font-size:12px}
.prog{height:9px;border-radius:99px;background:var(--card3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.av{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;color:#fff;background:var(--c,#888)}
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.55}
.alert svg.i{width:19px;height:19px;margin-top:1px}
.alert.bad{background:var(--neg-bg);color:var(--neg)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.good{background:var(--pos-bg);color:var(--pos)}
.alert.info{background:var(--card2);color:var(--muted)}
.alert .grow b{color:inherit}
.alert .btn{margin-inline-start:auto;align-self:center}
.empty{text-align:center;padding:30px 12px 10px;color:var(--muted)}
.empty .big{font-size:54px;line-height:1.1;margin-bottom:10px}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:6px;text-wrap:balance}
.empty p{text-wrap:pretty;max-width:430px;margin:0 auto 18px}
.feat{display:grid;gap:8px;text-align:start;margin:18px auto 0;max-width:430px}
.feat div{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.feat div span{font-size:20px;line-height:1.3}
/* الرئيسية */
.sum{background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 22%,var(--card)) 0%,var(--card) 62%);padding:18px}
.sum-l{font-size:14px;color:var(--muted);font-weight:600}
.sum-v{font-size:34px;font-weight:800;line-height:1.25;margin:2px 0 12px}
.sum-s{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.sum .alert{margin-top:12px}
.sum-acts{display:flex;gap:8px;margin-top:14px}
.sum-acts .btn{flex:1;padding:10px 8px;font-size:14px;min-height:42px}
.dcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;transition:transform .1s}
.dcard:active{transform:scale(.985)}
.dcard.late{border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.dmain{flex:1;min-width:0}
.dmain b{display:block;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmain .chips{gap:5px;margin-top:4px}
.dmain .prog{height:5px;margin-top:8px}
.dval{text-align:end;flex:none;max-width:45%}
.dval .amt{display:block;font-size:17px;font-weight:800}
.dval small{font-size:12px;color:var(--muted)}
.dcard.done{opacity:.8}
.search{position:relative;margin-bottom:10px}
.search input{padding-inline-start:40px;border-radius:14px;background:var(--card)}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--faint);width:19px;height:19px}
.banner{display:flex;align-items:center;gap:10px;background:var(--blue-bg);color:var(--text);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner svg.i{color:var(--blue)}
.fab{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:15px 26px;border-radius:999px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 40%,transparent);white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.97)}
/* صفحة الدين */
.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--c,var(--acc)) 24%,var(--card)) 0%,var(--card) 65%);padding:18px}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hero-top .av{width:50px;height:50px;font-size:21px}
.hero-top b{display:block;font-size:19px;font-weight:800}
.hero-top small{color:var(--muted);font-size:13px}
.hero-l{font-size:14px;color:var(--muted);font-weight:600}
.hero-v{font-size:36px;font-weight:800;line-height:1.25;margin:2px 0 12px}
.hero-s{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.hero .chips{margin-top:12px;gap:6px}
.acts{display:flex;gap:10px;margin-bottom:12px}
.acts .btn{flex:1;min-height:52px;font-size:16px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.tools button svg.i{color:var(--acc)}
.tools button:active{transform:scale(.96)}
.plan{border-color:var(--acc-line)}
.plan-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.plan-h svg.i{color:var(--acc)}
.plan-h b{flex:1;font-size:16px;font-weight:800}
.plan-next{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px;margin:10px 0}
.plan-next .cal{width:48px;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.plan-next .cal b{font-size:19px}
.plan-next .cal small{font-size:11px;color:var(--muted)}
.plan-next .grow small{display:block;color:var(--muted);font-size:13px}
.plan-next .grow b{font-size:15px}
.plan-next>.amt{font-size:18px;font-weight:800}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 6px}
.dots i{width:12px;height:12px;border-radius:4px;background:var(--card3)}
.dots i.on{background:var(--acc)}
.dots i.late{background:var(--neg)}
.plan-f{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.plan-b{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.plan-b .btn{flex:1}
.cta{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px dashed var(--acc-line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.cta svg.i{color:var(--acc);width:26px;height:26px}
.cta b{display:block;font-size:15px}
.cta small{color:var(--muted);font-size:13px}
.mhead{font-size:13px;font-weight:800;color:var(--muted);margin:14px 4px 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ent{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent:active{background:var(--card2)}
.ent-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ent-ic.pay{background:var(--pos-bg);color:var(--pos)}
.ent-ic.loan{background:var(--warn-bg);color:var(--warn)}
.ent-ic svg.i{width:19px;height:19px}
.ent-b{flex:1;min-width:0}
.ent-b b{display:block;font-size:15px}
.ent-b small{display:block;color:var(--muted);font-size:13px}
.ent-b .ent-n{color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent-a{text-align:end;flex:none}
.ent-a>.amt{display:block;font-size:16px;font-weight:800}
.ent-a small{font-size:12px;color:var(--faint)}
.note-box{background:var(--card2);border-radius:14px;padding:10px 13px;font-size:14px;color:var(--muted);margin-bottom:12px;white-space:pre-wrap}
/* الصفحات المنبثقة */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-wrap.in{opacity:1}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;max-height:94dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .24s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow);overflow:hidden}
.sheet-wrap.in .sheet{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sh-head h3{flex:1;font-size:18px;font-weight:800;min-width:0}
.sh-head h3 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.sh-body{padding:6px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sh-foot{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sh-foot .btn.pri{flex:1}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:20px}.sheet{border-radius:24px;max-height:90vh}}
.fld{display:block;margin-bottom:14px}
.fld>span{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin-bottom:6px}
.fld>span small{font-weight:500;color:var(--faint)}
.fld .chips{margin-top:8px}
.hint{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
.hint.bad{color:var(--neg)}
.hint.dh{margin:6px 2px 0;font-size:13px;line-height:1.5}
.big-in{font-size:24px!important;font-weight:800;text-align:center;letter-spacing:.5px;min-height:58px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-r{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.pl-r .amt{font-size:20px;font-weight:800}
.res{background:var(--acc-bg);border:1px solid var(--acc-line);border-radius:16px;padding:14px;margin-top:4px}
.res-big{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.6}
.res-big b,.res-big .amt{font-size:24px;font-weight:800;color:var(--acc)}
body.light .res-big b,body.light .res-big .amt{color:var(--acc)}
.res-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--acc-line);font-size:14px}
.res-row span{color:var(--muted)}
.res-row b{text-align:end}
.res .alert{margin-top:10px}
.sched{margin-top:12px}
.sched-r{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.sched-r:last-child{border-bottom:0}
.sched-r i{font-style:normal;width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.sched-r span{flex:1}
.sched-r.paid{opacity:.55}
.sched-r.paid i{background:var(--acc);color:var(--ink)}
.sched-r.late i{background:var(--neg);color:#fff}
.sched-more{text-align:center;color:var(--faint);padding:4px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:700}
.tbl td:last-child,.tbl th:last-child{text-align:end}
.menu-list{display:flex;flex-direction:column}
.menu-list button,.menu-list label.mi{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;width:100%;cursor:pointer}
.menu-list button:last-child{border-bottom:0}
.menu-list svg.i{color:var(--muted)}
.menu-list .danger,.menu-list .danger svg.i{color:var(--neg)}
.menu-list small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.set-g{background:var(--card2);border-radius:16px;padding:4px 14px;margin-bottom:12px}
.set-r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-r:last-child{border-bottom:0}
.set-r .grow b{display:block;font-size:15px}
.set-r .grow small{display:block;color:var(--muted);font-size:13px}
.set-r select,.set-r input{width:auto;min-width:0;max-width:52%;min-height:40px;padding:7px 10px;font-size:15px}
.set-r .seg{flex:none}
.set-r .seg button{padding:7px 12px}
.sw{position:relative;width:50px;height:30px;border-radius:99px;background:var(--card3);flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(-20px)}
.stmt{min-height:220px;font-size:14.5px}

.lock-in h2{font-size:24px;margin-bottom:4px}
.lock-in p{color:var(--muted);margin-bottom:18px;min-height:24px}

.stat{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:10px 12px;border-radius:12px;background:var(--card2)}

.vnote{text-align:center;color:var(--faint);font-size:13px;margin:22px 0 4px}
.vnote a{color:var(--acc);font-weight:700;text-decoration:none}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}.kv b{text-align:end}

  let h = `<div class="card plan"><div class="plan-h">${ic('target')}<b>الخطة: ${money(p.a)} ${FREQ[p.f]}</b>${ro ? '' : '<button class="link" data-act="planner">تعديل</button>'}</div>`;
  if (pi.late > 0) h += `<div class="alert bad">${ic('alert')}<span class="grow">${t.late} <b>${money(pi.late)}</b>${pi.lateN > 1 ? ` (${pInst(pi.lateN)})` : ''} من ${fDate(pi.lateSince)}</span>${ro ? '' : `<button class="btn sm danger" data-act="payamt" data-a="${pi.late}">${d.dir === 'out' ? 'سددته' : 'استلمته'}</button>`}</div>`;
  if (pi.ahead) h += `<div class="alert good">${ic('check')}<span class="grow">مسدد مقدماً لين قسط ${fDate(pi.ahead)}</span></div>`;
  if (pi.next) {
    const nd = toDate(pi.next.date);
    h += `<div class="plan-next"><span class="cal"><b>${dtf('dd', { day: 'numeric' }).format(nd)}</b><small>${dtf('mm', { month: 'short' }).format(nd)}</small></span>
      <span class="grow"><small>القسط الجاي${pi.next.a < p.a ? ' (الباقي منه)' : ''}${D.s.cal === 'b' ? ' · ' + fHijri(pi.next.date) : ''}</small><b>${dtf('wd', { weekday: 'long' }).format(nd)}، ${relDays(pi.next.date)}</b></span>${money(pi.next.a)}</div>`;
  }
  const dots = pi.n <= 60 ? `<div class="dots" aria-hidden="true">${pi.sch.map(s => `<i class="${s.cum <= pi.Pd ? 'on' : s.date < today() ? 'late' : ''}"></i>`).join('')}</div>` : '';
  h += dots + `<div class="plan-f"><span>${pi.instPaid} من ${pInst(pi.n)}</span><span>${t.will} ${fDate(pi.end, { y: true })} · ${relDays(pi.end)}</span></div>`;
  if (d.due && pi.end > d.due) h += `<div class="alert warn" style="margin-top:10px">${ic('clock')}<span class="grow">الخطة تخلص بعد الموعد المتفق عليه: ${fDate(d.due, { y: true })}</span></div>`;
  if (!ro) h += `<div class="plan-b">${pi.next && !pi.late ? `<button class="btn sm pri" data-act="payamt" data-a="${pi.next.a}">${ic('check', 's')}${d.dir === 'out' ? 'سددت القسط' : 'استلمت القسط'}</button>` : ''}<button class="btn sm" data-act="ics">${ic('cal', 's')}أضف للتقويم</button></div>`;
  return h + `</div>`;
}

/* ================= حاسبة وخطة السداد ================= */
function amountSuggestions(R) {
  const step = 10 ** DEC();
  const base = [100, 200, 300, 500, 750, 1000, 1500, 2000, 2500, 3000, 5000, 7500, 10000, 15000, 20000, 50000].map(v => v * step);
  return base.filter(v => { const n = Math.ceil(R / v); return n >= 2 && n <= 48; }).slice(-5);
}
function scheduleOf(R, a, f, start) {
  const n = Math.ceil(R / a); const out = [];
  for (let i = 0; i < n; i++) out.push({ date: addPeriod(start, f, i), a: i < n - 1 ? a : R - a * (n - 1) });
  return out;
}
function schedHTML(list, id) {
  const row = (s, i) => `<div class="sched-r"><i>${i + 1}</i><span>${fDate(s.date, { y: true, wd: false })}</span>${money(s.a)}</div>`;
  if (list.length <= 8) return list.map(row).join('');
  return list.slice(0, 4).map(row).join('') + `<button class="sched-more link" style="width:100%" data-more="${id}">… عرض كل الأقساط (${list.length})</button>` + list.slice(-2).map((s, j) => row(s, list.length - 2 + j)).join('');
}
function openPlanner(id) {
  const d = id ? getDebt(id) : null; const c = d ? calc(d) : null; const pi = d && c.rem > 0 ? planInfo(d, c) : null;
  const t = TX(d ? d.dir : 'out');
  const f0 = d && d.plan ? d.plan.f : 'm';
  const st = { R: d ? Math.max(0, c.rem) : 0, mode: 'fixed', f: f0, start: pi && pi.next ? pi.next.date : defStart(f0), amt: d && d.plan ? d.plan.a : 0, n: 0, end: '', round: 1, touched: !!(pi && pi.next), showAll: false };
  if (d && !d.plan && d.due && d.due > today()) { st.mode = 'period'; st.end = d.due; }
  const nChips = { m: [[3, '3 أشهر'], [6, '6 أشهر'], [10, '10 أشهر'], [12, 'سنة'], [18, 'سنة ونص'], [24, 'سنتين']], '2w': [[4, 'شهرين'], [6, '3 أشهر'], [12, '6 أشهر'], [26, 'سنة']], w: [[4, '4 أسابيع'], [8, 'شهرين'], [13, '3 أشهر'], [26, '6 أشهر'], [52, 'سنة']] };
  const el = openSheet(`${sheetHead(d ? 'خطة السداد' : 'حاسبة السداد', d ? esc(d.name) : 'احسب لأي مبلغ')}
    <div class="sh-body">
      ${d ? `<div class="pl-r"><span>${t.rem}</span>${money(st.R)}</div>` : amountField('p-R', 'المبلغ', '', 'مثلاً 10000')}
      <div class="seg" id="p-mode" style="margin-bottom:14px"><button data-v="fixed">مبلغ ثابت كل مرة</button><button data-v="period">أخلص في مدة محددة</button></div>
      <div class="fld"><span>كل كم؟</span><div class="chips" id="p-f">${Object.keys(FREQ).map(k => `<button class="qc" data-v="${k}">${FREQ[k]}</button>`).join('')}</div></div>
      <label class="fld"><span>أول قسط</span><input type="date" id="p-start" value="${st.start}"></label>
      <div id="p-fixed">${amountField('p-amt', t.planQ, st.amt ? plainN(st.amt) : '', 'مثلاً 500')}<div class="chips" id="p-aq" style="margin:-6px 0 14px"></div></div>
      <div id="p-period">
        <label class="fld"><span>كم قسط؟</span><input id="p-n" inputmode="numeric" placeholder="مثلاً 12" autocomplete="off"></label>
        <div class="chips" id="p-nq" style="margin:-6px 0 14px"></div>
        <label class="fld"><span>أو اختر آخر موعد تبي ${t.will} فيه</span><input type="date" id="p-end" value="${st.end}"></label>
        <div class="fld"><span>تقريب القسط</span><div class="chips" id="p-rd">${[[1, 'بدون كسور'], [10, 'لأقرب 10'], [50, 'لأقرب 50'], [100, 'لأقرب 100']].map(([v, l]) => `<button class="qc" data-v="${v}">${l}</button>`).join('')}</div></div>
      </div>
      <div id="p-res"></div>
    </div>
    ${d ? `<div class="sh-foot"><button class="btn pri" id="p-apply">${ic('check')}اعتمد الخطة</button>${d.plan ? `<button class="btn dghost" id="p-del">احذف الخطة</button>` : ''}</div>` : ''}`);
  const $e = s => $(s, el);
  const compute = () => {
    const R = st.R; if (!(R > 0)) return { err: d ? (d.dir === 'out' ? 'ما عليك شي لهالشخص' : 'ما فيه مبلغ باقي') : 'اكتب المبلغ' };
    if (!validISO(st.start)) return { err: 'اختر تاريخ أول قسط' };
    if (st.mode === 'fixed') {
      const a = st.amt; if (!(a > 0)) return { err: '' , empty: true };
      const n = Math.ceil(R / a); if (n > 600) return { err: 'المبلغ صغير مرة، بيحتاج أكثر من 600 قسط' };
      return { a, n, last: R - a * (n - 1), end: addPeriod(st.start, st.f, n - 1) };
    }
    let n = st.n;
    if (st.end) { if (!validISO(st.end)) return { err: 'التاريخ مو مضبوط' }; if (st.end < st.start) return { err: 'آخر موعد لازم يكون بعد أول قسط' }; n = countUntil(st.start, st.f, st.end); }
    if (!(n >= 1)) return { err: '', empty: true };
    if (n > 600) return { err: 'المدة طويلة مرة' };
    const step = st.round * 10 ** DEC();
    let a = Math.ceil(R / n / step) * step; if (a > R) a = R; if (a < 1) a = 1;
    const n2 = Math.ceil(R / a);

      const rows = items.map(x => { let a = Math.ceil(x.rem * B / R / step) * step; if (a > x.rem) a = x.rem; const k = Math.ceil(x.rem / a); return { ...x, a, end: addPeriod(st.start, st.f, k - 1), k }; });
      const end = rows.map(x => x.end).sort().pop();

      months.push({ date, parts }); k++;

    h += r.rows.map(x => `<tr><td><b>${esc(x.name)}</b><br><small class="muted">${money(x.rem)}</small></td><td>${st.how === 'even' ? money(x.a) : fDate(x.startD)}</td><td>${fDate(x.end, { y: true })}</td></tr>`).join('') + `</tbody></table>`;
    if (r.months) {
      const show = r.months.slice(0, 6);
      h += `<div class="sec"><span>أول ${show.length === 1 ? 'قسط' : pInst(show.length)}</span></div>` + show.map(m => `<div class="sched-r"><span><b>${fDate(m.date)}</b><br><small class="muted">${m.parts.map(p => `${esc(p.name)}: ${fmtN(p.a)}`).join('، ')}</small></span></div>`).join('');
      h += `<p class="hint">سجّل كل دفعة بدين صاحبها أول بأول، وأنا أحدّث الباقي.</p>`;
    }

  $e('#a-B').addEventListener('input', () => { st.B = parseAmount($e('#a-B').value) || 0; draw(); });
  bindChips($e('#a-f'), v => { st.f = v; if (!st.touched) { st.start = defStart(v); setDate($e('#a-start'), st.start); } draw(); });
  $e('#a-start').addEventListener('change', () => { if (validISO($e('#a-start').value)) { st.start = $e('#a-start').value; st.touched = true; draw(); } });
  bindChips($e('#a-how'), v => { st.how = v; draw(); });
  $e('#a-apply').onclick = async () => {
    const r = sim(); if (!r || r.err) return;
    if (items.some(x => getDebt(x.id).plan) && !(await ask('بعض الديون لها خطة، تبي تستبدلها؟', { ok: 'استبدلها' }))) return;
    for (const x of r.rows) { const d = getDebt(x.id); d.plan = { a: x.a, f: st.f, start: st.start, pre: d.entries.filter(e => e.k === 'pay').map(e => e.id), ts: Date.now() }; }
    save(); await closeSheet(); render(); toast('تم حفظ خطة لكل دين');
  };
  draw(); setTimeout(() => $e('#a-B').focus(), 260);

function waPhone(p) {
  let s = norm(p).replace(/[^\d+]/g, ''); if (!s) return '';
  if (s.startsWith('+')) s = s.slice(1); else if (s.startsWith('00')) s = s.slice(2);
  else if (/^05\d{8}$/.test(s)) s = '966' + s.slice(1); else if (/^5\d{8}$/.test(s)) s = '966' + s;
  return s;
}

  const pi = c.rem > 0 ? planInfo(d, c) : null;
  if (pi) {

/* ================= التقويم (ics) ================= */
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
/* يقص السطر كل 73 بايت بدون ما يقطع حرف عربي */
function icsFold(line) {
  const enc = new TextEncoder(); if (enc.encode(line).length <= 73) return line;
  const out = []; let cur = '', n = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 73) { out.push(cur); cur = ''; n = 1; } cur += ch; n += b; }
  out.push(cur); return out.join('\r\n ');
}
function downloadICS(id) {
  const d = getDebt(id); if (!d) return; const c = calc(d); const pi = planInfo(d, c);
  if (!pi || c.rem <= 0) { toast('ما فيه أقساط جاية'); return; }
  const t = today(); const items = [];
  for (const s of pi.sch) { if (s.cum <= pi.Pd || s.date < t) continue; items.push({ date: s.date, a: Math.min(s.a, s.cum - pi.Pd), i: s.i }); if (items.length >= 120) break; }
  if (!items.length) { toast('ما فيه أقساط جاية'); return; }
  const ymd = iso => iso.replace(/-/g, ''); const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//tajarib//dyooni//AR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ديوني'];
  for (const it of items) {
    const title = d.dir === 'out' ? `قسط ${moneyT(it.a)} لـ${d.name}` : `قسط ${moneyT(it.a)} من ${d.name}`;
    const desc = `القسط ${it.i + 1} من ${pi.n} · ديوني`;
    L.push('BEGIN:VEVENT', `UID:${d.id}-${it.i}-${d.plan.ts || 0}@dyooni`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(it.date)}`, `DTEND;VALUE=DATE:${ymd(addDays(it.date, 1))}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, 'TRIGGER:-PT15H', 'END:VALARM',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  const blob = new Blob([L.map(icsFold).join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `aqsat-${ymd(t)}.ics`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(`افتح الملف عشان تضيف ${pInst(items.length)} لتقويمك، مع تذكير قبلها بيوم`);
}

/* ================= رابط لصاحب الدين (السيرفر المشترك) =================
   الدين ينرفع كمستند «ديوني» على سيرفر تجارب: صاحب الجوال معه مفتاح التعديل، وصاحب الدين معه رابط العرض بس.
   ما نستخدم نسخة المستند المحفوظة بالجهاز من sync.js، عشان صور الإيصالات ما تملا مساحة التطبيقات الثانية بنفس الموقع.
   بدالها نحفظ بصمة لكل سطر انرسل، ونرسل بس اللي تغيّر. */
const T = window.Tajarib || null;

async function apiReq(method, path, body) {
  if (!T || !T.server()) throw apiErr('nosync');
  let r; try { r = await fetch(T.server() + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); } catch (e) { throw apiErr('net'); }
  let j = null; try { j = await r.json(); } catch (e) { }

}
function errText(e) {
  const c = e && (e.code || e);
  if (c === 'bad_kind') return 'السيرفر يحتاج تحديث عشان يدعم روابط ديوني';
  if (c === 'nosync') return 'ما قدرت أحمّل المزامنة، تأكد من النت وافتح التطبيق مرة ثانية';
  return T ? T.errorText(e) : 'صار خطأ، جرّب مرة ثانية';
}
const appBase = () => location.href.split('#')[0].split('?')[0];
const shareLink = sh => T ? T.joinLink(appBase(), sh.id, sh.view) : '';
const PHOTO_BUDGET = 2200000; /* حد المستند بالسيرفر 3 ميغا، فالصور الأحدث تنرسل لين 2.2 ميغا تقريباً */
function photoSet(d) {
  const out = new Set(); if (!d.share || !d.share.photos) return out; let n = 0;
  for (const e of d.entries.filter(x => x.img).sort((a, b) => byAt(b, a))) { const z = e.isz || 80000; if (n + z > PHOTO_BUDGET) continue; n += z; out.add(e.id); }
  return out;
}
/* اللي يطلع لصاحب الدين: المبالغ والتواريخ وملاحظات الدفعات والخطة. اسم الدين عندك وملاحظتك ورقم جواله ما ينرسلون */
function shareMeta(d) {
  const c = CURS.find(x => x[0] === D.s.cur) || CURS[0];
  return { dir: d.dir, who: D.s.myName || '', cur: [c[0], c[1], c[2], c[3]], due: d.due || '', plan: d.plan ? { a: d.plan.a, f: d.plan.f, start: d.plan.start, pre: d.plan.pre || [] } : null };
}
function shareItems(d, photos) { const items = {}; for (const e of d.entries) items['e' + e.id] = { k: e.k, a: e.a, at: e.at, n: e.n || '', m: e.m || '', r: photos.has(e.id) ? 1 : 0 }; return items; }
const shareSt = {}; let shareRender = null, syncT = 0, syncRetryT = 0;
const syncing = new Set(), syncAgain = new Set();
const shareBad = d => !!(d.share && (d.share.dead || (shareSt[d.id] && (shareSt[d.id].s === 'offline' || shareSt[d.id].s === 'error'))));
function setShareStatus(id, st, e) {
  const d = getDebt(id), was = d ? shareBad(d) : false;
  shareSt[id] = { s: st, msg: e ? errText(e) : '' };
  if (shareRender && shareRender.id === id) shareRender.fn();
  if (d && V.debt === id && !V.vw && was !== shareBad(d)) render();
}
function scheduleSync(ms = 700) { clearTimeout(syncT); syncT = setTimeout(syncAll, ms); }
async function syncAll() { if (!T) return; retryTrash(); for (const d of D.debts.slice()) if (d.share && !d.share.dead) await syncShare(d); }
async function syncShare(d) {
  if (syncing.has(d.id)) { syncAgain.add(d.id); return; }
  syncing.add(d.id); const sh = d.share;
  try {
    sh.sent = sh.sent || {};
    const photos = photoSet(d), want = shareItems(d, photos), ops = [];
    for (const [id, it] of Object.entries(want)) { const h = hashS(JSON.stringify(it)); if (sh.sent[id] !== h) ops.push({ id, it, h }); }
    for (const e of d.entries) if (photos.has(e.id) && sh.sent['r' + e.id] !== e.img) ops.push({ id: 'r' + e.id, img: e.img, h: e.img });
    for (const id of Object.keys(sh.sent)) if (!(id in want) && !(id[0] === 'r' && photos.has(id.slice(1)))) ops.push({ id, del: true, h: null });
    const meta = shareMeta(d), mh = hashS(JSON.stringify(meta)); let metaDirty = sh.mh !== mh;
    if (!ops.length && !metaDirty) { setShareStatus(d.id, 'ok'); return; }
    setShareStatus(d.id, 'saving');
    let i = 0;
    while (i < ops.length || metaDirty) {
      const items = {}, done = [], u = Date.now(); let size = 0;
      while (i < ops.length) {
        const op = ops[i]; let it;
        if (op.del) it = { del: 1, u };
        else if (op.img) { const data = await getImg(op.img); if (!data) { i++; continue; } it = { img: data, u }; }
        else it = { ...op.it, u };
        const z = op.id.length + JSON.stringify(it).length + 8;
        if (done.length && (size + z > 900000 || done.length >= 400)) break;
        items[op.id] = it; size += z; done.push(op); i++;
      }
      const body = { k: sh.edit, items }; if (metaDirty) body.meta = { ...meta, u };
      await apiReq('PATCH', `/api/docs/${encodeURIComponent(sh.id)}`, body);
      if (d.share !== sh) return; /* انوقف الرابط وهو يرفع */
      for (const op of done) { if (op.h === null) delete sh.sent[op.id]; else sh.sent[op.id] = op.h; }

    setShareStatus(d.id, e.code === 'net' ? 'offline' : 'error', e);

function bkOpen(id, key, join) {
  if (!T) return;
  bkJoin = !!join; bkJoinToast = !!join;
  BK = T.open({
    id, key, poll: 10000,
    onChange: how => { if (how && how.remote) bkRemote(); },
    onStatus: (st, msg) => {
      bkSt = { s: st, msg };
      if (BK && BK.error && (BK.error.code === 'bad_key' || BK.error.code === 'not_found') && D.s.bk) { D.s.bk.dead = BK.error.code; bkJoin = false; saveQuiet(); }
      if (bkRender) bkRender();
    }
  }).start();
}
function bkClose() { if (BK) { BK.stop(); if (T) T.forget(BK.id); BK = null; } bkJoin = false; if (D.s.bk) { D.s.bk = null; saveQuiet(); } bkSt = { s: 'idle', msg: '' }; }
async function bkEnable() {
  if (!T) throw apiErr('nosync');
  const r = await T.create('dyooni', { items: bkItems(), meta: bkMeta() });
  D.s.bk = { id: r.id, key: r.edit, at: Date.now() }; saveQuiet(); bkOpen(r.id, r.edit, false);
}
async function bkLinkPrompt(id, key) {
  if (D.s.bk && D.s.bk.id === id && !D.s.bk.dead) { toast('هالجهاز مربوط بنفس النسخة'); return; }
  if (!T) { toast(errText('nosync')); return; }
  const n = D.debts.length;
  const r = await ask('ترجع ديونك من النسخة التلقائية؟', { sub: n ? `ديونك اللي بهالجهاز (${pDebts(n)}) بتنضم معها، وبعدها أي تعديل بأي جهاز يوصل للثاني` : 'كل ديونك ودفعاتك بترجع، وأي تعديل بعدها يوصل لكل الأجهزة المربوطة', ok: 'رجّعها' });
  if (!r) return;
  bkClose(); D.s.bk = { id, key, at: Date.now() }; saveQuiet(); bkOpen(id, key, true); toast('لحظة، أجيب ديونك…');
}
function drawBk(box) {
  if (!box) return; const bk = D.s.bk;
  if (!T) { box.innerHTML = `<p class="hint" style="padding:10px 0">${errText('nosync')}</p>`; return; }
  if (!bk) box.innerHTML = `<div style="padding:12px 0"><p style="font-size:14px;margin-bottom:10px">ديونك تنحفظ لحالها على سيرفر تجارب أول بأول، ويكون معك رابط استرجاع. لو ضاع جوالك أو غيّرته، تفتح الرابط وترجع كل ديونك. وتقدر تستخدم نفس الرابط بجوالين مع بعض.</p><button class="btn pri block" data-bk="on">${ic('cloud')}شغّل النسخة التلقائية</button></div>`;
  else if (bk.dead) box.innerHTML = `<div style="padding:12px 0"><div class="alert warn" style="margin-bottom:10px">${ic('alert')}<span class="grow">النسخة انحذفت من السيرفر أو انربطت برابط ثاني</span></div><div class="row" style="gap:8px"><button class="btn sm pri grow" data-bk="renew">سوّ نسخة جديدة</button><button class="btn sm grow" data-bk="off">افصلها</button></div></div>`;
  else {
    const st = bkSt.s, tx = st === 'saving' ? 'يحفظ آخر التعديلات…' : st === 'offline' ? 'ينتظر النت، وأول ما يرجع يحفظ' : st === 'error' ? (bkSt.msg || 'صار خطأ') : 'محفوظة، وأي تعديل ينحفظ على طول';
    box.innerHTML = `<div style="padding:12px 0"><div class="stat ${st === 'idle' ? 'ok' : st}"><i></i><span class="grow">${esc(tx)}</span></div>
      <p class="hint" style="margin-top:10px">رابط الاسترجاع: احفظه عندك (أرسله لنفسك). اللي معه هالرابط يقدر يشوف ويعدّل ديونك، فلا ترسله لأحد.</p>
      <div class="linkbox"><input readonly value="${esc(bkLink())}" aria-label="رابط الاسترجاع"><button class="btn sm" data-bk="copy">${ic('copy', 's')}نسخ</button></div>
      <div class="row" style="gap:8px">${navigator.share ? `<button class="btn sm grow" data-bk="share">${ic('share', 's')}أرسله لنفسك</button>` : ''}<button class="btn sm grow" data-bk="off">افصل هالجهاز</button><button class="btn sm dghost" data-bk="del">احذفها</button></div>
      <p class="hint">صور الإيصالات ما تنحفظ هنا، تنحفظ بنسخة الملف.</p></div>`;
  }
  box.onclick = async ev => {
    const b = ev.target.closest('[data-bk]'); if (!b || b.disabled) return; const a = b.dataset.bk;
    if (a === 'on' || a === 'renew') { b.disabled = true; try { if (a === 'renew') bkClose(); await bkEnable(); toast('تم، احفظ رابط الاسترجاع عندك'); } catch (x) { toast(errText(x)); } drawBk(box); }
    else if (a === 'copy') copyText(bkLink());
    else if (a === 'share') navigator.share({ text: `رابط استرجاع ديوني (لا ترسله لأحد):\n${bkLink()}` }).catch(() => { });
    else if (a === 'off') { if (!(await ask('تفصل هالجهاز عن النسخة التلقائية؟', { sub: 'ديونك تبقى بالجهاز وبالسيرفر، بس تعديلات هالجهاز ما عاد تنحفظ هناك', ok: 'افصله' }))) return; bkClose(); drawBk(box); toast('انفصل الجهاز'); }
    else if (a === 'del') {
      if (!(await ask('تحذف النسخة التلقائية من السيرفر؟', { sub: 'رابط الاسترجاع يوقف، وأي جهاز ثاني مربوط فيها ينفصل. ديونك تبقى بهالجهاز', ok: 'احذفها', danger: true }))) return;
      try { await T.remove(bk.id, bk.key); } catch (x) { if (x.code !== 'not_found' && x.code !== 'bad_key') { toast(errText(x)); return; } }
      bkClose(); drawBk(box); toast('انحذفت النسخة التلقائية');
    }
  };
}

/* ================= روابط تفتح شي معيّن ================= */
/* #r= رابط الاسترجاع، #d= دين (برقمه أو برقم رابطه)، #v= كشف وصلك */
function handleHash(h) {
  let m;
  if ((m = /[#&]r=([\w-]+)\.([\w-]+)/.exec(h || ''))) { bkLinkPrompt(m[1], m[2]); return true; }
  if ((m = /[#&]d=([\w-]+)/.exec(h || ''))) {
    const d = D.debts.find(x => x.id === m[1] || (x.share && x.share.id === m[1]));
    if (d) { if (V.vw) closeView(); V.sum = false; V.dir = d.dir; if (V.debt !== d.id) openDebt(d.id); if (d.share) fetchShareStatus(d, true); }
    return true;
  }
  if ((m = /[#&]v=([\w-]+)/.exec(h || ''))) { const sv = (D.views || []).find(x => x.id === m[1]); if (sv && !(V.vw && V.vw.id === sv.id)) openView(sv, true); return true; }
  return false;
}

/* ================= القفل ================= */
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (window.crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); }
  let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619) >>> 0; } return 'f' + h.toString(16);
}
const PAD_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
function makePad(padEl, dotsEl, onDone) {
  let v = '';
  const dots = () => $$('i', dotsEl).forEach((d, i) => d.classList.toggle('on', i < v.length));
  padEl.innerHTML = PAD_KEYS.map(k => k === '' ? '<button class="ghost" disabled aria-hidden="true"></button>' : k === 'del' ? `<button class="ghost" data-k="del" aria-label="امسح">⌫</button>` : `<button data-k="${k}">${k}</button>`).join('');
  const press = k => { if (k === 'del') v = v.slice(0, -1); else if (v.length < 4) v += k; dots(); if (v.length === 4) { const x = v; setTimeout(() => { onDone(x, () => { v = ''; dots(); }); }, 120); } };
  padEl.onclick = e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
  return { press, reset: () => { v = ''; dots(); } };
}
let lockPad = null;
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); if (navigator.vibrate) navigator.vibrate(120); }
function showLock() {
  if (!D.s.pin) { document.body.classList.remove('locked'); return; }
  document.body.classList.add('locked'); $('#lock-msg').textContent = 'اكتب الرقم السري';
  if (!lockPad) lockPad = makePad($('#lock-pad'), $('#lock-dots'), async (v, reset) => {
    if (await hashPin(v, D.s.pin.salt) === D.s.pin.h) { document.body.classList.remove('locked'); reset(); render(); if (pendingHash) { const h = pendingHash; pendingHash = ''; handleHash(h); } }
    else { $('#lock-msg').textContent = 'الرقم غلط، جرّب مرة ثانية'; shake($('#lock-dots')); reset(); }
  });
  lockPad.reset();
}
document.addEventListener('keydown', e => { if (document.body.classList.contains('locked') && lockPad) { if (/^\d$/.test(norm(e.key))) lockPad.press(norm(e.key)); else if (e.key === 'Backspace') lockPad.press('del'); } });
$('#lock-forgot').onclick = async () => {
  if (!(await ask('نسيت الرقم السري؟', { sub: 'ما فيه طريقة ترجعه. تقدر تمسح كل البيانات وتبدأ من جديد، وبعدها ترجّع نسخة احتياطية لو عندك.', ok: 'امسح وابدأ من جديد', danger: true }))) return;
  if (!(await ask('متأكد؟ كل الديون والدفعات بتنمسح', { ok: 'إيه امسح', danger: true }))) return;
  const shs = D.debts.filter(d => d.share).map(d => d.share); bkClose();
  D = blank(); save(); applyTheme(); document.body.classList.remove('locked', 'hide'); render();
  IDB.clear().catch(() => { }); imgCache.clear(); shs.forEach(dropShare);
};
function setupPin(after) {
  let first = null;
  const el = openSheet(`${sheetHead('قفل برقم سري')}<div class="sh-body" style="text-align:center"><p class="muted" id="pn-msg" style="margin-bottom:16px">اختر رقم من 4 خانات</p><div class="pin-dots" id="pn-dots"><i></i><i></i><i></i><i></i></div><div class="pad" id="pn-pad"></div><p class="hint" style="margin-top:16px">لو نسيته ما فيه طريقة ترجعه، فخذ نسخة احتياطية.</p></div>`);
  makePad($('#pn-pad', el), $('#pn-dots', el), async (v, reset) => {
    if (!first) { first = v; reset(); $('#pn-msg', el).textContent = 'اكتبه مرة ثانية عشان نتأكد'; return; }
    if (v !== first) { first = null; reset(); $('#pn-msg', el).textContent = 'ما تطابق، اختر رقم من جديد'; shake($('#pn-dots', el)); return; }
    const salt = uid(); D.s.pin = { salt, h: await hashPin(v, salt) }; save(); await closeSheet(); toast('تم، التطبيق صار مقفول برقم'); after && after();
  });
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (D.s.pin && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
});

/* ================= الأزرار ================= */
const ACT = {
  tab: b => { V.dir = b.dataset.v; V.q = ''; render(); },
  open: b => openDebt(b.dataset.id),
  new: () => V.debt ? null : openDebtForm(),
  settings: () => openSettings(),
  hide: () => toggleHide(),
  back: () => goHome(),
  pay: () => openEntry(V.debt, 'pay'),
  payamt: b => openEntry(V.debt, 'pay', null, +b.dataset.a),
  loan: () => openEntry(V.debt, 'loan'),
  entry: b => openEntry(V.debt, null, b.dataset.id),
  planner: () => openPlanner(V.debt),
  calc: () => openPlanner(null),
  allplan: () => openAllPlan(),
  statement: () => openStatement(V.debt),
  ics: () => downloadICS(V.debt),
  more: () => openMore(V.debt),
  edit: () => openDebtForm(V.debt),
  call: () => { const d = getDebt(V.debt); if (d && d.phone) location.href = 'tel:' + d.phone.replace(/[^\d+]/g, ''); },
  toggleDone: () => { V.showDone = !V.showDone; render(); },
  share: () => openShare(V.debt),
  summary: () => openSummary(),
  sback: () => { if (history.state && history.state.sum && navDepth > 0) history.back(); else { history.replaceState({}, ''); V.sum = false; render(); } },
  budget: () => openBudget(),
  ack: b => sendAck(b.dataset.id, b.dataset.s),
  vpush: () => viewPush(),
  vpdf: () => { const x = V.vw && V.vw.data; if (x) printStatement(x.d, calc(x.d), { ro: true, imgs: x.imgs, acks: x.acks }); },
  openview: b => { const s = (D.views || []).find(x => x.id === b.dataset.id); if (s) openView(s, true); },
  vback: () => { if (history.state && history.state.vw && navDepth > 0) history.back(); else { history.replaceState({}, '', appBase()); closeView(); V.debt = null; render(); window.scrollTo(0, 0); } },
  vrefresh: () => { if (V.vw) { V.vw.rev = 0; fetchView(); toast('يحدّث…'); } },
  vimg: b => { const x = V.vw && V.vw.data; const src = x && x.imgs[b.dataset.id]; if (src) viewImage(src); },
  rmview: async () => { if (!V.vw) return; if (!(await ask('تشيل هالكشف من قائمتك؟', { sub: 'لو فتحت الرابط مرة ثانية يرجع', ok: 'شيله' }))) return; D.views = (D.views || []).filter(x => x.id !== V.vw.id); saveQuiet(); ACT.vback(); },
  backup: () => exportBackup(),
  snooze: () => { D.s.snooze = Date.now() + 14 * 864e5; save(); render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('.sheet') || b.closest('.dlg')) return;
  if (b.disabled) return; const f = ACT[b.dataset.act]; if (f) f(b, e);
});

/* ================= البداية ================= */
applyTheme();
if (D.s.hide) document.body.classList.add('hide');
/* إذا انفتح التطبيق من رابط كشف، نعرض الكشف على طول بدون قفل (القفل يحمي ديونك أنت، والكشف مو منها) */
const J0 = T && T.parseJoin(location.hash);
if (J0) { viewBypass = !!D.s.pin; document.body.classList.remove('locked'); history.replaceState({ vw: J0.id }, ''); openView(J0, false); }
else {
  const h0 = location.hash; history.replaceState({}, '', h0 ? appBase() : undefined); render(); showLock();
  /* روابط النسخة التلقائية والتنبيهات: #r= #d= #v= (بعد فتح القفل إذا فيه قفل) */
  if (h0) { if (document.body.classList.contains('locked')) pendingHash = h0; else handleHash(h0); }
}
if (D.s.bk && T && !D.s.bk.dead) bkOpen(D.s.bk.id, D.s.bk.key, false);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { const g = e.data && e.data.go; if (g && !document.body.classList.contains('locked')) handleHash('#' + g); });
setTimeout(() => { if (D.s.push) syncPush().catch(() => { }); }, 3500);
window.addEventListener('hashchange', () => {
  if (document.body.classList.contains('locked')) return;
  const j = T && T.parseJoin(location.hash); if (j) { if (!(V.vw && V.vw.id === j.id)) openView(j, true); return; }
  if (handleHash(location.hash)) history.replaceState(history.state, '', appBase());
});
window.addEventListener('online', () => { if (D.debts.some(d => d.share)) scheduleSync(0); if (V.vw) fetchView(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return; if (V.vw) fetchView(); if (D.debts.some(d => d.share && !d.share.dead)) scheduleSync(300);
  const d = V.debt && getDebt(V.debt); if (d && d.share && !d.share.dead) fetchShareStatus(d);
});
setTimeout(() => { if (D.debts.some(d => d.share) || (D.s.trash || []).length) syncAll(); gcImages(); }, 2500);
/* يحدّث "اليوم" و"بكرة" لو بقي التطبيق مفتوح لين اليوم الثاني */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!sheets.length) render(); } }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
